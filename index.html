            e('div', { className: 'bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden' },
              e('div', { className: 'p-5 border-b border-slate-200 flex items-start justify-between bg-slate-50' },
                e('div', null,
                  e('div', { className: 'flex items-center gap-2 flex-wrap' },
                    e('span', { className: 'text-2xs font-bold px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-800' }, '과제 ' + n),
                    e(StatusBadge, { status: st })
                  ),
                  e('h3', { className: 'text-base font-black text-slate-900 mt-1' }, sub.studentName + ' (' + sub.studentId + ') 학생의 과제 ' + n + ' 보고서')
                ),
                e('button', { onClick: function() { setSlotViewer(null); }, className: 'text-slate-400 hover:text-slate-600' },
                  e('i', { className: 'fa-solid fa-xmark text-lg' })
                )
              ),
              e('div', { className: 'p-6 overflow-y-auto space-y-5 flex-1 text-xs' },
                e(ReportView, { report: rep }),
                gradable ? renderGradePanel(slot) : renderNotGradable()
              ),
              e('div', { className: 'p-4 border-t border-slate-200 bg-slate-50 flex items-center justify-end gap-2' },
                e('button', { onClick: function() { setSlotViewer(null); }, className: 'px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100' }, gradable ? '취소' : '닫기'),
                gradable && e('button', { onClick: function() { saveGrading(slotViewer.studentId, [slot]); }, className: 'px-5 py-2 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs shadow' },
                  st.kind === 'graded' ? '과제 ' + n + ' 점수 수정 저장' : '과제 ' + n + ' 채점 저장')
              )
            )
          );
        })(),

        // [신규 모달] 교사용 개별 학생 정보 수정 및 삭제 모달
        editingStudentModal && editingStudentTargetId && e('div', { className: 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in' },
          e('div', { className: 'bg-white rounded-3xl border border-slate-200 p-6 max-w-md w-full space-y-4 shadow-2xl overflow-hidden' },
            e('div', { className: 'flex items-center justify-between pb-3 border-b border-slate-100' },
              e('div', { className: 'flex items-center gap-2' },
                e('div', { className: 'w-7 h-7 rounded-lg bg-rose-600 text-white flex items-center justify-center text-xs font-bold' },
                  e('i', { className: 'fa-solid fa-user-gear' })
                ),
                e('div', null,
                  e('h3', { className: 'text-sm font-black text-slate-900' }, '학생 개별 정보 편집 및 삭제'),
                  e('p', { className: 'text-2xs text-slate-500' }, '학번/성명을 수정하거나 해당 학생의 모든 기록을 삭제합니다.')
                )
              ),
              e('button', { onClick: function() { setEditingStudentModal(false); setEditingStudentTargetId(null); }, className: 'text-slate-400 hover:text-slate-600' },
                e('i', { className: 'fa-solid fa-xmark text-lg' })
              )
            ),

            e('form', { onSubmit: saveStudentInfoEdit, className: 'space-y-3.5 text-xs' },
              e('div', null,
                e('label', { className: 'block font-bold text-slate-700 mb-1' }, '학번 (4자리 숫자)'),
                e('input', {
                  type: 'text',
                  maxLength: 4,
                  value: editingStudentForm.id,
                  onChange: function(ev) { setEditingStudentForm(Object.assign({}, editingStudentForm, { id: ev.target.value })); },
                  placeholder: '4자리 학번',
                  className: 'w-full p-2.5 border rounded-xl font-mono text-xs focus:ring-2 focus:ring-rose-500',
                  required: true
                })
              ),
              e('div', null,
                e('label', { className: 'block font-bold text-slate-700 mb-1' }, '성명'),
                e('input', {
                  type: 'text',
                  value: editingStudentForm.name,
                  onChange: function(ev) { setEditingStudentForm(Object.assign({}, editingStudentForm, { name: ev.target.value })); },
                  placeholder: '학생 성명',
                  className: 'w-full p-2.5 border rounded-xl text-xs focus:ring-2 focus:ring-rose-500',
                  required: true
                })
              ),

              e('div', { className: 'pt-2 flex items-center justify-between gap-2' },
                e('button', {
                  type: 'button',
                  onClick: deleteSingleStudent,
                  className: 'px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold border border-rose-200 transition flex items-center gap-1.5'
                },
                  e('i', { className: 'fa-solid fa-trash-can' }),
                  e('span', null, '이 학생 기록 삭제')
                ),
                e('div', { className: 'flex items-center gap-1.5' },
                  e('button', {
                    type: 'button',
                    onClick: function() { setEditingStudentModal(false); setEditingStudentTargetId(null); },
                    className: 'px-3 py-2 rounded-xl border text-slate-600 hover:bg-slate-50 font-bold'
                  }, '취소'),
                  e('button', {
                    type: 'submit',
                    className: 'px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold shadow'
                  }, '정보 수정 저장')
                )
              )
            )
          )
        ),

        // 교사 로그인 모달
        showTeacherModal && e('div', { className: 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm' },
          e('div', { className: 'bg-white rounded-3xl border border-slate-200 p-6 max-w-sm w-full space-y-4 shadow-2xl' },
            e('div', { className: 'flex items-center justify-between pb-2 border-b' },
              e('div', { className: 'flex items-center gap-2' },
                e('i', { className: 'fa-solid fa-shield-halved text-purple-600' }),
                e('h3', { className: 'text-sm font-black text-slate-900' }, '교사 관리자 모드 접속')
              ),
              e('button', { onClick: function() { setShowTeacherModal(false); }, className: 'text-slate-400 hover:text-slate-600' },
                e('i', { className: 'fa-solid fa-xmark text-lg' })
              )
            ),
            e('form', { onSubmit: handleTeacherLogin, className: 'space-y-3' },
              e('input', { type: 'text', placeholder: '교사 아이디', value: teacherIdInput, onChange: function(ev) { setTeacherIdInput(ev.target.value); }, className: 'w-full px-3 py-2 text-xs border rounded-xl font-mono', required: true }),
              e('input', { type: 'password', maxLength: 6, placeholder: '비밀번호 6자리 숫자', value: teacherPwInput, onChange: function(ev) { setTeacherPwInput(ev.target.value); }, className: 'w-full px-3 py-2 text-xs border rounded-xl font-mono tracking-widest', required: true }),
              e('button', { type: 'submit', className: 'w-full py-2.5 rounded-xl bg-purple-600 text-white font-bold text-xs shadow' }, '관리자 로그인')
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
