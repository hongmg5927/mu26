      { id: 'so_7', subjectId: 'social', subjectName: '사회', question: '글로벌 틱톡(TikTok) 숏폼 챌린지가 빌보드 차트 역주행에 미치는 네트워크 효과', concept: '네트워크 효과, 바이럴 마케팅, 문화 확산 이론', hypothesis: '숏폼 챌린지 생성 영상 수가 임계점(10만 개)을 돌파하면 음원 차트 순위가 지수함수적으로 급상승할 것이다.', variables: '독립: 틱톡 챌린지 영상 누적 수 / 종속: 스포티파이 일간 스트리밍 횟수 / 통제: 숏폼 바이럴 히트곡 5곡', activity: '틱톡 해시태그 뷰 수와 스포티파이 일간 재생 수의 시차 상관 분석(Cross-correlation) 수행' },

      { id: 'so_8', subjectId: 'social', subjectName: '사회', question: '광고 속 배경음악(CM송)의 징글(Jingle) 사운드가 브랜드 회상도에 미치는 심리학적 각인', concept: '광고 심리학, 징글, 브랜드 자산', hypothesis: '3음 내외의 짧은 시그니처 사운드를 가진 브랜드는 무음 광고 브랜드보다 인지 회상률이 50% 이상 높을 것이다.', variables: '독립: 징글 사운드 유무 / 종속: 1주일 후 브랜드 로고 매칭 회상 정답률 / 통제: 광고 노출 시간(15초)', activity: '피험자 그룹을 나누어 광고 노출 후 브랜드 설문 조사를 진행해 t-검정 통계 분석' },

      { id: 'so_9', subjectId: 'social', subjectName: '사회', question: '국가 행사(올림픽, 월드컵) 응원가의 떼창 구조와 내집단 연대감(In-group solidarity) 고취', concept: '사회 통합, 상징 상호작용론, 집단 정체성', hypothesis: '단순한 후렴구 합창과 북 박자가 결합된 응원가는 공동체 소속감을 유의미하게 상승시킬 것이다.', variables: '독립: 응원가 청취 및 가창 참여 유무 / 종속: 국가적 유대감 척도 점수 / 통제: 2002 월드컵 및 최근 국가대표 경기 응원가', activity: '응원가 가창 전후의 심리적 소속감 척도를 설문하고 음성 파형의 군집 동조성 분석' },

      { id: 'sc_1', subjectId: 'science', subjectName: '과학', question: '공간 구조와 흡음재 재질에 따른 소리 감쇠 시간(RT60) 측정', concept: '파동의 반사와 흡수, 음향 감쇠율, 잔향 시간', hypothesis: '매끄러운 타일 마감 공간일수록 흡음률이 낮아 -60dB 감쇠 도달 시간이 가장 길 것이다.', variables: '독립: 공간 마감재(타일 vs 석고보드 vs 패브릭) / 종속: 소리 감쇠 시간(초) / 통제: 동일 박수 충격음 크기', activity: '스마트폰 Spectroid 앱으로 공간별 박수 충격음이 잔류하는 시간을 3회 반복 측정 후 평균값 도출' },

      { id: 'sc_2', subjectId: 'science', subjectName: '과학', question: '금속 실로폰과 나무 실로폰의 소리 여운(서스테인) 길이는 왜 다를까?', concept: '탄성 계수, 밀도, 내부 마찰, 감쇠 진동', hypothesis: '금속 재질은 목재보다 내부 마찰에 의한 에너지 손실이 적어 서스테인이 2배 이상 길 것이다.', variables: '독립: 타격 막대 재질(금속 vs 목재) / 종속: 진폭이 초기 대비 10%로 줄어드는 시간(초) / 통제: 동일한 규격의 타격봉과 힘', activity: '동일 건반 타격 후 오디오 편집기 파형에서 진폭 감쇠 엔벨로프(Envelope)의 길이를 실측 비교' },

      { id: 'sc_3', subjectId: 'science', subjectName: '과학', question: '팬파이프(Pan flute)와 유리병에 물을 채울 때 소리가 높아지는 정상파 공명 원리', concept: '폐관 진동, 정상파, 음속($v=f\lambda$)', hypothesis: '폐관의 공기 기둥 길이($L$)가 짧아질수록 공명 파장($\lambda=4L$)이 감소하여 주파수($f$)가 반비례하여 증가할 것이다.', variables: '독립: 유리병 속 물의 높이(공기 기둥 길이 cm) / 종속: 입으로 불었을 때 공명 주파수(Hz) / 통제: 동일 유리병 규격', activity: '물의 양을 2cm씩 늘려가며 스마트폰 주파수 튜너로 음높이를 측정하고 $f \propto 1/L$ 이론식 대조' },

      { id: 'sc_4', subjectId: 'science', subjectName: '과학', question: '앰프 스피커 앞에서 종이컵과 촛불이 흔들리는 음파의 공기 압축 종파(Longitudinal Wave) 실증', concept: '음파의 종파 특성, 매질의 소밀파, 음압 에너지', hypothesis: '우퍼 스피커의 저음(50Hz) 재생 시 음압에 의해 촛불 불꽃이 앞뒤로 진동하며 특정 진폭 이상에서 꺼질 것이다.', variables: '독립: 재생 주파수(50Hz vs 500Hz vs 5000Hz) / 종속: 촛불 불꽃의 전후 요동 거리(mm) / 통제: 동일 볼륨 출력', activity: '스피커 콘지 앞에 촛불을 두고 슬로우 모션 영상(240fps)으로 촬영하여 주파수별 공기 입자 요동 진폭 실측' },

      { id: 'sc_5', subjectId: 'science', subjectName: '과학', question: '클라드니(Chladni) 패턴 실험: 금속판 진동수와 모래가 만드는 2차원 마디선(Nodal line) 기하학', concept: '2차원 정상파, 마디선, 고유 진동 모드', hypothesis: '스피커로 가하는 음파의 주파수가 높아질수록 금속판 위의 마디선 수가 증가하며 복잡한 대칭 패턴을 형성할 것이다.', variables: '독립: 오디오 발진기 인가 주파수(Hz) / 종속: 모래가 형성하는 기하학적 폐곡선 개수 / 통제: 동일 금속판 크기 및 모래 입자', activity: '금속 사각판 중앙에 스피커 진동자를 연결하고 미세 모래를 뿌려 주파수별 클라드니 패턴 사진 촬영' },

      { id: 'sc_6', subjectId: 'science', subjectName: '과학', question: '사이렌을 울리며 지나가는 앰뷸런스의 소리가 변하는 도플러 효과(Doppler Effect) 실측', concept: '도플러 효과, 상대 속도, 가청 주파수 변이', hypothesis: '차가 다가올 때는 음파가 압축되어 주파수가 높게 측정되고 멀어질 때는 주파수가 급격히 낮아질 것이다.', variables: '독립: 음원의 이동 상태(접근 vs 후퇴) / 종속: 정지 관찰자가 측정한 피크 주파수(Hz) / 통제: 차량 이동 속도(시속 40km)', activity: '스마트폰 스펙트럼 분석 앱을 켠 상태로 이동 차량의 경적 주파수를 연속 측정해 도플러 변이 수식($f\'=f\frac{v}{v\pm v_s}$) 검증' },

      { id: 'sc_7', subjectId: 'science', subjectName: '과학', question: '바이올린과 플루트가 같은 도(C4)를 연주해도 음색(Timbre)이 다른 이유: 배음(Harmonics) 스펙트럼', concept: '배음 구조, 기음, 푸리에 스펙트럼, 음색', hypothesis: '플루트는 기음 위주의 단순 파형을 띠지만 바이올린은 2~8차 고조파 배음 진폭이 풍부하게 나타날 것이다.', variables: '독립: 악기 종류(플루트 vs 바이올린) / 종속: 각 배음 차수별 상대 진폭(dB) / 통제: 동일 음고(C4) 및 동일 음량', activity: 'Spectroid 앱으로 두 악기의 C4 연주음을 녹음하여 배음 피크 막대그래프를 대조 분석' },

      { id: 'pe_2', subjectId: 'pe', subjectName: '체육', question: '쿨다운(정리 운동) 시 저BPM 클래식 음악 청취가 운동 후 심박수 회복 속도에 미치는 효과', concept: '부교감신경 활성화, 심박수 회복(Heart Rate Recovery), 젖산 분해', hypothesis: '운동 직후 60 BPM의 느린 음악을 청취하면 무음 상태보다 안정 시 심박수로 복귀하는 시간이 20% 단축될 것이다.', variables: '독립: 쿨다운 시 음악(무음 vs 60 BPM 클래식) / 종속: 최대 심박수에서 안정 심박수 도달 시간(초) / 통제: 동일 강도의 트레드밀 러닝', activity: '인터벌 러닝 후 5분간 심박수를 30초 단위로 기록하여 지수적 감쇠 곡선 그래프 비교' },

      { id: 'pe_3', subjectId: 'pe', subjectName: '체육', question: '러닝(달리기) 시 음악 비트와 분당 걸음 수(Cadence, SPM)의 신경계 생체 리듬 동기화율', concept: '케이던스(SPM), 청각-운동 동조화(Auditory-Motor Entrainment)', hypothesis: '러너는 자신의 고유 보폭과 유사한 BPM(±5%)의 음악을 들을 때 걸음 수가 음악 비트에 90% 이상 동조될 것이다.', variables: '독립: 재생 음악의 BPM(150, 165, 180) / 종속: 러닝 센서로 실측한 보행수(SPM) / 통제: 평지 트랙 러닝', activity: '러닝 트래커 앱을 켜고 BPM을 단계별로 변경하며 달릴 때 케이던스 일치율을 분초 단위 분석' },

      { id: 'pe_4', subjectId: 'pe', subjectName: '체육', question: '음악 장르(헤비메탈 vs 클래식 vs 무음)가 악력(Grip Strength) 순간 발휘에 미치는 영향', concept: '교감신경 각성, 아드레날린 분비, 최대 순간 근력', hypothesis: '공격적이고 강렬한 헤비메탈 음악 청취 시 순간 악력 측정값이 무음 상태보다 유의미하게 높을 것이다.', variables: '독립: 음악 장르(무음 vs 모차르트 vs 헤비메탈) / 종속: 디지털 악력계 최대 측정값(kg) / 통제: 피험자 오른손 3회 측정', activity: '장르별 음악을 1분간 청취한 직후 악력을 3회 반복 측정하여 최고치 t-검정 분석' },

      { id: 'pe_5', subjectId: 'pe', subjectName: '체육', question: '음악 줄넘기에서 4/4박자 싱코페이션(당김음) 리듬이 점프 타이밍 착지 오차에 미치는 영향', concept: '리듬 감각, 당김음(Syncopation), 착지 충격 흡수', hypothesis: '정박 리듬 대비 당김음 리듬에서는 착지 타이밍 오류율이 증가하여 줄넘기 걸림 횟수가 늘어날 것이다.', variables: '독립: 리듬 유형(정박 댄스 비트 vs 당김음 비트) / 종속: 2분간 2중 뛰기 실패 횟수 및 발바닥 착지 타이밍 편차 / 통제: 동일한 130 BPM', activity: '고속 카메라(240fps)로 줄넘기 착지 순간을 촬영하여 비트 타점과 발바닥 접지 시간차 실측' },

      { id: 'pe_6', subjectId: 'pe', subjectName: '체육', question: '사격 및 양궁 조준 시 심박 안정화를 위한 호흡 주기와 저주파 백색소음 음악의 상관관계', concept: '미세 근육 제어, 심박 안정화, 알파파 유도', hypothesis: '조준 시 심장 박동 사이(R-R Interval) 이완기에 격발하도록 유도하는 음악은 탄착군 분산도를 줄일 것이다.', variables: '독립: 조준 환경(주변 소음 vs 바이노럴 비트 음악) / 종속: 표적지 탄착군 반경(cm) / 통제: 레이저 사격 시뮬레이터', activity: '레이저 사격 장비로 음악 조건에 따른 표적 명중 중심점 분산 표준편차 산출' },

      { id: 'pe_7', subjectId: 'pe', subjectName: '체육', question: '스트레칭 및 요가 수행 시 국악 명상 음악(대금 정악)이 유연성(좌전굴) 증진에 미치는 효과', concept: '근막 이완, 부교감신경, 대금 청소리 배음', hypothesis: '대금 정악의 긴 호흡 소리는 근육 긴장도를 낮추어 좌전굴(앉아 윗몸 앞으로 굽히기) 기록을 향상시킬 것이다.', variables: '독립: 스트레칭 시 청취 음원(무음 vs K-POP vs 대금 정악) / 종속: 좌전굴 측정치(cm) 증가량 / 통제: 동일한 10분 스트레칭 루틴', activity: '3일 간격으로 음원 조건을 바꾸며 동일 스트레칭 후 좌전굴 기록의 유의미한 신장도 검증' },

      { id: 'pe_8', subjectId: 'pe', subjectName: '체육', question: '체육관 농구 자유투 성공률에 미치는 상대방 수비 응원 소음과 헤드폰 집중 음악의 차이', concept: '주의 집중 이론, 청각적 방해 자극, 자유투 성공률', hypothesis: '시끄러운 야유 소음 속에서도 귀를 막고 일정한 리듬을 연상하면 자유투 성공률 하락을 방어할 것이다.', variables: '독립: 청각 자극(관중 야유 소음 vs 개인 루틴 비트 헤드폰 착용) / 종속: 자유투 20회 성공률(%) / 통제: 피험자 자유투 기본 성공률', activity: '스피커로 85dB 관중 야유를 틀고 자유투 20회를 시도하여 성공률 변화 추적' },

      { id: 'pe_9', subjectId: 'pe', subjectName: '체육', question: '피겨 스케이팅 및 체조 연기에서 악곡의 템포 루바토(밀고 당김)와 점프 체공 시간의 동기화', concept: '체공 시간, 음악적 루바토, 예술 점수(PCS)', hypothesis: '점프 최고 정점 순간에 악곡의 클라이맥스 타격음이 일치할 때 관람자의 예술적 완성도 평가 점수가 높을 것이다.', variables: '독립: 점프 정점과 음악 악센트 일치 오차(ms) / 종속: 예술 점수(PCS) 채점관 모의 평가 / 통제: 동일한 피겨 기술 루틴', activity: '올림픽 피겨 경기 영상의 오디오 파형과 스케이터의 착지 슬로우 영상을 프레임 단위로 대조' },

      { id: 'pe_10', subjectId: 'pe', subjectName: '체육', question: '유산소 운동 시 청취자가 직접 선곡한 자율 플레이리스트 vs 알고리즘 강제 지정 음악의 지구력 비교', concept: '자기결정성 이론, 자율성, 운동 지속 시간', hypothesis: '본인이 직접 선곡한 음악을 들을 때 자율성 충족으로 탈진 도달 시간(Time to Exhaustion)이 더 길 것이다.', variables: '독립: 플레이리스트 구성 방식(본인 자율 선곡 vs 무작위 추천) / 종속: 고정 사이클 탈진 시간(분) / 통제: 동일한 페달 부하 와트(W)', activity: '고정식 실내 자전거에서 동일 부하로 페달을 밟으며 한계 도달 시간을 측정 비교' },



      // 8. 미술 (10선)

      { id: 'ar_1', subjectId: 'art', subjectName: '미술', question: '밝은 장조와 어두운 단조 음악을 들었을 때 연상되는 색채환(Munsell)의 명도·채도 통계 검증', concept: '색채 심리, 공감각(Synesthesia), 장조와 단조, 난색·한색', hypothesis: '장조 음악은 고명도·고채도의 난색(노랑, 주황)을, 단조 음악은 저명도·중채도의 한색(파랑, 보라)을 유의미하게 연상시킬 것이다.', variables: '독립: 악곡의 조성(C Major 장조 vs C Minor 단조) / 종속: 피험자가 선택한 12색채환의 명도 및 채도 수치 / 통제: 동일한 템포와 악기 음색', activity: '피험자 30명에게 동일 선율의 장·단조 편곡을 들려주고 디지털 색상표 선택값을 RGB/HSV 값으로 변환 통계 분석' },

      { id: 'ar_2', subjectId: 'art', subjectName: '미술', question: '바실리 칸딘스키의 공감각 이론을 적용한 악기 음색별 점·선·면 조형 매핑 실증', concept: '추상미술, 바실리 칸딘스키, 음색의 조형화', hypothesis: '트럼펫은 날카로운 노란색 삼각형으로, 첼로는 부드러운 짙은 파란색 곡선 면으로 매핑되는 경향이 일관되게 나타날 것이다.', variables: '독립: 독주 악기 음색(트럼펫 vs 플루트 vs 첼로 vs 팀파니) / 종속: 드로잉 선의 굵기, 각도, 형태 복잡도 / 통제: 동일한 계이름(G4) 지속음', activity: '악기 소리를 들으며 직관적으로 떠오르는 형태를 캔버스에 드로잉하게 한 뒤 기하학적 형태 분류' },

      { id: 'ar_3', subjectId: 'art', subjectName: '미술', question: '악보의 음표 밀도와 쉼표 여백의 시각적 긴장감을 캔버스 여백의 미(Space)로 재해석하기', concept: '조형 원리, 시각적 여백, 균형과 비례, 악보 그래픽', hypothesis: '쉼표가 많은 곡의 악보 실루엣은 한국화의 여백처럼 시각적 안정감을 주며, 32분음표 밀집 구간은 시각적 중량감이 클 것이다.', variables: '독립: 악보의 음표 밀도(마디당 음표 개수) / 종속: 시선 추적(Eye-tracking) 시선 체류 시간 및 긴장도 평가 / 통제: 악보 그래픽 흑백 규격', activity: '모차르트 악보와 현대 불협화음 악보를 그래픽 실루엣으로 변환하여 시선 체류 지점 히트맵 분석' },

      { id: 'ar_4', subjectId: 'art', subjectName: '미술', question: '옵아트(Op Art)의 시각적 착시 패턴과 현대 미니멀리즘 음악(스티브 라이히)의 반복 위상 차이', concept: '옵아트, 착시, 미니멀리즘 음악, 위상 변이(Phase Shifting)', hypothesis: '미니멀 음악의 1마디 어긋남(위상 변이) 청취 경험은 옵아트의 줄무늬 왜곡 시각 착시와 동일한 인지적 현기증을 유발할 것이다.', variables: '독립: 음악 청취(위상 변이 곡 vs 정박 반복 곡) / 종속: 옵아트 착시 패턴 인지 시간 / 통제: 동일 조도 환경', activity: '스티브 라이히의 피아노 페이즈를 들으며 움직이는 착시 착시 도형을 바라볼 때의 인지 왜곡 시간 측정' },

      { id: 'ar_5', subjectId: 'art', subjectName: '미술', question: '앨범 커버 아트워크(자켓 디자인)의 색채 톤앤매너가 음원 스트리밍 클릭률(CTR)에 미치는 시각적 영향', concept: '시각 디자인, 앨범 아트, 시선 유도, CTR', hypothesis: '고대비 보색을 적용한 앨범 커버는 유사색 톤온톤 커버보다 모바일 음원 목록에서 시선을 30% 더 빨리 사로잡을 것이다.', variables: '독립: 앨범 커버 색채 배합(보색 대비 vs 유사색 톤온톤) / 종속: 모의 음원 스트리밍 화면에서 첫 시선 도달 시간(ms) / 통제: 가상의 타이틀 텍스트 폰트', activity: '모바일 화면 프로토타입을 제작하고 사용자의 첫 클릭 시선 이동 시간을 스톱워치로 실측' },

      { id: 'ar_6', subjectId: 'art', subjectName: '미술', question: '빛의 삼원색(RGB) 가산혼합과 음악의 삼화음(도-미-솔) 협화음 배합의 조화도 모델링', concept: 'RGB 가산혼합, 3화음 협화도, 백색광', hypothesis: '완전협화 3화음의 진동수 비($4:5:6$)를 RGB 파장 비율로 치환했을 때 인간의 눈에 가장 안정적인 조화색이 나타날 것이다.', variables: '독립: 화음 구성(협화 장3화음 vs 불협화 감3화음) / 종속: 치환된 빛의 혼합 색상 조화도 평가 점수 / 통제: 동일 휘도', activity: '화음 주파수 비율을 빛의 파장(nm)으로 수식 변환하여 LED 조명으로 혼합색을 투사하고 감성 평가' },

      const [currentUser, setCurrentUser] = useState(() => {

        try {

        } catch { return null; }

      });



      // 학생 인증

      const [studentId, setStudentId] = useState('');

      const [studentPw, setStudentPw] = useState('');

      const [studentName, setStudentName] = useState('');

      const [isRegisterMode, setIsRegisterMode] = useState(false);



      // 교사 인증

      const [showTeacherModal, setShowTeacherModal] = useState(false);

      const [teacherId, setTeacherId] = useState('');

      const [teacherPw, setTeacherPw] = useState('');

      const [teacherAuth, setTeacherAuth] = useState(() => {

        try {

          const s = localStorage.getItem('songak_teacher_auth');

          return s ? JSON.parse(s) : { id: 'admin', pw: '123456' };

        } catch { return { id: 'admin', pw: '123456' }; }

      });



      // 교사 서브탭

      const [teacherSubTab, setTeacherSubTab] = useState('submissions'); // submissions | edit_cards | settings



      // 4대 주제 데이터 상태

      const [inquiryData, setInquiryData] = useState(() => {

        const s = localStorage.getItem('songak_data_inquiry_80');

        return s ? JSON.parse(s) : DEFAULT_INQUIRY_DATA;

      });

      const [productData, setProductData] = useState(() => {

        const s = localStorage.getItem('songak_data_product_20');

        return s ? JSON.parse(s) : DEFAULT_PRODUCT_DATA;

      });

      const [popChapter, setPopChapter] = useState(() => {

        const s = localStorage.getItem('songak_data_pop_chapter');

        return s ? JSON.parse(s) : DEFAULT_POP_CHAPTER;

      });

      const [eastWestData, setEastWestData] = useState(() => {

        const s = localStorage.getItem('songak_data_ew_10');

        return s ? JSON.parse(s) : DEFAULT_EAST_WEST_10_DATA;

      });



      // 학생 제출물

      const [submissions, setSubmissions] = useState(() => {

        const s = localStorage.getItem('songak_submissions');

        return s ? JSON.parse(s) : {};

      });



      const [selectedSubject, setSelectedSubject] = useState('all');

      const [toast, setToast] = useState('');



      // 보고서 작성 모달 상태

      const [activeModal, setActiveModal] = useState(false);

      const [reportForm, setReportForm] = useState({

        slot: 'report1',

        topicType: 'inquiry',

        title: '',

        concept: '',

        content1: '',

        content2: '',

        content3: '',

        content4: '',

        aiPrompt: '',

        aiReview: '',

        isSubmitted: false

      });



      // 교사 카드 세부 편집 모달

      const [editCardModal, setEditCardModal] = useState(false);

      const [editingCard, setEditingCard] = useState(null);



      // 교사 채점 모달

      const [gradingId, setGradingId] = useState(null);

      const [gradeForm, setGradeForm] = useState({ r1_c: 15, r1_a: 15, r2_c: 15, r2_a: 15, feedback: '' });



      const showToastMsg = (msg) => {

        setToast(msg);

        setTimeout(() => setToast(''), 2500);

      };



      useEffect(() => {

        if (currentUser) sessionStorage.setItem('songak_current_user', JSON.stringify(currentUser));

        else sessionStorage.removeItem('songak_current_user');

      }, [currentUser]);



      // 학생 로그인/등록

      const handleStudentAuth = (e) => {

        e.preventDefault();

        const accounts = JSON.parse(localStorage.getItem('songak_student_accounts') || '{}');

        if (isRegisterMode) {

          if (!/^\d{4}$/.test(studentId) || !studentName.trim() || !/^\d{4}$/.test(studentPw)) {

            showToastMsg('학번(4자리 숫자), 성명, 비밀번호(4자리 숫자)를 정확히 입력하세요.');

            return;

          }

          if (accounts[studentId]) {

            showToastMsg('이미 등록된 학번입니다. 로그인해 주세요.');

            return;

          }

          accounts[studentId] = { id: studentId, name: studentName.trim(), pw: studentPw };

          localStorage.setItem('songak_student_accounts', JSON.stringify(accounts));

          setCurrentUser({ role: 'student', id: studentId, name: studentName.trim() });

          showToastMsg(`${studentName} 학생, 등록 및 로그인이 완료되었습니다.`);

          setIsRegisterMode(false);

        } else {

          const acc = accounts[studentId];

          if (!acc || acc.pw !== studentPw) {

            showToastMsg('학번 또는 비밀번호가 일치하지 않습니다.');

            return;

          }

          setCurrentUser({ role: 'student', id: acc.id, name: acc.name });

          showToastMsg(`${acc.name} 님, 환영합니다.`);

        }

      };



      // 교사 로그인

      const handleTeacherAuth = (e) => {

        e.preventDefault();

        if (teacherId === teacherAuth.id && teacherPw === teacherAuth.pw) {

          setShowTeacherModal(false);

        } else {

          showToastMsg('교사 아이디 또는 비밀번호(6자리 숫자)가 일치하지 않습니다.');

        }

      };



      const handleLogout = () => {

        setCurrentUser(null);

        setMainTab('inquiry');

        showToastMsg('로그아웃되었습니다.');

      };



      // 학기 리셋: 학생 계정 + 모든 보고서 + 채점 데이터 완전 초기화

      const handleSemesterReset = () => {

        const confirmCode = prompt('정말로 전체 학기 데이터를 리셋하시겠습니까?\n모든 학생의 학번, 성명, 비밀번호 및 제출 보고서, 채점 결과가 완전히 삭제됩니다.\n\n진행하려면 "RESET"을 입력하세요.');

        if (confirmCode === 'RESET') {

          localStorage.removeItem('songak_student_accounts');

          localStorage.removeItem('songak_submissions');

          setSubmissions({});

          if (currentUser?.role === 'student') setCurrentUser(null);

          showToastMsg('모든 학생 계정 및 수행평가 데이터가 완전히 초기화되었습니다.');

        } else {

          showToastMsg('리셋이 취소되었습니다.');

        }

      };



      // 엑셀 CSV 다운로드

      const handleExportCSV = () => {

        const rows = [['학번', '성명', '과제1 제목', '과제1 상태', '과제2 제목', '과제2 상태', '총점(60)', '세특 피드백']];

        Object.values(submissions).forEach(s => {

          const r1 = s.reports?.report1;

          const r2 = s.reports?.report2;

          const score = s.grade?.total !== undefined ? s.grade.total : '미채점';

          rows.push([

            s.id,

            s.name,

            r1 ? `"${r1.title.replace(/"/g, '""')}"` : '미선택',

            r1?.isSubmitted ? '제출' : '작성중',

            r2 ? `"${r2.title.replace(/"/g, '""')}"` : '미선택',

            r2?.isSubmitted ? '제출' : '작성중',

            score,

            `"${(s.grade?.feedback || '').replace(/"/g, '""')}"`

          ]);

        });

        const csv = '\uFEFF' + rows.map(r => r.join(',')).join('\n');

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');

        a.href = url;

        a.download = `송악고_음악_수행평가_${new Date().toISOString().slice(0, 10)}.csv`;

        a.click();

        URL.revokeObjectURL(a);

        showToastMsg('엑셀 CSV 파일이 다운로드되었습니다.');

      };



      // 보고서 모달 열기

      const openReportModal = (topicType, item = null, targetSlot = null) => {

        if (!currentUser) {

          showToastMsg('먼저 학번 4자리로 로그인해 주세요.');

          return;

        }

        const sId = currentUser.id;

        const studentSub = submissions[sId] || { reports: {} };

        let slot = targetSlot;

        if (!slot) {

          slot = !studentSub.reports?.report1 ? 'report1' : 'report2';

        }



        const existing = studentSub.reports?.[slot];



        // 주제별 기본값 매핑

        let title = existing?.title || item?.question || item?.title || '';

        let concept = existing?.concept || item?.concept || item?.musicTrait || item?.coreConcept || '';

        let c1 = existing?.content1 || item?.hypothesis || item?.brandName || item?.westTheory || '';

        let c2 = existing?.content2 || item?.variables || item?.howToDevelop || item?.eastTheory || '';

        let c3 = existing?.content3 || item?.activity || item?.impact || '';

        let c4 = existing?.content4 || item?.songs || '';



        if (topicType === 'pop_history' && !existing) {

          title = item?.title || '한국 대중음악 100년 변천사와 2030 미래 음악 예측';

                      <select value={gradeForm.r1_a} onChange={(e) => setGradeForm({ ...gradeForm, r1_a: e.target.value })} className="w-full p-1.5 border rounded-lg">

                        <option value={15}>15점 (우수)</option>

                        <option value={10}>10점 (보통)</option>

                        <option value={5}>5점 (미흡)</option>

                      </select>

                    </div>

                    <div>

                      <label className="font-bold block mb-1">과제 2 내용 (15점)</label>

                      <select value={gradeForm.r2_c} onChange={(e) => setGradeForm({ ...gradeForm, r2_c: e.target.value })} className="w-full p-1.5 border rounded-lg">

                        <option value={15}>15점 (우수)</option>

                        <option value={10}>10점 (보통)</option>

                        <option value={5}>5점 (미흡)</option>

                      </select>

                    </div>

                    <div>

                      <label className="font-bold block mb-1">과제 2 분석/AI (15점)</label>

                      <select value={gradeForm.r2_a} onChange={(e) => setGradeForm({ ...gradeForm, r2_a: e.target.value })} className="w-full p-1.5 border rounded-lg">

                        <option value={15}>15점 (우수)</option>

                        <option value={10}>10점 (보통)</option>

                        <option value={5}>5점 (미흡)</option>

                      </select>

                    </div>

                  </div>



                  <div>

                    <label className="font-bold block mb-1">세특 피드백 메모</label>

                    <textarea

                      rows={3}

                      value={gradeForm.feedback}

                      onChange={(e) => setGradeForm({ ...gradeForm, feedback: e.target.value })}

                      className="w-full p-2 border rounded-lg"

                      placeholder="세특 기재용 관찰 내용 작성"

                    />

                  </div>

                </div>



                <div className="pt-2 border-t flex items-center justify-between">

                  <span className="font-bold text-indigo-600 text-sm">

                    총점: {Number(gradeForm.r1_c) + Number(gradeForm.r1_a) + Number(gradeForm.r2_c) + Number(gradeForm.r2_a)} / 60점

                  </span>

                  <div className="flex gap-2">

                    <button onClick={() => setGradingId(null)} className="px-3 py-1.5 border rounded-lg">취소</button>

                    <button onClick={handleSaveGrade} className="px-4 py-1.5 bg-purple-600 text-white rounded-lg font-bold">저장</button>

                  </div>

                </div>

              </div>

            </div>

          )}



          {/* 교사 로그인 모달 */}

          {showTeacherModal && (

            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">

              <div className="bg-white rounded-3xl border p-6 max-w-sm w-full shadow-2xl text-xs space-y-3">

                <div className="flex items-center justify-between pb-2 border-b">

                  <h3 className="font-black text-sm">교사 관리자 로그인</h3>

                  <button onClick={() => setShowTeacherModal(false)} className="font-bold text-slate-400">✕</button>

                </div>

                <form onSubmit={handleTeacherAuth} className="space-y-2">

                  <input

                    type="text"

                    placeholder="교사 아이디"

                    value={teacherId}

                    onChange={(e) => setTeacherId(e.target.value)}

                    className="w-full p-2 border rounded-lg font-mono"

                    required

                  />

                  <input

                    type="password"

                    maxLength={6}

                    placeholder="비밀번호 (6자리 숫자)"

                    value={teacherPw}

                    onChange={(e) => setTeacherPw(e.target.value)}

                    className="w-full p-2 border rounded-lg font-mono tracking-widest"

                    required

                  />

                  <button type="submit" className="w-full py-2 bg-purple-600 text-white font-bold rounded-lg">로그인</button>

                </form>

              </div>

            </div>

          )}

        </div>

      );

    }



    const root = ReactDOM.createRoot(document.getElementById('root'));

    root.render(<App />);

  </script>

</body>

</html>
