    function App() {
      const [mainTab, setMainTab] = useState('inquiry');
      // [세션 유지] 새로고침 시에도 로그인 풀리지 않도록 sessionStorage 연동
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const savedUser = sessionStorage.getItem('music_current_user');
          return savedUser ? JSON.parse(savedUser) : null;
        } catch { return null; }
      });

      const [studentIdInput, setStudentIdInput] = useState('');
      const [studentPwInput, setStudentPwInput] = useState('');
      const [studentNameInput, setStudentNameInput] = useState('');
      const [isRegisterMode, setIsRegisterMode] = useState(false);

      const [showTeacherModal, setShowTeacherModal] = useState(false);
      const [teacherIdInput, setTeacherIdInput] = useState('');
      const [teacherPwInput, setTeacherPwInput] = useState('');
      const [teacherAuth, setTeacherAuth] = useState(() => {
        try {
          const s = localStorage.getItem('music_teacher_auth');
          return s ? JSON.parse(s) : { id: 'admin', pw: '123456' };
        } catch { return { id: 'admin', pw: '123456' }; }
      });

      // 교사 관리자 서브탭 상태 ('submissions' | 'guide_edit' | 'auth_edit')
      const [teacherSubTab, setTeacherSubTab] = useState('submissions');

      // 교사 주제/가이드라인 상태
      const [topicGuides, setTopicGuides] = useState(() => {
        try {
          const s = localStorage.getItem('music_topic_guides');
          return s ? JSON.parse(s) : {
            t1_title: '주제 1. 교과 융합 탐구',
            t1_desc: '국어, 영어, 수학, 사회, 과학, 한국사, 체육, 미술과 음악을 융합하여 일상의 질문을 가설과 실험으로 입증합니다.',
            t2_title: '주제 2. 음악 문화유산 상품 개발',
            t2_desc: '교과서 속 전통 및 서양 문화유산의 음악적 가치를 담아 현대적 굿즈, 앱, 게임, 프로그램을 4분면으로 기획합니다.',
            t3_title: '주제 3. 대중음악사&미래 음악 예측',
            t3_desc: '1970년대부터 현재까지의 대중음악 흐름을 정리하고 2030년대 이후 미래 음악을 Slide 08 규격(3문장)으로 예측합니다.',
            t4_title: '주제 4. 국악·서양음악 이론 심화 탐구',
            t4_desc: '조율학(삼분손익 vs 피타고라스), 기보학(정간보 vs 오선보), 지휘 vs 장단 등 동서양 이론을 1:1 맞비교하여 탐구합니다.'
          };
        } catch { return {}; }
      });

      // 교사 비밀번호 변경 폼 상태
      const [newTeacherId, setNewTeacherId] = useState('');
      const [newTeacherPw, setNewTeacherPw] = useState('');

      const [allSubmissions, setAllSubmissions] = useState(() => {
        try {
          const s = localStorage.getItem('music_assessment_submissions');
          return s ? JSON.parse(s) : {};
        } catch { return {}; }
      });

      // 사용자 세션 동기화
      const updateCurrentUserSession = (user) => {
        setCurrentUser(user);
        if (user) {
          sessionStorage.setItem('music_current_user', JSON.stringify(user));
        } else {
          sessionStorage.removeItem('music_current_user');
        }
      };

      // 주제별 구조화된 보고서 상태
      const [activeReportModal, setActiveReportModal] = useState(false);
      const [reportForm, setReportForm] = useState({
        slot: 'report1',
        topicCategory: 'inquiry', // 'inquiry' | 'product' | 'pop_history' | 'east_west'
        topicTitle: '',
        // 주제 1 필드
        coreConcept: '',
        hypothesis: '',
        variables: '',
        procedure: '',
        conclusion: '',
        // 주제 2 필드 (Slide 07 4분면)
        productTrait: '',
        productHow: '',
        productImpact: '',
        // 주제 3 필드 (Slide 08 규격)
        popRecords: '',
        popTraits: ['', '', ''],
        popTopSongs: [{ title: '', reason: '' }, { title: '', reason: '' }, { title: '', reason: '' }],
        popFuture: ['', '', ''],
        // 주제 4 필드 (1:1 비교)
        ewWestern: '',
        ewGugak: '',
        ewComparison: '',
        ewActivity: '',
        // AI 활용 내역 (공통 필수)
        aiLog: { prompt: '', criticalReview: '' }
      });

      const [selectedSubject, setSelectedSubject] = useState('all');
      const [toastMessage, setToastMessage] = useState('');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 2500);
      };

      const getStudentAccounts = () => {
        try {
          const s = localStorage.getItem('music_student_accounts');
          return s ? JSON.parse(s) : {};
        } catch { return {}; }
      };

      const handleStudentRegister = (ev) => {
        ev.preventDefault();
        if (!/^\d{4}$/.test(studentIdInput)) { showToast('학번은 4자리 숫자여야 합니다.'); return; }
        if (!studentNameInput.trim()) { showToast('성명을 입력해 주세요.'); return; }
        if (!/^\d{4}$/.test(studentPwInput)) { showToast('비밀번호는 4자리 숫자여야 합니다.'); return; }

        const accs = getStudentAccounts();
        if (accs[studentIdInput]) { showToast('이미 등록된 학번입니다.'); return; }

        accs[studentIdInput] = { id: studentIdInput, name: studentNameInput.trim(), pw: studentPwInput };
        localStorage.setItem('music_student_accounts', JSON.stringify(accs));

        if (!allSubmissions[studentIdInput]) {
          const up = { ...allSubmissions, [studentIdInput]: { studentId: studentIdInput, studentName: studentNameInput.trim(), reports: {} } };
          setAllSubmissions(up);
          localStorage.setItem('music_assessment_submissions', JSON.stringify(up));
        }

        const newUser = { role: 'student', id: studentIdInput, name: studentNameInput.trim() };
        updateCurrentUserSession(newUser);
        setIsRegisterMode(false);
        showToast(`${studentNameInput} 님, 등록 및 로그인 완료! 🎉`);
      };

      const handleStudentLogin = (ev) => {
        ev.preventDefault();
        const accs = getStudentAccounts();
        const a = accs[studentIdInput];
        if (!a) { showToast('등록되지 않은 학번입니다. [최초 등록하기]를 눌러주세요.'); return; }
        if (a.pw !== studentPwInput) { showToast('비밀번호가 일치하지 않습니다.'); return; }
        const loggedUser = { role: 'student', id: a.id, name: a.name };
        updateCurrentUserSession(loggedUser);
        showToast(`${a.name} 님, 환영합니다!`);
      };

      const handleTeacherLogin = (ev) => {
        ev.preventDefault();
        if (teacherIdInput === teacherAuth.id && teacherPwInput === teacherAuth.pw) {
          const tUser = { role: 'teacher', id: teacherAuth.id, name: '음악과 교사' };
          updateCurrentUserSession(tUser);
          setShowTeacherModal(false);
          setTeacherIdInput('');
          setTeacherPwInput('');
          setNewTeacherId(teacherAuth.id);
          setMainTab('teacher_dash');
          setTeacherSubTab('submissions');
          showToast('교사 관리자 모드로 접속했습니다. 🛡️');
        } else {
          showToast('아이디 또는 6자리 비밀번호가 일치하지 않습니다.');
        }
      };

      const handleLogout = () => {
        updateCurrentUserSession(null);
        setMainTab('inquiry');
        showToast('로그아웃되었습니다.');
      };

      // 교사 계정(비밀번호 6자리) 저장
      const handleSaveTeacherAuth = (ev) => {
        ev.preventDefault();
        if (!newTeacherId.trim()) { showToast('교사 아이디를 입력해 주세요.'); return; }
        if (!/^\d{6}$/.test(newTeacherPw)) { showToast('비밀번호는 반드시 6자리 숫자여야 합니다.'); return; }
        const updated = { id: newTeacherId.trim(), pw: newTeacherPw };
        setTeacherAuth(updated);
        localStorage.setItem('music_teacher_auth', JSON.stringify(updated));
        setNewTeacherPw('');
        showToast('교사 아이디와 6자리 비밀번호가 변경되었습니다! 🔒');
      };

      // 주제 및 가이드 수정 내용 저장
      const handleSaveTopicGuides = () => {
        localStorage.setItem('music_topic_guides', JSON.stringify(topicGuides));
        showToast('수행평가 4대 주제 및 안내 설명이 저장되었습니다! 📝');
      };

      // 주제별 맞춤 모달 열기 핸들러 (교사 관리자 모드에서도 점검 및 시뮬레이션 가능)
      const openReportModal = (categoryType, item = null, defaultSlot = null) => {
        if (!currentUser) {
          showToast('로그인 후 점검 및 작성을 진행할 수 있습니다.');
          return;
        }
        const userKey = currentUser.role === 'teacher' ? 'teacher_preview' : currentUser.id;
        const sData = allSubmissions[userKey] || { reports: {} };
        const slot = defaultSlot || (!sData.reports?.report1 ? 'report1' : 'report2');
        const ex = sData.reports?.[slot];

        // 기존 저장된 내용이 있으면 복원, 없으면 클릭한 항목의 필드로 프리필
        setReportForm({
          slot,
          topicCategory: categoryType,
          topicTitle: ex?.topicTitle || item?.question || item?.name || item?.title || '',
          // 주제 1
          coreConcept: ex?.coreConcept || item?.concept || '',
          hypothesis: ex?.hypothesis || item?.hypothesis || '',
          variables: ex?.variables || (item?.variables ? (typeof item.variables === 'string' ? item.variables : `독립변인: ${item.variables.independent || ''} / 종속변인: ${item.variables.dependent || ''} / 통제변인: ${item.variables.controlled || ''}`) : ''),
          procedure: ex?.procedure || item?.activity || '',
          conclusion: ex?.conclusion || '',
          // 주제 2
          productTrait: ex?.productTrait || item?.musicTrait || '',
          productHow: ex?.productHow || item?.howToDevelop || '',
          productImpact: ex?.productImpact || item?.impact || '',
          // 주제 3
          popRecords: ex?.popRecords || (item?.summary ? `${item.era}: ${item.summary}` : ''),
          popTraits: ex?.popTraits || ['', '', ''],
          popTopSongs: ex?.popTopSongs || [
            { title: item?.songs?.split(', ')[0] || '', reason: '' },
            { title: item?.songs?.split(', ')[1] || '', reason: '' },
            { title: item?.songs?.split(', ')[2] || '', reason: '' }
          ],
          popFuture: ex?.popFuture || ['', '', ''],
          // 주제 4
          ewWestern: ex?.ewWestern || (item ? '서양 음계/기보/지휘 체계 분석' : ''),
          ewGugak: ex?.ewGugak || (item ? '국악 율명/정간보/호흡 장단 분석' : ''),
          ewComparison: ex?.ewComparison || item?.comparison || '',
          ewActivity: ex?.ewActivity || item?.activity || '',
          // AI 로그
          aiLog: ex?.aiLog || { prompt: '', criticalReview: '' }
        });
        setActiveReportModal(true);
      };

      const saveReport = (isSubmit) => {
        const userKey = currentUser.role === 'teacher' ? 'teacher_preview' : currentUser.id;
        const userName = currentUser.role === 'teacher' ? '교사(점검용)' : currentUser.name;
        const sData = allSubmissions[userKey] || { studentId: userKey, studentName: userName, reports: {} };
        const now = new Date().toLocaleString('ko-KR');
        const up = {
          ...allSubmissions,
          [userKey]: {
            ...sData,
            reports: {
              ...sData.reports,
              [reportForm.slot]: { ...reportForm, isSubmitted: isSubmit, updatedAt: now }
            }
          }

                  e('input', { type: 'text', placeholder: '예: 독립변인: 공간 유형 / 종속변인: 잔향 시간(초) / 통제변인: 최초 음량, 마이크 거리', value: reportForm.variables, onChange: (ev) => setReportForm({ ...reportForm, variables: ev.target.value }), className: 'w-full p-2 border rounded-lg bg-white text-2xs variable-box' })
                ),
                e('div', null,
                  e('label', { className: 'font-bold text-slate-700 block mb-1' }, '4. 간이 실험 절차 및 데이터 결과'),
                  e('textarea', { rows: 3, placeholder: '스마트폰 측정 앱 활용 및 수집된 정량적 데이터(수치) 기록', value: reportForm.procedure, onChange: (ev) => setReportForm({ ...reportForm, procedure: ev.target.value }), className: 'w-full p-2 border rounded-lg bg-white' })
                ),
                e('div', null,
                  e('label', { className: 'font-bold text-slate-700 block mb-1' }, '5. 결론 및 음악적 시사점'),
                  e('textarea', { rows: 2, placeholder: '가설 검증 결과 및 음악 감상·학교 환경에 미치는 시사점', value: reportForm.conclusion, onChange: (ev) => setReportForm({ ...reportForm, conclusion: ev.target.value }), className: 'w-full p-2 border rounded-lg bg-white' })
                )
              ),

              // [주제 2 전용 폼: Slide 07 4분면 상품 기획]
              reportForm.topicCategory === 'product' && e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-3 bg-emerald-50/40 p-4 rounded-2xl border border-emerald-200' },
                e('div', null,
                  e('label', { className: 'font-bold text-emerald-900 block mb-1' }, '1. 상품명 (Brand & Target)'),
                  e('textarea', { rows: 2, placeholder: '소비자가 직관적으로 알 수 있는 브랜드명 + 품목 형태', value: reportForm.topicTitle, onChange: (ev) => setReportForm({ ...reportForm, topicTitle: ev.target.value }), className: 'w-full p-2 border border-emerald-200 rounded-lg bg-white' })
                ),
                e('div', null,
                  e('label', { className: 'font-bold text-emerald-900 block mb-1' }, '2. 해당 음악의 특징 (Heritage)'),
                  e('textarea', { rows: 2, placeholder: '문화유산의 역사적 배경 및 구체적 음악 특징(장단, 음계, 배음 등)', value: reportForm.productTrait, onChange: (ev) => setReportForm({ ...reportForm, productTrait: ev.target.value }), className: 'w-full p-2 border border-emerald-200 rounded-lg bg-white' })
                ),
                e('div', null,
                  e('label', { className: 'font-bold text-emerald-900 block mb-1' }, '3. 구체적으로 (개발 방식 & 구성)'),
                  e('textarea', { rows: 3, placeholder: '어떤 기술(앱, 게임, 굿즈 등)로 구현하며 현대적 타깃에게 어떻게 다가가는가', value: reportForm.productHow, onChange: (ev) => setReportForm({ ...reportForm, productHow: ev.target.value }), className: 'w-full p-2 border border-emerald-200 rounded-lg bg-white' })
                ),
                e('div', null,
                  e('label', { className: 'font-bold text-emerald-900 block mb-1' }, '4. 얻을 수 있는 효과 (문화·경제)'),
                  e('textarea', { rows: 3, placeholder: '전통 음악 향유 확대 및 산업적·교육적 파급 효과', value: reportForm.productImpact, onChange: (ev) => setReportForm({ ...reportForm, productImpact: ev.target.value }), className: 'w-full p-2 border border-emerald-200 rounded-lg bg-white' })
                )
              ),

              // [주제 3 전용 폼: Slide 08 대중음악사 규격]
              reportForm.topicCategory === 'pop_history' && e('div', { className: 'space-y-3 bg-teal-50/40 p-4 rounded-2xl border border-teal-200' },
                e('div', null,
                  e('label', { className: 'font-bold text-teal-900 block mb-1' }, '1. 연대별 기록 (시대별 핵심 흐름과 사건)'),
                  e('textarea', { rows: 2, placeholder: '70년대 포크, 90년대 댄스아이돌, 2020년대 숏폼 등 주요 흐름', value: reportForm.popRecords, onChange: (ev) => setReportForm({ ...reportForm, popRecords: ev.target.value }), className: 'w-full p-2 border border-teal-200 rounded-lg bg-white' })
                ),
                e('div', null,
                  e('label', { className: 'font-bold text-teal-900 block mb-1' }, '2. 연대별 특징 (1, 2, 3 형식의 3문장 작성)'),
                  [0, 1, 2].map(idx => e('input', {
                    key: idx,
                    type: 'text',
                    placeholder: `특징 문장 ${idx + 1} (${idx === 0 ? '장르' : idx === 1 ? '소비 매체' : '가사·정서'})`,
                    value: reportForm.popTraits[idx] || '',
                    onChange: (ev) => {
                      const up = [...reportForm.popTraits];
                      up[idx] = ev.target.value;
                      setReportForm({ ...reportForm, popTraits: up });
                    },
                    className: 'w-full p-1.5 border border-teal-200 rounded-lg bg-white mb-1.5 text-xs'
                  }))
                ),
                e('div', null,
                  e('label', { className: 'font-bold text-teal-900 block mb-1' }, '3. 대표곡 3가지 및 선정이유'),
                  [0, 1, 2].map(idx => e('div', { key: idx, className: 'flex gap-2 mb-1.5' },
                    e('input', {
                      type: 'text',
                      placeholder: `곡 ${idx + 1} 제목`,
                      value: reportForm.popTopSongs[idx]?.title || '',
                      onChange: (ev) => {
                        const up = [...reportForm.popTopSongs];
                        up[idx] = { ...up[idx], title: ev.target.value };
                        setReportForm({ ...reportForm, popTopSongs: up });
                      },
                      className: 'w-1/3 p-1.5 border border-teal-200 rounded-lg bg-white text-xs'
                    }),
                    e('input', {
                      type: 'text',
                      placeholder: '선정 이유 (시대적 의의)',
                      value: reportForm.popTopSongs[idx]?.reason || '',
                      onChange: (ev) => {
                        const up = [...reportForm.popTopSongs];
                        up[idx] = { ...up[idx], reason: ev.target.value };
                        setReportForm({ ...reportForm, popTopSongs: up });
                      },
                      className: 'w-2/3 p-1.5 border border-teal-200 rounded-lg bg-white text-xs'
                    })
                  ))
                ),
                e('div', null,
                  e('label', { className: 'font-bold text-teal-900 block mb-1' }, '4. 2030년 이후 미래 음악 예측 (1, 2, 3 형식의 3문장 작성)'),
                  [0, 1, 2].map(idx => e('input', {
                    key: idx,
                    type: 'text',
                    placeholder: `미래 예측 문장 ${idx + 1} (${idx === 0 ? '창작 주체' : idx === 1 ? '음악 형식' : '소비 가치'})`,
                    value: reportForm.popFuture[idx] || '',
                    onChange: (ev) => {
                      const up = [...reportForm.popFuture];
                      up[idx] = ev.target.value;
                      setReportForm({ ...reportForm, popFuture: up });
                    },
                    className: 'w-full p-1.5 border border-teal-200 rounded-lg bg-white mb-1.5 text-xs'
                  }))
                )
              ),

              // [주제 4 전용 폼: 동서양 이론 1:1 맞비교]
              reportForm.topicCategory === 'east_west' && e('div', { className: 'space-y-3 bg-amber-50/40 p-4 rounded-2xl border border-amber-200' },
                e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-3' },
                  e('div', null,
                    e('label', { className: 'font-bold text-amber-900 block mb-1' }, '1. 서양 음악 이론 분석'),
                    e('textarea', { rows: 2, placeholder: '피타고라스 음계, 오선보 기보 원리, 서양 지휘 도형 등', value: reportForm.ewWestern, onChange: (ev) => setReportForm({ ...reportForm, ewWestern: ev.target.value }), className: 'w-full p-2 border border-amber-200 rounded-lg bg-white' })
                  ),
                  e('div', null,
                    e('label', { className: 'font-bold text-amber-900 block mb-1' }, '2. 국악 전통 이론 분석'),
                    e('textarea', { rows: 2, placeholder: '삼분손익법(황종), 정간보 유량 기보, 호흡 장단 등', value: reportForm.ewGugak, onChange: (ev) => setReportForm({ ...reportForm, ewGugak: ev.target.value }), className: 'w-full p-2 border border-amber-200 rounded-lg bg-white' })
                  )
                ),
                e('div', null,
                  e('label', { className: 'font-bold text-amber-900 block mb-1' }, '3. 동서양의 1:1 맞비교 대조 분석'),
                  e('textarea', { rows: 3, placeholder: '동일한 음악적 문제에 대해 동양과 서양이 채택한 수학적·철학적 해결책의 차이점', value: reportForm.ewComparison, onChange: (ev) => setReportForm({ ...reportForm, ewComparison: ev.target.value }), className: 'w-full p-2 border border-amber-200 rounded-lg bg-white' })
                ),
                e('div', null,
                  e('label', { className: 'font-bold text-amber-900 block mb-1' }, '4. 실증 실험 및 현대적 시사점'),
                  e('textarea', { rows: 2, placeholder: '주파수 계산, 초견 연주 실험, 모션 센서 가속도 측정 결과 등', value: reportForm.ewActivity, onChange: (ev) => setReportForm({ ...reportForm, ewActivity: ev.target.value }), className: 'w-full p-2 border border-amber-200 rounded-lg bg-white' })
                )
              ),

              // [공통 필수: AI 프롬프트 질의 및 비판적 검증 기록]
              e('div', { className: 'p-3 bg-purple-50 rounded-xl space-y-2 border border-purple-200' },
                e('div', { className: 'flex items-center gap-1.5 text-purple-900 font-bold text-xs' },
                  e('i', { className: 'fa-solid fa-robot text-purple-600' }),
                  e('span', null, 'AI 활용 기록 (루브릭 채점 필수 반영 요소)')
                ),
                e('input', { type: 'text', placeholder: 'AI에게 입력한 질문(프롬프트)', value: reportForm.aiLog.prompt, onChange: (ev) => setReportForm({ ...reportForm, aiLog: { ...reportForm.aiLog, prompt: ev.target.value } }), className: 'w-full p-2 border rounded-lg bg-white text-xs' }),
                e('textarea', { rows: 2, placeholder: '학생의 비판적 검증 및 교정 내용 (AI 답변의 오류나 한계점을 스스로 보완한 점)', value: reportForm.aiLog.criticalReview, onChange: (ev) => setReportForm({ ...reportForm, aiLog: { ...reportForm.aiLog, criticalReview: ev.target.value } }), className: 'w-full p-2 border rounded-lg bg-white text-xs' })
              )
            ),

            e('div', { className: 'flex justify-end gap-2 p-4 border-t bg-slate-50' },
              e('button', { onClick: () => saveReport(false), className: 'px-4 py-2 border rounded-xl text-xs font-bold bg-white text-slate-700 hover:bg-slate-100' }, '임시 저장'),
              e('button', { onClick: () => saveReport(true), className: 'px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow' }, '최종 제출')
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
