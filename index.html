    // [주제 1] 교과 융합 탐구 활동 80선
    const FULL_INQUIRY_DATA = [
      // 1. 국어 (10선)
      { id: 'k1', subjectId: 'korean', subjectName: '국어', question: '힙합 랩의 라임과 고전 시가의 운율은 무엇이 다를까?', concept: '운율, 음보, 각운(행 끝 소리 맞추기), 박자의 강박·약박', hypothesis: '고전 시가는 행마다 음보 수가 일정하고, 랩은 행 끝 모음이 같은 비율(라임)이 더 높을 것이다.', variables: '독립: 글의 종류(시조·가사 5편 / 랩 5곡) / 종속: 행 끝 모음 일치율(%), 행당 음보 수의 편차 / 통제: 분석 분량(시조 1수, 랩 16마디), 같은 방식의 음절 나누기', activity: '가사를 음절 단위로 적고 행 끝 음절의 모음을 표시해 이웃한 행과 같은 비율을 계산한다. 음보 수는 소리 내어 읽으며 끊어 읽는 곳에 표시해 센다.' },
      { id: 'k2', subjectId: 'korean', subjectName: '국어', question: '대중가요 가사는 왜 시보다 쉬운 단어를 많이 쓸까?', concept: '구어와 문어, 고유어·한자어·외래어, 반복(후렴)의 기능', hypothesis: '대중가요 가사는 현대시보다 고유어 비율과 반복 구절 비율이 높고 한 어절의 평균 글자 수가 짧을 것이다.', variables: '독립: 글 종류(현대시 10편 / 음원 차트 상위곡 10곡) / 종속: 고유어 비율, 반복 구절 비율, 어절당 평균 글자 수 / 통제: 분석 분량(각 100어절)', activity: '100어절씩 잘라 표준국어대사전에서 단어의 어종을 확인해 분류표를 만들고, 같은 구절이 반복된 어절 수를 센다.' },
      { id: 'k3', subjectId: 'korean', subjectName: '국어', question: '슬픈 가사에 밝은 멜로디가 붙으면 정서가 어떻게 달라질까?', concept: '반어, 역설, 장조와 단조가 주는 분위기', hypothesis: '슬픈 내용의 가사가 밝은 장조 멜로디와 결합하면 단조와 결합할 때보다 가사와 곡의 분위기가 어긋난다는 평가가 높고 몰입도는 다르게 나타날 것이다.', variables: '독립: 같은 가사에 붙인 조성(장조 / 단조) / 종속: 몰입도·슬픔 정도(7점 척도) / 통제: 가사, 템포, 반주 악기, 길이(30초), 청취 환경', activity: '4행 가사를 쓰고 키보드로 장조·단조 두 버전을 녹음해 구글 폼으로 20명 이상에게 무작위 순서로 들려준 뒤 점수를 받는다.' },

      { id: 'k5', subjectId: 'korean', subjectName: '국어', question: '판소리 사설은 장단의 박에 어떻게 얹힐까?', concept: '판소리의 사설과 장단, 중모리장단의 구성, 음절과 박의 대응', hypothesis: '사설의 음절 수가 많은 대목일수록 한 박에 얹히는 음절 수가 많아지고, 의성어·의태어가 있는 부분은 박의 강한 자리에 놓이는 경우가 많을 것이다.', variables: '독립: 사설의 대목(느린 대목 / 빠른 대목 각 3개) / 종속: 한 박당 평균 음절 수 / 통제: 같은 명창의 같은 작품, 같은 장단 종류', activity: '음원을 들으며 박을 세어 사설을 박 칸에 나눠 적는 표를 만들고, 박당 음절 수를 계산한다. 의성어·의태어의 위치를 따로 표시한다.' },
      { id: 'k6', subjectId: 'korean', subjectName: '국어', question: 'K-POP 가사의 외래어·영어 혼용은 어떻게 변해 왔을까?', concept: '차용어, 언어 혼용, 문장 성분', hypothesis: '시기가 지날수록 영어는 단어 몇 개를 끼우는 수준에서 한 문장(절) 전체를 영어로 쓰는 방식으로 늘어났을 것이다.', variables: '독립: 시기(1990년대 / 2000년대 / 2010년대 / 2020년대) / 종속: 영어 어절 비율, 영어가 쓰인 단위(단어 / 구 / 문장)의 비율 / 통제: 아이돌 댄스곡으로 장르 한정, 시기당 곡 수 동일', activity: '시기별로 5~10곡을 정해 가사를 어절로 나누고 영어 어절과 영어 사용 단위를 센다.' },
      { id: 'k7', subjectId: 'korean', subjectName: '국어', question: '자음의 종류에 따라 노랫말이 얼마나 잘 들릴까?', concept: '예사소리·된소리·거센소리, 소리가 잘 들리는 정도, 받아쓰기 정확도', hypothesis: '된소리와 거센소리가 많이 들어간 단어는 반주 소리 속에서도 예사소리 단어보다 받아쓰기 정확도가 높을 것이다.', variables: '독립: 단어의 첫소리 유형(예사소리 / 된소리 / 거센소리) / 종속: 받아쓰기 정확도(%) / 통제: 같은 낭독자, 같은 반주 음량, 단어 길이(2음절)', activity: '유형별 단어 10개씩을 반주 위에 같은 세기로 낭독해 녹음하고, 청취자 20명 이상이 받아쓴 결과를 채점한다.' },
      { id: 'k8', subjectId: 'korean', subjectName: '국어', question: '시조 3장의 호흡은 노래로 부를 때 어떻게 배분될까?', concept: '시조의 3장 6구 구조, 음보, 시조창의 개념', hypothesis: '시조의 초장·중장·종장은 글자 수가 비슷해도 시조창으로 부를 때 걸리는 시간이 장마다 달라 종장이 특히 길게 불릴 것이다.', variables: '독립: 장(초장 / 중장 / 종장) / 종속: 장별 소요 시간(초), 글자당 소요 시간 / 통제: 같은 연주자의 같은 작품, 같은 길이의 시조', activity: '시조창 음원 3~5곡을 구해 오디오 재생기의 시간 표시로 장별 소요 시간을 재고, 글자 수로 나눈 값을 비교한다.' },
      { id: 'k9', subjectId: 'korean', subjectName: '국어', question: '노랫말의 감정 어휘는 시대에 따라 어떻게 달라졌을까?', concept: '감정 어휘, 텍스트 분석, 시대 배경과 공감', hypothesis: '사회적으로 어려웠던 시기의 인기곡은 비교 시기보다 위로·희망 어휘의 비율이 높고 이별 어휘의 비율은 낮을 것이다.', variables: '독립: 비교하는 두 시기(경제 위기 직후 / 안정기) / 종속: 긍정·부정·위로·이별 어휘 비율 / 통제: 시기별 상위 곡 수 동일, 곡당 분석 분량 동일', activity: '감정 어휘 분류표를 먼저 만들고, 가사에서 해당 어휘를 센 뒤 전체 어절 수로 나눠 비율을 비교한다.' },
      { id: 'k10', subjectId: 'korean', subjectName: '국어', question: '희곡의 갈등 구조와 소나타 형식은 닮았을까?', concept: '발단·전개·위기·절정·결말, 소나타 형식의 제시부·발전부·재현부', hypothesis: '소나타 형식에서 발전부가 차지하는 분량 비율은 희곡에서 갈등이 심화되는 전개~위기 구간의 분량 비율과 비슷할 것이다.', variables: '독립: 작품 종류(소나타 3곡 / 단막극 3편) / 종속: 각 부분이 전체에서 차지하는 분량 비율(%) / 통제: 완결된 작품만 선택', activity: '소나타는 악보나 음원 시간으로 세 부분의 분량을 재고, 희곡은 대본의 쪽수·줄 수로 단계별 분량을 센 뒤 비율을 막대그래프로 비교한다.' },

      // 2. 영어 (10선)
      { id: 'e1', subjectId: 'english', subjectName: '영어', question: '팝송은 우리말 번안곡보다 한 마디에 더 많은 음절이 들어갈까?', concept: '음절, 강세와 약화(연음·축약), 박자와 음절의 대응', hypothesis: '같은 멜로디에서 영어 원곡은 한국어 번안곡보다 한 마디에 들어가는 음절 수가 더 많거나 축약·연음이 더 자주 나타날 것이다.', variables: '독립: 언어(영어 원곡 / 한국어 번안곡) / 종속: 마디당 음절 수, 축약·연음 표시 횟수 / 통제: 같은 곡의 같은 마디, 같은 템포', activity: '원곡과 번안곡 5쌍에서 8마디씩 골라 마디마다 음절 수를 세고, 영어 가사에서 연음·축약이 나타난 횟수를 표시해 평균을 비교한다.' },
      { id: 'e2', subjectId: 'english', subjectName: '영어', question: '두운이 있는 후렴은 하루 뒤에도 더 잘 기억될까?', concept: '두운, 반복과 기억(귀벌레 현상), 회상 검사', hypothesis: '같은 첫소리가 반복되는 가사는 그렇지 않은 가사보다 24시간 뒤 회상 점수가 높을 것이다.', variables: '독립: 두운 사용 여부 / 종속: 24시간 뒤 빈칸 채우기 점수 / 통제: 같은 멜로디, 같은 길이(4행), 청취 3회, 같은 시간대 청취', activity: '직접 쓴 4행 영어 가사를 두운 버전과 비두운 버전으로 만들어 같은 멜로디로 부르고, 두 집단에게 3회 들려준 다음 날 빈칸 채우기 점수를 비교한다.' },
      { id: 'e3', subjectId: 'english', subjectName: '영어', question: '영어 원곡과 한국어 번안곡 중 어느 쪽이 한 마디에 더 많은 뜻을 담을까?', concept: '정보 밀도, 음절, 의미 단어(명사·동사·형용사)', hypothesis: '같은 마디 안에서 영어 원곡은 한국어 번안곡보다 의미 단어가 더 많이 들어갈 것이다.', variables: '독립: 언어(영어 원곡 / 한국어 번안곡 5쌍) / 종속: 마디당 의미 단어 수 / 통제: 같은 곡, 같은 마디 범위', activity: '번안곡이 알려진 노래를 골라 같은 8마디에서 의미 단어 수를 센 뒤 쌍별로 평균 차이를 계산한다.' },
      { id: 'e4', subjectId: 'english', subjectName: '영어', question: '랩 가사의 축약·속어는 박자 안에서 음절을 얼마나 줄여 줄까?', concept: '축약형(gonna, wanna 등), 속어, 음절 수와 박자', hypothesis: '축약형을 사용한 행은 표준형으로 고쳤을 때보다 음절 수가 적어 같은 박자 안에서 여유가 생길 것이다.', variables: '독립: 표현 형식(축약형 / 표준형) / 종속: 같은 행의 음절 수, 한 박에 들어가는 음절 수 / 통제: 같은 행, 같은 곡', activity: '랩 가사 5곡에서 축약형이 포함된 행을 10개씩 뽑아 표준형으로 바꿔 쓴 뒤 두 형태의 음절 수를 센다.' },
      { id: 'e5', subjectId: 'english', subjectName: '영어', question: '영어↔한국어로 바뀌는 지점은 얼마나 자연스럽게 들릴까?', concept: '언어 전환, 연음, 말소리의 연결', hypothesis: '영어 단어가 모음으로 끝나 한국어 단어와 부드럽게 이어지는 전환이 자음으로 끝나는 전환보다 어색함 점수가 낮을 것이다.', variables: '독립: 전환 직전 영어 단어의 끝소리(모음 / 자음) / 종속: 어색함 점수(7점 척도) / 통제: 같은 곡, 같은 가수, 전환 구간 길이(약 5초)', activity: '아이돌 곡 5곡에서 전환 구간을 골라 끝소리 유형별로 분류하고, 청취자 20명에게 구간을 들려준 뒤 점수를 받는다.' },
      { id: 'e6', subjectId: 'english', subjectName: '영어', question: '노래가 빠를수록 축약형 단어가 더 많이 쓰일까?', concept: '축약형, BPM(분당 박 수), 상관관계', hypothesis: '곡의 템포가 빠를수록 100단어당 축약형 단어의 수가 많아질 것이다.', variables: '독립: 곡의 템포(BPM) / 종속: 100단어당 축약형 개수 / 통제: 같은 장르, 비슷한 연도의 곡', activity: '곡 20곡의 BPM을 탭 템포 방식으로 측정하고 가사에서 축약형 개수를 센다. 산점도를 그려 상관 정도를 확인한다.' },
      { id: 'e7', subjectId: 'english', subjectName: '영어', question: '팝송에서 강박에 오는 음절은 정말 강세 음절일까?', concept: '단어 강세, 강박·약박, 운율 매칭', hypothesis: '영어 가사에서 강박에 놓이는 음절은 약박에 놓이는 음절보다 사전상 강세 음절일 확률이 높을 것이다.', variables: '독립: 음절의 위치(강박 / 약박) / 종속: 강세 음절 비율(%) / 통제: 4/4박자의 곡, 같은 마디 수(곡당 8마디)', activity: '곡 5곡의 악보나 가사 영상에서 8마디씩 골라 강박 위치 음절의 강세를 영어 사전으로 확인해 표에 정리한다.' },
      { id: 'e8', subjectId: 'english', subjectName: '영어', question: '영어 비중이 높은 K-POP 곡은 해외 차트에 더 오래 머물까?', concept: '문화 산업, 언어와 접근성, 차트 지표', hypothesis: '가사에서 영어 비중이 높은 곡이 한국어 중심 곡보다 해외 차트 진입 주 수가 길 것이다.', variables: '독립: 영어 가사 비중(높음 / 낮음) / 종속: 차트 진입 주 수 / 통제: 같은 아티스트 또는 비슷한 인지도의 곡을 짝지어 비교', activity: '해외 차트에 진입한 곡 10~20곡을 골라 영어 어절 비율을 계산하고 차트 공식 기록의 진입 주 수와 비교한다.' },
      { id: 'e9', subjectId: 'english', subjectName: '영어', question: '영국 가수와 미국 가수는 노래할 때 단어 끝 r을 다르게 발음할까?', concept: '영국식·미국식 발음 차이, r 발음 여부', hypothesis: '영국 가수의 노래에서는 단어 끝 r을 발음하는 비율이 미국 가수보다 낮겠지만, 팝 창법에서는 미국식 발음을 쓰는 경우도 많아 차이가 작을 것이다.', variables: '독립: 가수의 출신(영국 / 미국) / 종속: 단어 끝 r을 발음한 비율 / 통제: 같은 장르, 비슷한 템포, 곡당 후렴 1회의 같은 분량', activity: '곡 5곡씩 정해 후렴에서 단어 끝 r이 있는 단어를 찾아 직접 듣고 r 소리가 들리는지 체크한 다음 비율을 계산한다.' },
      { id: 'e10', subjectId: 'english', subjectName: '영어', question: '동음이의어 말장난은 가사의 재미를 높일까?', concept: '동음이의어, 중의적 표현, 언어유희', hypothesis: '말장난이 들어간 가사는 직설적인 가사보다 흥미도 점수가 높을 것이다.', variables: '독립: 가사 유형(말장난 / 직설) / 종속: 흥미도(7점 척도), 이해도 퀴즈 점수 / 통제: 같은 멜로디, 같은 길이, 청취자의 영어 실력 수준', activity: '영어 가사에서 말장난 사례를 3~5개 찾아 정리하고, 직접 쓴 두 버전의 가사를 청취자 20명에게 들려준 뒤 흥미도와 이해도를 점수화한다.' },

      // 3. 수학 (10선)
      { id: 'm1', subjectId: 'math', subjectName: '수학', question: '피아노 12반음은 왜 등차수열이 아니라 등비수열일까?', concept: '등비수열, 거듭제곱근, 지수함수, 진동수(Hz)', hypothesis: '인접한 반음의 진동수 비는 거의 일정(약 1.0595)하며, 건반 번호와 진동수의 관계는 지수함수에 가깝다.', variables: '독립: 건반 번호 / 종속: 측정한 진동수(Hz), 인접 음 진동수 비 / 통제: 같은 악기, 같은 앱, 기준음 A4=440Hz', activity: '디지털 피아노의 12음을 튜너 앱으로 3회씩 측정해 평균을 내고, 인접 음의 비를 계산한 뒤 스프레드시트에서 지수 추세선을 확인한다.' },
      { id: 'm2', subjectId: 'math', subjectName: '수학', question: '12음을 한 번씩 모두 돌려면 음을 몇 반음씩 옮겨야 할까?', concept: '나머지 연산, 최대공약수, 서로소, 순환하는 규칙성', hypothesis: '한 음에서 k반음씩 반복해 올라갈 때 서로 다른 음의 개수는 12와 k의 최대공약수로 12를 나눈 값이다.', variables: '독립: 이동 간격 k(1~11반음) / 종속: 한 바퀴 돌 때까지 만나는 서로 다른 음의 수 / 통제: 시작 음(도), 12반음 체계', activity: '스프레드시트에서 나머지를 계산해 처음 반복되는 순간까지의 음 개수를 센 뒤 가설 식과 비교한다. 5도권의 순서와 비교해 본다.' },
      { id: 'm3', subjectId: 'math', subjectName: '수학', question: '바흐 인벤션의 선율 변화는 좌표평면의 대칭이동으로 표현될까?', concept: '점의 평행이동·대칭이동, 좌표평면, 음악의 역행·반전', hypothesis: '모티브를 거꾸로 연주한 역행은 시간축(x) 대칭이동, 음높이를 뒤집은 반전은 음높이축(y) 대칭이동으로 나타낼 수 있다.', variables: '독립: 변환의 종류(평행이동 / 역행 / 반전) / 종속: 변환 후 좌표와 실제 악보 음의 일치율(%) / 통제: 같은 모티브', activity: '악보에서 모티브를 골라 가로축=박, 세로축=음높이로 점을 찍고, 변환 식을 적용한 좌표와 악보에서 찾은 해당 음을 비교한다.' },
      { id: 'm4', subjectId: 'math', subjectName: '수학', question: '클라이맥스는 정말 곡의 61.8% 지점에 올까?', concept: '비율, 황금비(약 0.618), 평균과 오차율', hypothesis: '곡의 클라이맥스 마디가 전체 마디에서 차지하는 위치 비율은 0.618 근처에 몰릴 것이다.', variables: '독립: 분석할 곡(5~10곡) / 종속: 클라이맥스 위치 비율, 0.618과의 차이 / 통제: 클라이맥스 정의 사전 고정, 같은 악장 형식', activity: '곡마다 전체 마디 수와 클라이맥스 마디를 세어 비율을 계산하고 평균과 0.618의 차이를 표와 그래프로 정리한다.' },
      { id: 'm5', subjectId: 'math', subjectName: '수학', question: '협화음일수록 합성파의 반복 주기가 짧을까?', concept: '삼각함수의 그래프와 주기, 진동수의 정수비, 합성파', hypothesis: '두 음의 진동수 비가 간단한 정수비일수록 두 파동을 합친 파형이 반복되는 주기가 짧다.', variables: '독립: 음정(완전5도 3:2, 장3도 5:4, 증4도 근사 7:5) / 종속: 합성파의 반복 주기 / 통제: 같은 기준 진동수, 같은 진폭', activity: '지오지브라에서 합성파 그래프를 그려 음정별로 파형이 처음 반복되는 시간을 읽고 어울림 점수와 비교한다.' },
      { id: 'm6', subjectId: 'math', subjectName: '수학', question: '3:2 폴리리듬은 최소공배수로 설명할 수 있을까?', concept: '최소공배수, 분수의 덧셈, 폴리리듬', hypothesis: 'a:b 폴리리듬에서 두 박이 동시에 울리는 간격은 a와 b의 최소공배수에 해당하는 칸 수이며, 비가 복잡할수록 그 칸 수가 커진다.', variables: '독립: 폴리리듬의 비율(3:2, 4:3, 5:4) / 종속: 공통 그리드의 칸 수, 동시에 울리는 간격 / 통제: 한 주기의 길이', activity: '메트로놈 앱 두 개로 동시 연주하며 동시에 울린 순간을 녹음해 표시하고, 스프레드시트에 일치한 지점을 확인한다.' },
      { id: 'm7', subjectId: 'math', subjectName: '수학', question: '두 주사위의 합으로 고른 음악 마디는 골고루 나올까?', concept: '경우의 수, 확률, 두 주사위 합의 분포', hypothesis: '두 주사위 합으로 마디를 고르면 합 7에 해당하는 마디가 가장 자주 선택되고, 합 2·12 마디는 거의 선택되지 않는다.', variables: '독립: 주사위 합(2~12) / 종속: 선택 횟수, 상대도수 / 통제: 같은 주사위 두 개, 던지는 방식 동일, 시행 100회', activity: '주사위 두 개를 100회 던져 합의 도수분포표를 만들고 이론 확률과 비교한 뒤, 8마디 곡을 직접 조립해 본다.' },
      { id: 'm8', subjectId: 'math', subjectName: '수학', question: '취향 벡터가 비슷한 곡일수록 만족도가 높을까?', concept: '벡터의 성분과 내적, 코사인 유사도, 상관관계', hypothesis: '사용자의 선호 벡터와 곡의 특성 벡터의 코사인 유사도가 클수록 청취 후 만족도 점수가 높을 것이다.', variables: '독립: 코사인 유사도 / 종속: 청취 후 만족도(5점 척도) / 통제: 곡의 길이(1분), 청취 순서 무작위', activity: '곡의 특성을 2~3개 점수로 정하고, 학생의 선호 벡터와 곡 벡터의 유사도를 구한 뒤 만족도를 받아 산점도를 그린다.' },
      { id: 'm9', subjectId: 'math', subjectName: '수학', question: '〈클래핑 뮤직〉의 박수 패턴을 한 칸씩 밀면 일치하는 박은 몇 개일까?', concept: '순환하는 패턴, 나머지 연산, 경우의 수 세기', hypothesis: '12박 패턴 하나를 한 칸씩 밀면 두 사람이 동시에 박수치는 박의 수는 칸마다 달라지고, 12칸을 밀면 원래 패턴으로 돌아온다.', variables: '독립: 밀어낸 칸 수(0~12) / 종속: 동시에 박수치는 박의 수 / 통제: 같은 12박 패턴, 같은 순환 방식', activity: '12박 패턴을 0과 1로 표시하고, 한 줄을 한 칸씩 밀어가며 같은 위치에 1이 겹치는 개수를 표로 센다. 실제 박수로도 연주해 본다.' },
      { id: 'm10', subjectId: 'math', subjectName: '수학', question: '히트곡의 길이는 시대에 따라 짧아졌을까?', concept: '평균, 표준편차, 정규분포, 모평균의 추정', hypothesis: '2010년대 후반 이후 인기곡의 평균 길이는 그 이전 시기보다 짧을 것이다.', variables: '독립: 시기(2000년대 / 2020년대) / 종속: 곡 길이의 평균과 표준편차 / 통제: 같은 차트, 시기별 같은 곡 수(20~30곡)', activity: '공식 차트에서 시기별 상위 곡의 재생 시간을 모아 스프레드시트로 평균·표준편차를 구하고, 히스토그램을 그려 비교한다.' },

      // 4. 사회 (10선)
      { id: 's1', subjectId: 'social', subjectName: '사회', question: '콘서트 티켓은 어떤 방식으로 나누면 가장 공정하다고 느껴질까?', concept: '수요와 공급, 시장 실패, 공정성 인식, 배분 방식', hypothesis: '추첨제는 선착순이나 경매제보다 공정하다는 인식이 높고, 경매제는 높은 가격에 거래되지만 불공정하다는 평가가 높을 것이다.', variables: '독립: 배분 방식(추첨 / 선착순 / 가상 경매) / 종속: 공정성 인식(7점 척도), 가상 낙찰가 / 통제: 좌석 수, 참가 인원, 같은 가상 공연', activity: '학급에서 가상 공연의 좌석을 세 가지 방식으로 나누는 모의 상황을 진행하고 끝난 뒤 공정성 설문을 받는다.' },
      { id: 's2', subjectId: 'social', subjectName: '사회', question: '배경음악의 빠르기에 따라 사람의 걷는 속도와 선택 시간이 달라질까?', concept: '소비 심리, 환경 요인, 관찰 연구 변인 통제', hypothesis: '빠른 템포 음악에서는 같은 거리를 걷는 시간이 짧고, 느린 템포 음악에서는 길어질 것이다.', variables: '독립: 배경음악 템포(느림 / 보통 / 빠름) / 종속: 10m 걷는 시간, 물건 고르는 시간 / 통제: 같은 장소, 같은 음량, 순서 무작위', activity: '교내 복도에서 참가자가 이어폰으로 음악을 들으며 10m를 걷는 시간을 스톱워치로 3회 재서 평균을 비교한다.' },
      { id: 's3', subjectId: 'social', subjectName: '사회', question: '팬덤의 ‘총공(집중 스트리밍)’ 참여는 소속감과 어떤 관련이 있을까?', concept: '집단행동, 팬덤 문화, 소속감, 설문 조사 방법', hypothesis: '팬덤 활동 기간이 길거나 참여 빈도가 높을수록 공동체 소속감 점수가 높을 것이다.', variables: '독립: 팬덤 활동 기간·참여 빈도 / 종속: 소속감 점수(5점 척도 문항 합) / 통제: 같은 연령대(교내), 같은 설문지', activity: '익명 설문으로 참여 빈도와 소속감 문항 5개를 묻고, 참여 빈도별 평균 점수를 비교한다.' },
      { id: 's4', subjectId: 'social', subjectName: '사회', question: '음원 수익 정산 방식을 바꾸면 인디 음악가의 몫은 늘어날까?', concept: '플랫폼 경제, 비례배분 정산과 이용자별 정산, 분배의 공정성', hypothesis: '이용자별 정산 방식으로 계산하면 비례배분 방식보다 상위 아티스트의 몫이 줄고 소규모 아티스트의 몫이 늘어날 것이다.', variables: '독립: 정산 방식(비례배분 / 이용자별) / 종속: 아티스트별 정산액, 상위 1팀 점유율 / 통제: 같은 가상 이용자 수와 총 수익', activity: '가상 이용자 10명의 월 청취 횟수 표를 만들고 스프레드시트에서 두 방식으로 정산액을 계산해 비교한다.' },
      { id: 's5', subjectId: 'social', subjectName: '사회', question: '임대료가 오르면 지역의 공연·연습 공간은 어떻게 달라질까?', concept: '도시 변화, 상업 젠트리피케이션, 문화 공간', hypothesis: '임대료가 크게 오른 지역에서는 소규모 문화 공간의 수가 줄거나 다른 지역으로 이동했을 것이다.', variables: '독립: 시기(임대료 상승 전 / 후) / 종속: 공연장·연습실 수, 폐업 사례 / 통제: 같은 지역 범위, 같은 자료 출처', activity: '공공데이터포털 등에서 시기별 점포·문화공간 수를 찾아 표로 정리하고, 지역 뉴스 기사로 사례를 보완한다.' },
      { id: 's6', subjectId: 'social', subjectName: '사회', question: '지역마다 민요의 선율은 어떻게 다를까?', concept: '지역별 민요 특징(토리), 음역, 선율의 도약', hypothesis: '지역별 대표 민요는 음역의 폭과 큰 도약의 빈도가 서로 다르게 나타날 것이다.', variables: '독립: 지역(4곳 이상) / 종속: 음역의 폭(반음 수), 3도 이상 도약 횟수 / 통제: 같은 길이(8마디)의 대표 민요, 같은 조표 환산', activity: '지역별 대표 민요 악보에서 가장 낮은 음과 높은 음의 반음 차, 3도 이상 도약 횟수를 센다.' },
      { id: 's7', subjectId: 'social', subjectName: '사회', question: '선거송은 후보 이름과 공약 기억에 도움이 될까?', concept: '정치 커뮤니케이션, 프레이밍, 기억과 설득', hypothesis: '선거송을 들은 집단은 구호를 들은 집단보다 가상 후보 이름 회상 점수가 높지만 정책 이해도는 차이가 작을 것이다.', variables: '독립: 홍보 방식(선거송 / 구호 낭독) / 종속: 이름·기호 회상 점수, 정책 이해도 퀴즈 점수 / 통제: 노출 시간(30초), 가상 후보 공약', activity: '학급을 두 집단으로 나눠 같은 가상 후보를 서로 다른 방식으로 소개하고, 다음 시간에 회상·이해도 퀴즈 평균을 비교한다.' },
      { id: 's8', subjectId: 'social', subjectName: '사회', question: '거리 공연이 있는 골목은 사람들이 더 오래 머물까?', concept: '도시 경제, 외부 효과, 집객 효과, 관찰 조사', hypothesis: '공연이 있는 시간대의 골목은 공연이 없는 시간대보다 통행량과 머문 시간이 더 클 것이다.', variables: '독립: 공연 유무 / 종속: 5분당 통행 인원, 머문 사람 수 / 통제: 같은 장소, 같은 요일·시간대, 날씨', activity: '허락받은 장소에서 5분 단위로 손 카운터를 사용해 3회 세고, 상인 인터뷰로 사례를 보완한다.' },
      { id: 's9', subjectId: 'social', subjectName: '사회', question: '인공지능이 만든 곡은 저작권을 인정받을 수 있을까?', concept: '저작권, 창작물의 요건, 지식재산권, 토론', hypothesis: '학생들은 AI 생성 곡의 완전한 저작권 인정에는 반대하지만 인간 기여가 큰 경우 일부 보호에 찬성하는 비율이 높을 것이다.', variables: '독립: 제시된 상황(AI 전적 생성 / 인간 수정) / 종속: 보호 찬성률, 이유 유형 / 통제: 같은 설명 자료, 같은 설문 문항', activity: '저작권법의 저작물 정의와 국내외 관련 사례를 조사하고, 모의 토론 후 설문으로 찬반과 이유를 분류한다.' },
      { id: 's10', subjectId: 'social', subjectName: '사회', question: '추모 음악은 사람들의 공감과 연대감에 어떤 영향을 줄까?', concept: '사회심리학, 애도 의례, 공동체 의식, 연구 윤리', hypothesis: '추모 음악을 듣고 난 뒤 공동체 연대감 점수가 중립 음악을 들은 뒤보다 높을 것이다.', variables: '독립: 들려준 음악(추모 음악 / 중립 음악) / 종속: 연대감 점수(5점 척도), 참여 의향 / 통제: 같은 길이(2분), 같은 환경, 자율 참여', activity: '두 집단에게 서로 다른 음악을 들려준 뒤 같은 문항으로 점수를 받는다. 구체적 사건 사진은 배제하고 윤리를 준수한다.' },

      // 5. 과학 (10선)
      { id: 'sc1', subjectId: 'science', subjectName: '과학', question: '공간과 벽 재질에 따라 소리의 울림(잔향) 시간은 어떻게 달라질까?', concept: '파동의 반사와 흡수, 잔향, 소리 에너지 감쇠', hypothesis: '벽면이 부드럽고 흡음이 잘 되는 공간일수록 소리가 사라지는 데 걸리는 시간이 짧을 것이다.', variables: '독립: 공간 유형(타일 화장실 / 커튼 음악실 / 빈 교실) / 종속: 소리가 작아지는 데 걸린 시간 / 통제: 같은 박수 세기, 같은 마이크 위치', activity: '같은 위치에서 박수를 쳐서 녹음하고 오디오 편집 프로그램 파형에서 진폭이 약 -20dB로 줄어드는 시간을 읽어 평균을 낸다.' },
      { id: 'sc2', subjectId: 'science', subjectName: '과학', question: '실로폰과 마림바는 소리의 여운이 왜 다를까?', concept: '진동과 감쇠, 재질의 탄성, 진폭 감소', hypothesis: '금속 실로폰 막대는 나무 마림바 막대보다 소리의 여운이 더 길게 이어질 것이다.', variables: '독립: 막대의 재질(금속 / 나무) / 종속: 소리가 최대값의 10%로 줄어드는 시간 / 통제: 같은 음높이, 같은 타격 높이, 같은 마이크 거리', activity: '두 악기에서 같은 음을 추를 떨어뜨려 같은 힘으로 친 뒤 녹음 파형에서 감소 시간을 읽어 평균을 낸다.' },
      { id: 'sc3', subjectId: 'science', subjectName: '과학', question: '병에 물을 채워 불 때와 두드릴 때 소리의 높낮이가 반대인 이유는?', concept: '기주 공명(불 때), 고체 진동(두드릴 때), 진동수와 질량', hypothesis: '병을 불면 물이 많을수록 공기 기둥이 짧아 소리가 높아지고, 두드리면 물이 많을수록 전체 질량이 커져 소리가 낮아진다.', variables: '독립: 병 속 물의 높이 / 종속: 불었을 때와 두드렸을 때의 진동수(Hz) / 통제: 같은 병, 같은 세기, 같은 앱, 같은 온도', activity: '물 높이를 2cm 간격으로 바꿔가며 주파수 앱으로 진동수를 3회씩 재고 물 높이-진동수 그래프를 그려 비교한다.' },
      { id: 'sc4', subjectId: 'science', subjectName: '과학', question: '움직이는 소리의 높낮이는 이론식과 얼마나 맞을까?', concept: '도플러 효과, 상대 속도, 진동수의 변화', hypothesis: '소리를 내는 물체가 다가올 때는 진동수가 높게, 멀어질 때는 낮게 측정되며 이론값과 비슷할 것이다.', variables: '독립: 음원의 움직임(다가옴 / 멈춤 / 멀어짐) / 종속: 측정된 진동수 / 통제: 같은 음원(440Hz), 같은 달리기 속도, 마이크 위치', activity: '운동장에서 스피커로 440Hz 톤을 틀고 달리며 고정 위치의 주파수 앱으로 측정해 이론식 값과 비교한다.' },
      { id: 'sc5', subjectId: 'science', subjectName: '과학', question: '서로 반대 위상의 소리를 합치면 소리가 줄어들까?', concept: '파동의 간섭, 상쇄 간섭, 위상', hypothesis: '같은 위치에서 두 소리를 역위상으로 재생하면 동위상일 때보다 소리의 세기가 작을 것이다.', variables: '독립: 위상 조건(동위상 / 역위상) / 종속: 소리의 세기(dB) / 통제: 같은 단일 진동수 톤, 스피커 위치, 측정 위치', activity: '한쪽 채널의 위상을 반전한 파일을 만들어 스피커 두 대를 가깝게 두고 소음 측정 앱으로 세기를 3회 잰다.' },
      { id: 'sc6', subjectId: 'science', subjectName: '과학', question: '같은 음이라도 악기마다 소리가 다른 이유는?', concept: '진동수, 기본음과 배음, 음색, 스펙트럼', hypothesis: '악기마다 같은 음을 내더라도 배음 구성이 달라 스펙트럼의 모양이 다르게 나타난다.', variables: '독립: 악기 종류(리코더, 기타, 피아노) / 종속: 배음별 상대 세기 / 통제: 같은 음높이, 같은 음량, 같은 녹음 위치', activity: '같은 음(A4)을 각 악기로 연주해 스펙트럼 분석 앱으로 기본음과 2·3·4배음의 상대 세기를 읽어 그래프로 비교한다.' },
      { id: 'sc7', subjectId: 'science', subjectName: '과학', question: '온도가 올라가면 리코더 소리는 높아질까?', concept: '소리의 속력과 온도, 관의 공명, 진동수', hypothesis: '기온이 높을수록 소리의 속력이 커져 리코더의 같은 운지 소리가 더 높아질 것이다.', variables: '독립: 실내 기온 / 종속: 튜너로 잰 음높이 편차(센트) / 통제: 같은 리코더, 같은 운지법, 같은 숨의 세기', activity: '온도가 다른 장소(차가운 복도 / 따뜻한 교실)에서 리코더를 불어 튜너 앱으로 편차를 3회 재고 기온과 함께 기록한다.' },
      { id: 'sc8', subjectId: 'science', subjectName: '과학', question: '실 전화기는 실의 팽팽함에 따라 소리가 어떻게 달라질까?', concept: '파동의 매질, 고체를 통한 소리의 전달, 장력', hypothesis: '실이 팽팽할수록(장력이 클수록) 상대편이 듣는 소리의 세기가 커질 것이다.', variables: '독립: 실의 팽팽함(느슨 / 보통 / 팽팽) / 종속: 상대편 컵 입구에서 잰 소리 세기(dB) / 통제: 같은 실과 컵, 같은 길이(5m), 같은 음원 음량', activity: '종이컵 실 전화기 한쪽에 스피커로 소리를 틀고 반대쪽 컵에서 소음 측정 앱으로 세기를 3회 잰다.' },
      { id: 'sc9', subjectId: 'science', subjectName: '과학', question: '소리의 진동수에 따라 판 위의 모래 무늬는 어떻게 달라질까?', concept: '정상파, 공명(고유 진동수), 마디선', hypothesis: '진동수를 서서히 높이면 특정 공명 진동수에서만 선명한 무늬가 나타나고, 진동수가 높을수록 무늬가 복잡해질 것이다.', variables: '독립: 입력 진동수 / 종속: 선명한 무늬가 나타난 진동수, 마디 영역 개수 / 통제: 판의 재질과 크기, 소금 양, 스피커 출력', activity: '스피커 위에 판을 고정하고 소금을 뿌린 뒤 주파수를 천천히 올려가며 무늬가 또렷해지는 진동수를 기록하고 촬영한다.' },
      { id: 'sc10', subjectId: 'science', subjectName: '과학', question: '음악을 들려주면 콩나물은 더 잘 자랄까?', concept: '식물의 생장, 대조 실험, 통제된 변인', hypothesis: '음악을 들려준 콩나물과 들려주지 않은 콩나물의 7일 생장에는 차이가 없거나 작을 것이다.', variables: '독립: 소리 조건(무음 / 70dB 음악 / 70dB 소음) / 종속: 7일 후 줄기 길이, 무게 / 통제: 빛, 물의 양, 온도, 같은 콩 개수', activity: '콩나물 키트 3세트를 준비해 매일 줄기 길이를 재고 7일째에 무게를 전자저울로 재어 비교한다.' },

      // 6. 한국사 (10선)
      { id: 'h1', subjectId: 'history', subjectName: '한국사', question: '세종은 왜 음악(편경·율관) 정비에 힘을 쏟았을까?', concept: '조선 전기 예악 정치, 악기 국산화, 음률 기준과 도량형', hypothesis: '세종의 음악 정비는 단순 예술 사업이 아니라 의례를 갖추고 자주성을 높이며 기준을 세우려는 국가 정책이었을 것이다.', variables: '비교: 세종실록 음악 기사 5건 / 분석 관점: 예악 정비, 자주성, 재료, 도량형 연결 / 통제: 같은 시기 사료', activity: '실록에서 편경·율관·경석 기사를 검색해 목적별 분류표에 정리하고 자주성과 국가 제도 개혁의 상관성을 분석한다.' },
      { id: 'h2', subjectId: 'history', subjectName: '한국사', question: '농사일의 종류에 따라 노동요는 어떻게 다를까?', concept: '조선 후기 이앙법, 두레와 공동 노동, 노동요 선후창', hypothesis: '여럿이 함께 하는 노동일수록 선후창 구조가 뚜렷하고, 일의 속도에 맞춰 노래의 빠르기도 다르게 나타날 것이다.', variables: '비교: 작업 종류별 노동요(모내기·논매기·타작) / 분석 관점: 선후창 유무, 빠르기(BPM) / 통제: 같은 채록 출처', activity: '공식 음원에서 곡을 골라 박자를 두드려 BPM을 재고 선소리와 후렴이 교대하는지 표에 표시한다.' },
      { id: 'h3', subjectId: 'history', subjectName: '한국사', question: '유신 시기 금지곡은 어떤 이유로 지정되었을까?', concept: '유신 체제, 긴급조치, 대중문화 통제, 청년 포크', hypothesis: '공식적으로 밝힌 금지 사유와 실제 가사의 주제를 비교하면 둘 사이에 차이가 있을 것이다.', variables: '비교: 대표 금지곡 5곡의 공식 금지 사유와 가사 주제 / 분석 관점: 사유 분류와 가사 주제 대조 / 통제: 1970년대 자료', activity: '공공기록으로 금지곡 목록과 공식 사유를 확인해 표에 정리하고 가사의 실제 주제를 분류해 대조한다.' },
      { id: 'h4', subjectId: 'history', subjectName: '한국사', question: '일제강점기의 대중가요는 당시 사람들의 정서를 어떻게 보여 줄까?', concept: '근대 대중가요 형성, 유성기 음반, 서양 음악 수용, 식민지 정서', hypothesis: '〈사의 찬미〉는 서양 선율에 비관적 노랫말이 결합한 곡으로, 당시 신문 기사와 반응에서 그 정서가 주목받았을 것이다.', variables: '비교: 원곡 선율과 사의 찬미의 빠르기, 노랫말 어휘 / 분석 관점: BPM, 비관·허무 어휘 비율, 당시 기사 / 통제: 같은 판본', activity: '음원에서 BPM을 재고 가사 어휘를 분류하며, 신문 아카이브에서 당시 기사를 찾아 대중 반응을 요약한다.' },
      { id: 'h5', subjectId: 'history', subjectName: '한국사', question: '고려는 중국에서 들여온 궁중 음악을 어떻게 받아들였을까?', concept: '고려의 대외 관계, 궁중 의례 아악, 향악과 당악', hypothesis: '송에서 아악을 들여온 일은 국가 의례의 격식을 갖추려는 정책과 외교 관계와 관련이 있었을 것이다.', variables: '비교: 도입 이전과 이후의 궁중 음악 기록 / 분석 관점: 도입 시기, 악기와 곡, 사용 의례 / 통제: 고려사 악지', activity: '고려사 악지와 교과서를 비교해 도입 시기, 악기 종류, 사용된 의례를 연표와 표로 정리한다.' },
      { id: 'h6', subjectId: 'history', subjectName: '한국사', question: '조선 후기 장시의 발달은 판소리 공연과 어떤 관련이 있을까?', concept: '조선 후기 상업 발달과 장시, 서민 문화, 판소리 전승', hypothesis: '장시가 발달한 지역은 판소리 공연과 명창의 활동이 활발했던 지역과 겹칠 것이다.', variables: '비교: 장시의 분포 지도와 명창의 활동지 지도 / 분석 관점: 두 지도의 지리적 중첩 / 통제: 18~19세기 한정', activity: '교과서 지도에서 장시 분포를 확인하고 명창 출신지·활동지 지도를 대조해 겹치는 지역을 표로 센다.' },
      { id: 'h7', subjectId: 'history', subjectName: '한국사', question: '대한제국의 애국가는 어떤 음계로 만들어졌을까?', concept: '대한제국, 서양식 군악대, 애국가 제정, 5음과 7음 음계', hypothesis: '대한제국 시기의 애국가 선율은 서양 7음 음계와 5음 음계 중 어느 쪽에 더 가까운지 음의 사용 빈도로 확인할 수 있다.', variables: '비교: 악보에서 사용된 음의 종류 / 분석 관점: 음의 빈도, 5음 음계 해당 음의 비율 / 통제: 같은 악보 판본', activity: '악보의 음 이름을 세어 빈도표를 만들고 5음 음계에 해당하는 음의 비율을 계산한다.' },
      { id: 'h8', subjectId: 'history', subjectName: '한국사', question: '〈새야 새야 파랑새야〉는 동학농민운동과 어떤 관련으로 해석될까?', concept: '동학농민운동, 구전 민요, 상징과 은유, 역사 해석의 다양성', hypothesis: '노래의 상징은 동학농민운동과 연결되지만, 지역마다 가사가 달라 해석이 하나로 모이지는 않을 것이다.', variables: '비교: 지역별 채록 가사 5편 / 분석 관점: 새·녹두·청포장수 상징 어휘 사용 여부와 해석 / 통제: 같은 채록 자료집', activity: '채록 가사를 비교표로 정리하고 상징 어휘마다 연구자들이 제시한 여러 해석을 분리해 정리한다.' },
      { id: 'h9', subjectId: 'history', subjectName: '한국사', question: '한국전쟁기의 대중가요는 피란민에게 어떤 의미였을까?', concept: '한국전쟁, 흥남 철수, 피란 수도 부산, 대중가요의 정서적 기능', hypothesis: '피란 시기의 대중가요는 피란민의 상황과 그리움을 노래해 위로가 되었다는 증언이 구술 사료에 나타날 것이다.', variables: '비교: 피란 가요 3곡 속 지명·상황 / 분석 관점: 지명 어휘 빈도, 구술 속 노래 언급 / 통제: 1950년대 사료', activity: '가사에 나오는 지명과 상황을 표로 정리하고 공공 구술 기록에서 노래를 언급한 대목을 찾아 대조한다.' },
      { id: 'h10', subjectId: 'history', subjectName: '한국사', question: '〈임을 위한 행진곡〉은 어떻게 만들어지고 불려 왔을까?', concept: '5·18 민주화운동, 민중가요, 집단 가창, 역사적 기억', hypothesis: '이 곡은 행진에 맞는 박자와 따라 부르기 쉬운 선율을 가지고 있어 여럿이 함께 부르기에 적합한 구조를 띨 것이다.', variables: '비교: 곡의 박자·빠르기·음역 / 분석 관점: 박자, BPM(걸음 속도와 비교), 음역 폭 / 통제: 같은 악보 판본', activity: '악보에서 박자와 음역을 확인하고 음원에 맞춰 BPM을 재서 평균 걸음 속도와 비교 분석한다.' },

      // 7. 체육 (10선)
      { id: 'pe1', subjectId: 'pe', subjectName: '체육', question: '음악의 템포는 운동 중 심박수와 힘든 정도에 영향을 줄까?', concept: '심박수, 운동 자각도(RPE), 템포와 동작의 동조', hypothesis: '빠른 템포 음악을 들으며 운동하면 무음일 때보다 같은 운동에서 운동 횟수가 늘고 힘든 정도의 평가는 낮을 것이다.', variables: '독립: 음악 조건(무음 / 느린 음악 / 빠른 음악) / 종속: 2분 줄넘기 횟수, 직후 심박수, RPE / 통제: 같은 운동, 음량 80dB 이하, 순서 무작위', activity: '스마트워치나 맥박으로 심박수를 재고 횟수를 센다. 조건마다 충분히 쉰 뒤 반복해 평균을 비교한다.' },
      { id: 'pe2', subjectId: 'pe', subjectName: '체육', question: '마무리 운동에서 음악은 심박수 회복을 빠르게 할까?', concept: '심박 회복, 부교감신경 활성화, 정리 운동', hypothesis: '느린 음악을 들으며 정리하면 무음일 때보다 운동 직후 5분 동안 심박수가 안정 심박수로 돌아오는 속도가 빠를 것이다.', variables: '독립: 정리 중 음악(무음 / 느린 클래식 / 빠른 음악) / 종속: 운동 종료 1·3·5분 뒤 심박수 감소량 / 통제: 같은 운동 강도, 같은 정리 동작', activity: '운동 직후와 1·3·5분 뒤에 심박수를 기록해 조건별 감소량을 그래프로 비교한다.' },
      { id: 'pe3', subjectId: 'pe', subjectName: '체육', question: '음악의 박자와 걸음 박자가 맞으면 걷기·달리기가 더 편해질까?', concept: '케이던스(분당 걸음 수), 청각과 운동의 동조, 운동 효율', hypothesis: '자신의 평소 걸음 수와 비슷한 템포의 음악을 들을 때 걸음 수의 흔들림이 줄고 힘든 정도의 평가가 낮을 것이다.', variables: '독립: 음악 템포(평소보다 느림 / 같음 / 빠름) / 종속: 분당 걸음 수의 표준편차, 1km 소요 시간, RPE / 통제: 같은 코스, 같은 신발', activity: '스마트워치로 평소 케이던스를 측정한 뒤 같은 템포 음악을 준비해 조건마다 3회 반복 측정한다.' },
      { id: 'pe4', subjectId: 'pe', subjectName: '체육', question: '신나는 음악은 순간 힘(악력)을 높일까?', concept: '각성 수준, 최대 근력 측정, 개인차', hypothesis: '빠르고 강한 음악을 들은 직후 악력은 무음이나 차분한 음악을 들었을 때보다 약간 높게 나타날 수 있다.', variables: '독립: 음악 조건(무음 / 빠른 음악 / 차분한 음악) / 종속: 악력 측정값(kg), 최고값 / 통제: 같은 손, 같은 자세, 휴식 2분 이상', activity: '디지털 악력계로 조건마다 3회 측정해 최고값을 기록하고 학생 10명 이상의 평균을 비교한다.' },
      { id: 'pe5', subjectId: 'pe', subjectName: '체육', question: '연습한 점프 동작은 음악의 박과 얼마나 맞을까?', concept: '박자와 동작의 일치, 타이밍의 오차, 연습 효과', hypothesis: '연습 횟수가 늘수록 점프 착지 순간과 음악의 박 사이 시간 차이(오차)가 줄어들 것이다.', variables: '독립: 연습 횟수(0회 / 5회 / 10회 / 20회) / 종속: 착지 프레임과 박 소리 프레임의 시간 차(초) / 통제: 같은 안무, 같은 템포', activity: '스마트폰 60fps로 촬영하고 영상 편집 앱에서 착지 프레임과 메트로놈 박 소리 프레임의 시간 차를 구한다.' },
      { id: 'pe6', subjectId: 'pe', subjectName: '체육', question: '음악에 맞춘 줄넘기 훈련은 민첩성을 더 높일까?', concept: '협응성, 민첩성, 사전·사후 검사', hypothesis: '음악에 맞춰 발 동작을 바꾸는 리듬 줄넘기를 한 집단은 일반 줄넘기를 한 집단보다 훈련 후 민첩성 향상이 클 것이다.', variables: '독립: 훈련 방식(일반 줄넘기 / 리듬 줄넘기) / 종속: 20초 사이드스텝 횟수 향상량 / 통제: 같은 훈련 시간, 같은 측정 방법', activity: '훈련 전과 후(2~4주)에 20초 사이드스텝 횟수를 측정해 두 집단의 향상량 평균을 비교한다.' },

      { id: 'p5', title: '5. 제주 해녀의 노래', trait: '해녀문화는 2016년 유네스코 인류무형문화유산에 등재되었고, 물질과 배 젓기 때 부르는 노래가 전해집니다.', how: '가사와 현대어 해설, 제주어 발음 안내를 곁들인 음원과 지역 이야기 콘텐츠를 만듭니다. 구술 자료는 이용 허락 확인이 필요합니다.', impact: '노동과 음악의 관계, 지역 언어와 삶의 문화를 이해합니다.' },
      { id: 'p6', title: '6. 농요(모내기·논매기 소리)', trait: '농사일을 하며 부른 노동요로, 지역별로 가락과 가사가 다양합니다. 선소리와 후렴이 주고받는 구조가 많습니다.', how: '지역별 농요를 비교해 들어 보는 지도형 콘텐츠를 만들고, 선후창 따라 부르기 체험을 곁들입니다.', impact: '삶과 노래가 연결된 방식을 이해하고, 주고받는 노래 형식을 체험합니다.' },
      { id: 'p7', title: '7. 전래동요와 자장가', trait: '놀이와 육아 속에서 전해진 노래로, 짧고 반복적이며 말의 리듬이 살아 있습니다.', how: '노래 그림책, 놀이 카드, 가사 바꿔 부르기 활동지처럼 어린이 대상 상품으로 개발합니다.', impact: '어린 세대가 전통 음악에 친숙해지고 세대 간 소통 소재로 활용할 수 있습니다.' },
      { id: 'p8', title: '8. 대취타', trait: '임금의 행차나 군대 행진에 연주하던 취타와 타악 중심의 행진 음악으로, 태평소와 징, 북 등이 쓰입니다. 국가무형유산으로 지정되어 있습니다.', how: '악기 구성과 행진 의식을 설명하는 영상, 행사 오프닝용 음원과 해설 자료를 만듭니다.', impact: '의례 음악의 역할과 관악·타악 합주의 특성을 이해합니다.' },
      { id: 'p9', title: '9. 경기민요', trait: '서울과 경기 지역의 민요로, 비교적 맑고 경쾌한 선율이 특징입니다. 도라지타령, 늴리리야 등이 알려져 있습니다.', how: '대표곡 악보와 반주 음원, 가사 해설을 담은 학습 키트, 따라 부르기 앱형 콘텐츠를 만듭니다.', impact: '지역 음악의 특징을 비교해 이해하고 노래 부르기를 통해 전통 발성을 경험합니다.' },
      { id: 'p10', title: '10. 퓨전·창작국악', trait: '전통 음악 요소를 현대 장르와 결합한 음악입니다. 판소리 수궁가를 활용한 이날치 밴드의 "범 내려온다"가 대중적으로 알려진 사례입니다.', how: '전통 선율을 샘플링해 학생이 직접 편곡하는 창작 키트나 챌린지 콘텐츠를 만듭니다. 원곡 저작권 확인이 필요합니다.', impact: '전통의 현대적 재해석 경험과 창작 역량, 대중과의 접점을 넓힐 수 있습니다.' }
    ];

    // [주제 4] 국악·서양 이론 심화 탐구 10선
    const FULL_EAST_WEST_DATA = [
      { id: 'ew1', title: '1. 삼분손익법과 피타고라스 조율은 같은 음을 만들까?', concept: '피타고라스 음계 vs 삼분손익법(12율 산출), 등비수열과 피타고라스 콤마', comparison: '피타고라스는 완전5도를 계속 쌓는 방식이고, 삼분손익법은 율관의 길이를 줄였다 늘렸다 번갈아 하는 방식이다. 옥타브 안으로 환원했을 때의 오차(콤마)를 대조한다.', activity: '스프레드시트에서 두 방법으로 12음의 진동수 비를 계산하고 오름차순 정렬해 열을 비교한다. 센트로 바꿔 12평균율과의 차이를 그래프로 그린다.' },
      { id: 'ew2', title: '2. 불안정하게 들리는 음정과 국악의 꺾는 소리는 어떻게 다를까?', concept: '협화음/불협화음, 증4도(삼전음) vs 시김새(떠는 음·꺾는 음·미는 음), 토리', comparison: '서양은 두 음이 동시에 울릴 때의 수직적 화음 관계를 따지고, 국악은 단선율에서 한 음이 움직이는 수평적 시김새 모양을 표현으로 쓴다.', activity: '키보드로 증4도 화음을 들려주고 긴장감 점수를 받는다. 이어서 민요 한 소절을 시김새 있는 버전과 없는 버전으로 들려주고 애절함 점수 평균을 비교한다.' },
      { id: 'ew3', title: '3. 조를 바꾸는 것과 선법을 바꾸는 것 중 분위기를 더 크게 바꾸는 것은?', concept: '조표, 으뜸음, 조옮김(간격 유지) vs 우조와 계면조(선법 간격 변화)', comparison: '서양의 조옮김은 높이만 옮겨 구성음 간격을 유지하지만, 장조↔단조나 우조↔계면조는 음 사이의 간격 구조 자체가 변해 분위기 변화가 크다.', activity: '선율의 조옮김 버전과 장조/단조 버전을 녹음하고, 국악 우조/계면조 음원 구간을 들려준 뒤 20명 이상의 점수를 받아 변화량을 비교한다.' },
      { id: 'ew4', title: '4. 정간보와 오선보 중 박자를 더 정확하게 읽게 하는 악보는?', concept: '오선보(음높이 세로, 박자 모양) vs 정간보(박자를 칸의 물리적 면적으로 표시)', comparison: '오선보는 음높이의 오르내림이 한눈에 보이고, 정간보는 시간의 길이가 우물 정(井) 자 칸으로 직관적으로 보인다.', activity: '4마디 선율을 정간보와 오선보로 각각 그리고 참가자 20명에게 읽게 한 뒤 녹음 파형에서 목표 길이와의 박자 정확도 및 음높이 오차를 비교한다.' },
      { id: 'ew5', title: '5. 『악학궤범』과 서양 음악 용어 사전은 무엇을 어떻게 담았을까?', concept: '서양 음악 용어 사전(정의 중심) vs 악학궤범(도설, 악기·의례·복식 종합 기록)', comparison: '서양의 이론서는 용어를 정의한 텍스트 중심인 반면, 『악학궤범』은 악기 치수와 무용, 의례 복식까지 그림(도설)과 함께 기록한 시각적 종합서이다.', activity: '두 책의 목차와 도설 항목 수를 분류표에 넣고 개수와 비율을 계산해 막대그래프로 비교한다.' },
      { id: 'ew6', title: '6. 악기를 재료로 나눌 때와 소리 내는 방식으로 나눌 때, 어느 쪽이 소리의 특성을 더 잘 설명할까?', concept: '오케스트라 악기군(현·목관·금관·타악, 진동 방식) vs 팔음(금·석·사·죽·포·토·혁·목, 재료 기준)', comparison: '서양식은 어떻게 소리가 나는가(줄, 공기, 막 등)를 중심으로 나누고, 국악의 팔음은 무엇으로 만들었는가를 중심으로 나눈다.', activity: '교내 악기 8~10종의 소리를 3회 녹음해 소리 여운 길이와 배음 봉우리 수를 읽고, 두 분류 방식으로 묶어 집단별 표준편차를 비교한다.' },
      { id: 'ew7', title: '7. 서양의 4박 지휘와 국악 장단 치기는 손의 움직임이 어떻게 다를까?', concept: '서양 지휘의 타점과 기하학 도형 vs 국악 장단(구음, 호흡, 무릎 치기)', comparison: '지휘는 박마다 허공에 기하학적 도형을 그려 타점을 보여주고, 장단은 구음과 들숨·날숨의 몸 호흡으로 박을 이어간다.', activity: '가속도계 스마트폰 앱을 손에 쥐고 4박 지휘와 굿거리장단 동작을 30초씩 측정해 피크 간격의 평균과 표준편차를 비교한다.' },
      { id: 'ew8', title: '8. 소리 나는 곳을 위아래·앞뒤로 나누면 소리가 더 입체적으로 들릴까?', concept: '오케스트라 부채꼴 단일 무대 vs 종묘제례악 등가(월대 위)·헌가(아래 마당) 분리 배치', comparison: '서양 오케스트라는 한 무대에서 객석 쪽으로 소리를 투사하지만, 종묘제례악은 상하층 공간으로 분리되어 입체적으로 교차 연주된다.', activity: '스피커 두 대로 서로 다른 악기를 한곳에 모았을 때와 앞뒤·위아래로 분리했을 때 청취자 10명의 소리 위치 판별 정답률을 비교한다.' },
      { id: 'ew9', title: '9. 마당에서 둘러앉아 하는 공연과 무대 정면 공연은 관객 참여가 어떻게 다를까?', concept: '액자형(프로시니엄) 무대 정면 감상 vs 마당 풍물·사물놀이의 열린 원형 배치', comparison: '서양식 무대는 객석과 무대가 분리되어 정적인 감상을 유도하는 반면, 마당식 배치는 연주자와 관객이 섞여 추임새와 참여를 촉진한다.', activity: '같은 타악 곡을 마당식과 무대 정면으로 공연하고 3분 동안 관객의 박수·추임새 횟수와 몰입도 점수를 비교한다.' },
      { id: 'ew10', title: '10. 왈츠 선율은 어떻게 슬픈 노래로 바뀌었을까?', concept: '서양 3박자 춤곡 왈츠(도나우강의 잔물결) vs 한국 근대 가요 사의 찬미의 애환과 음 끌기', comparison: '서양의 경쾌한 왈츠 춤곡에 우리말 가사를 붙이며 템포를 늦추고 음을 길게 끌어 비장한 탄식의 노래로 변용했다.', activity: '두 음원에서 같은 선율 구간의 BPM과 소요 시간을 재고 청취자 20명에게 슬픔 정도 점수를 받아 비교한다.' }
    ];

    function App() {
      const [mainTab, setMainTab] = useState('inquiry');
      const [currentUser, setCurrentUser] = useState(function() {
        try {
          const savedUser = sessionStorage.getItem('music_current_user');
          return savedUser ? JSON.parse(savedUser) : null;
        } catch(err) { return null; }
      });

      const [studentIdInput, setStudentIdInput] = useState('');
      const [studentPwInput, setStudentPwInput] = useState('');
      const [studentNameInput, setStudentNameInput] = useState('');
      const [isRegisterMode, setIsRegisterMode] = useState(false);

      const [showTeacherModal, setShowTeacherModal] = useState(false);
      const [teacherIdInput, setTeacherIdInput] = useState('');
      const [teacherPwInput, setTeacherPwInput] = useState('');
      const [teacherAuth, setTeacherAuth] = useState(function() {
        try {
          const s = localStorage.getItem('music_teacher_auth');
          return s ? JSON.parse(s) : { id: 'admin', pw: '123456' };
        } catch(err) { return { id: 'admin', pw: '123456' }; }
      });

      const [teacherSubTab, setTeacherSubTab] = useState('submissions');

      // 로컬 스토리지 연동 상태
      const [inquiryDataState, setInquiryDataState] = useState(function() {
        try {
          const s = localStorage.getItem('music_custom_inquiry_data');
          return s ? JSON.parse(s) : FULL_INQUIRY_DATA;
        } catch(err) { return FULL_INQUIRY_DATA; }
      });

      const [productDataState, setProductDataState] = useState(function() {
        try {
          const s = localStorage.getItem('music_custom_product_data');
          return s ? JSON.parse(s) : FULL_PRODUCT_DATA;
        } catch(err) { return FULL_PRODUCT_DATA; }
      });

      const [eastWestDataState, setEastWestDataState] = useState(function() {
        try {
          const s = localStorage.getItem('music_custom_eastwest_data');
          return s ? JSON.parse(s) : FULL_EAST_WEST_DATA;
        } catch(err) { return FULL_EAST_WEST_DATA; }
      });

      const [allSubmissions, setAllSubmissions] = useState(function() {
        try {
          const s = localStorage.getItem('music_assessment_submissions');
          return s ? JSON.parse(s) : {};
        } catch(err) { return {}; }
      });

      const [activeItemEditModal, setActiveItemEditModal] = useState(false);
      const [editingItemCategory, setEditingItemCategory] = useState('');
      const [editingItemForm, setEditingItemForm] = useState(null);

      const [newTeacherId, setNewTeacherId] = useState('');
      const [newTeacherPw, setNewTeacherPw] = useState('');
      const [selectedSubject, setSelectedSubject] = useState('all');
      const [toastMessage, setToastMessage] = useState('');

      const updateCurrentUserSession = function(user) {
        setCurrentUser(user);
        if (user) {
          sessionStorage.setItem('music_current_user', JSON.stringify(user));
        } else {
          sessionStorage.removeItem('music_current_user');
        }
      };

      const [activeReportModal, setActiveReportModal] = useState(false);
      const [reportForm, setReportForm] = useState({
        slot: 'report1',
        topicCategory: 'inquiry',
        topicTitle: '',
        coreConcept: '',
        hypothesis: '',
        variables: '',
        procedure: '',
        conclusion: '',
        brandName: '',
        productTrait: '',
        productHow: '',
        productImpact: '',
        productNotice: '',
        // 주제 3: 1920s ~ 2020s 11개 구간
        popKorean: Array(11).fill({ song: '', history: '' }),
        popGlobal: Array(11).fill({ song: '', history: '' }),
        popFuture: ['', '', ''],
        // 주제 4: 5단계
        ewSummaryWestern: '',
        ewSummaryGugak: '',
        ewHypothesis: '',
        ewVariables: '',
        ewProcedure: '',
        ewComparison: '',
        ewAiLog: { prompt: '', criticalReview: '', screenshot: null }
      });

      // 회색 반투명 플레이스홀더 상태
      const [reportPlaceholders, setReportPlaceholders] = useState({});

      const showToast = function(msg) {
        setToastMessage(msg);
        setTimeout(function() { setToastMessage(''); }, 2500);
      };

      const getStudentAccounts = function() {
        try {
          const s = localStorage.getItem('music_student_accounts');
          return s ? JSON.parse(s) : {};
        } catch(err) { return {}; }
      };

      const handleStudentRegister = function(ev) {
        ev.preventDefault();
        if (!/^\d{4}$/.test(studentIdInput)) { showToast('학번은 4자리 숫자여야 합니다.'); return; }
        if (!studentNameInput.trim()) { showToast('성명을 입력해 주세요.'); return; }
        if (!/^\d{4}$/.test(studentPwInput)) { showToast('비밀번호는 4자리 숫자여야 합니다.'); return; }

        const accs = getStudentAccounts();
        if (accs[studentIdInput]) { showToast('이미 등록된 학번입니다.'); return; }

        accs[studentIdInput] = { id: studentIdInput, name: studentNameInput.trim(), pw: studentPwInput };
        localStorage.setItem('music_student_accounts', JSON.stringify(accs));

        if (!allSubmissions[studentIdInput]) {
          const up = Object.assign({}, allSubmissions, {
            [studentIdInput]: { studentId: studentIdInput, studentName: studentNameInput.trim(), reports: {} }
          });
          setAllSubmissions(up);
          localStorage.setItem('music_assessment_submissions', JSON.stringify(up));
        }

        const newUser = { role: 'student', id: studentIdInput, name: studentNameInput.trim() };
        updateCurrentUserSession(newUser);
        setIsRegisterMode(false);
        showToast(studentNameInput + ' 님, 등록 및 로그인 완료! 🎉');
      };

      const handleStudentLogin = function(ev) {
        ev.preventDefault();

      const downloadCSV = function() {
        const rows = [['학번', '성명', '과제1 주제', '과제1 점수(30)', '과제2 주제', '과제2 점수(30)', '총점(60)', '세특 메모']];
        Object.values(allSubmissions).forEach(function(s) {
          const r1 = s.reports && s.reports.report1;
          const r2 = s.reports && s.reports.report2;
          const r1Score = s.grading ? (Number(s.grading.r1_content || 0) + Number(s.grading.r1_analysis || 0)) : '미채점';
          const r2Score = s.grading ? (Number(s.grading.r2_content || 0) + Number(s.grading.r2_analysis || 0)) : '미채점';
          const totalScore = s.grading && s.grading.totalScore !== undefined ? s.grading.totalScore : '미채점';

          rows.push([
            s.studentId,
            s.studentName,
            r1 ? ('"' + r1.topicTitle.replace(/"/g, '""') + '"') : '미선택',
            r1Score,
            r2 ? ('"' + r2.topicTitle.replace(/"/g, '""') + '"') : '미선택',
            r2Score,
            totalScore,
            '"' + ((s.grading && s.grading.teacherFeedback) || '').replace(/"/g, '""') + '"'
          ]);
        });
        const blob = new Blob(['\uFEFF' + rows.map(function(r) { return r.join(','); }).join('\n')], { type: 'text/csv;charset=utf-8;' });

        const a = document.createElement('a');
        a.href = url;
        a.download = '송악고_음악수행평가_' + new Date().toISOString().slice(0, 10) + '.csv';
