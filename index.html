      { id: 'p3', name: '비트 메이커 쇠(SOE) – 허공에서 연주하는 사물놀이 모션 스마트 장갑', musicTrait: '꽹과리, 징, 장구, 북의 4가지 타악기가 만들어내는 폭발적인 악센트', howToDevelop: '자이로 센서 장갑을 끼고 허공을 타격하면 블루투스로 사물놀이 소리 출력', impact: '소음 걱정 없이 교실과 원룸에서 사물놀이 합주 가능' },
      { id: 'p4', name: '포 시즌스 모닝 – 비발디 사계 기반 기상예보 맞춤 클래식 알람 앱', musicTrait: '봄의 새소리, 여름의 천둥, 겨울의 얼음판을 묘사한 표제음악', howToDevelop: '실시간 날씨 API와 연동해 비가 오면 폭풍우 악장, 맑으면 봄 1악장을 해설과 함께 재생', impact: '클래식 감상을 일상 루틴과 연결' }

    const POP_HISTORY_DATA = [
      { era: '1970년대', media: 'LP판, 통기타', genre: '포크, 록', songs: '송창식(왜 불러), 김민기(아침이슬)', summary: '청년들의 자유와 낭만을 대변한 포크 음악과 그룹사운드 태동기' },

      { era: '1990년대', media: 'CD, 가요 순위제', genre: '댄스 팝, 랩, 1세대 아이돌', songs: '서태지와 아이들(난 알아요), H.O.T.(전사의 후예)', summary: '랩/댄스의 주류화와 기획사형 아이돌의 폭발적 탄생' },

      { era: '2020년대', media: '숏폼(틱톡, 릴스)', genre: '이지리스닝, Y2K 뉴트로', songs: '뉴진스(Ditto), IVE(Love Dive)', summary: '2분 미만 초단축 음원과 편안한 멜로디의 대세화' }

    const EAST_WEST_DATA = [
      { id: 'ew1', title: '조율학 & 수학', question: '삼분손익법(2/3, 4/3) vs 피타고라스 음계(2/3, 2/1): 동서양 최초의 조율 알고리즘 일치성 증명', concept: '황종~임종(완전5도), 삼분손익법, 피타고라스 5도 누적', activity: '계산기로 12율명과 피타고라스 진동수 도출 및 콤마(오차) 비교' },
      { id: 'ew2', title: '기보학 & 인지과학', question: '세종의 정간보(우물 정 井) vs 서양의 오선보(5줄 4칸): 시간과 음높이 시각화의 공간적 사고 비교', concept: '정간보(박자 시간 공간화) vs 오선보(음높이 시각화)', activity: '동일한 동요를 정간보와 오선보로 기보 후 초견 연주 정확도 측정' },
      { id: 'ew3', title: '지휘법 & 신체운동학', question: '서양의 4박자 기하학 지휘 도형 vs 국악의 호흡 장단(합·쿵·덕·기덕) 모션 센서 가속도 비교', concept: '외향적 비트 분할 vs 단전호흡 들숨·날숨 장단', activity: '스마트폰 가속도계 앱으로 지휘 도형과 장단 칠 때의 3축 파형 분석' }
    ];

    function App() {
      const [mainTab, setMainTab] = useState('inquiry');
      const [currentUser, setCurrentUser] = useState(null);
      const [studentIdInput, setStudentIdInput] = useState('');
      const [studentPwInput, setStudentPwInput] = useState('');
      const [studentNameInput, setStudentNameInput] = useState('');
      const [isRegisterMode, setIsRegisterMode] = useState(false);

      const [showTeacherModal, setShowTeacherModal] = useState(false);
      const [teacherIdInput, setTeacherIdInput] = useState('');
      const [teacherPwInput, setTeacherPwInput] = useState('');
      const [teacherAuth, setTeacherAuth] = useState(() => {
        try {
          const s = localStorage.getItem('music_teacher_auth');
          return s ? JSON.parse(s) : { id: 'admin', pw: '123456' };
        } catch { return { id: 'admin', pw: '123456' }; }
      });

      const [allSubmissions, setAllSubmissions] = useState(() => {
        try {
          const s = localStorage.getItem('music_assessment_submissions');
          return s ? JSON.parse(s) : {};
        } catch { return {}; }
      });

      const [activeReportModal, setActiveReportModal] = useState(false);
      const [reportForm, setReportForm] = useState({
        slot: 'report1',
        topicTitle: '',
        coreConcept: '',
        mainContent: '',
        activityOrPlan: '',
        aiLog: { prompt: '', criticalReview: '' }
      });

      const [selectedSubject, setSelectedSubject] = useState('all');
      const [toastMessage, setToastMessage] = useState('');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 2500);
      };

      const getStudentAccounts = () => {
        try {
          const s = localStorage.getItem('music_student_accounts');
          return s ? JSON.parse(s) : {};
        } catch { return {}; }
      };

      const handleStudentRegister = (ev) => {
        ev.preventDefault();
        if (!/^\d{4}$/.test(studentIdInput)) { showToast('학번은 4자리 숫자여야 합니다.'); return; }
        if (!studentNameInput.trim()) { showToast('성명을 입력해 주세요.'); return; }
        if (!/^\d{4}$/.test(studentPwInput)) { showToast('비밀번호는 4자리 숫자여야 합니다.'); return; }

        const accs = getStudentAccounts();
        if (accs[studentIdInput]) { showToast('이미 등록된 학번입니다.'); return; }

        accs[studentIdInput] = { id: studentIdInput, name: studentNameInput.trim(), pw: studentPwInput };
        localStorage.setItem('music_student_accounts', JSON.stringify(accs));

        if (!allSubmissions[studentIdInput]) {
          const up = { ...allSubmissions, [studentIdInput]: { studentId: studentIdInput, studentName: studentNameInput.trim(), reports: {} } };
          setAllSubmissions(up);
          localStorage.setItem('music_assessment_submissions', JSON.stringify(up));
        }

        setCurrentUser({ role: 'student', id: studentIdInput, name: studentNameInput.trim() });
        setIsRegisterMode(false);
        showToast(`${studentNameInput} 님, 등록 및 로그인 완료! 🎉`);
      };

      const handleStudentLogin = (ev) => {
        ev.preventDefault();
        const accs = getStudentAccounts();
        const a = accs[studentIdInput];
        if (!a) { showToast('등록되지 않은 학번입니다. [최초 등록하기]를 눌러주세요.'); return; }
        if (a.pw !== studentPwInput) { showToast('비밀번호가 일치하지 않습니다.'); return; }
        setCurrentUser({ role: 'student', id: a.id, name: a.name });
        showToast(`${a.name} 님, 환영합니다!`);
      };

      const handleTeacherLogin = (ev) => {
        ev.preventDefault();
        if (teacherIdInput === teacherAuth.id && teacherPwInput === teacherAuth.pw) {
          setCurrentUser({ role: 'teacher', id: teacherAuth.id, name: '음악과 교사' });
          setShowTeacherModal(false);
          setTeacherIdInput('');
          setTeacherPwInput('');
          setMainTab('teacher_dash');
          showToast('교사 관리자 모드로 접속했습니다. 🛡️');
        } else {
          showToast('아이디 또는 6자리 비밀번호가 일치하지 않습니다.');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setMainTab('inquiry');
        showToast('로그아웃되었습니다.');
      };

      const openReportModal = (item, defaultSlot = null) => {
        if (!currentUser || currentUser.role !== 'student') {
          showToast('학생 로그인 후 작성할 수 있습니다.');
          return;
        }
        const sData = allSubmissions[currentUser.id] || { reports: {} };
        const slot = defaultSlot || (!sData.reports?.report1 ? 'report1' : 'report2');
        const ex = sData.reports?.[slot];

        setReportForm({
          slot,
          topicTitle: ex?.topicTitle || item?.question || item?.name || item?.title || '',
          coreConcept: ex?.coreConcept || item?.concept || item?.musicTrait || '',
          mainContent: ex?.mainContent || item?.howToDevelop || item?.summary || '',
          activityOrPlan: ex?.activityOrPlan || item?.activity || item?.impact || '',
          aiLog: ex?.aiLog || { prompt: '', criticalReview: '' }
        });
        setActiveReportModal(true);
      };

      const saveReport = (isSubmit) => {
        const sData = allSubmissions[currentUser.id] || { studentId: currentUser.id, studentName: currentUser.name, reports: {} };
        const now = new Date().toLocaleString('ko-KR');
        const up = {
          ...allSubmissions,
          [currentUser.id]: {
            ...sData,
            reports: {
              ...sData.reports,
              [reportForm.slot]: { ...reportForm, isSubmitted: isSubmit, updatedAt: now }
            }
          }
        };
        setAllSubmissions(up);

              ),
              e('div', { className: 'flex gap-2' },
                e('button', { onClick: downloadCSV, className: 'px-3.5 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs' }, '엑셀(CSV) 다운로드'),
                e('button', { onClick: resetAllData, className: 'px-3.5 py-2 rounded-xl bg-rose-600 text-white font-bold text-xs' }, '학기 데이터 리셋')
              )
            ),
            e('div', { className: 'bg-white rounded-3xl border border-slate-200 p-6 shadow-sm overflow-x-auto' },
              e('table', { className: 'w-full text-left text-xs' },
                e('thead', null,
                  e('tr', { className: 'border-b border-slate-200 bg-slate-50' },
                    e('th', { className: 'py-2 px-3' }, '학번'),
                    e('th', { className: 'px-3' }, '이름'),
                    e('th', { className: 'px-3' }, '과제 1 주제'),
                    e('th', { className: 'px-3' }, '과제 2 주제'),
                    e('th', { className: 'px-3' }, '총점(60)'),
                    e('th', { className: 'px-3 text-center' }, '상세/채점')
                  )
                ),
                e('tbody', { className: 'divide-y divide-slate-100' },
                  Object.values(allSubmissions).map(s => e('tr', { key: s.studentId },
                    e('td', { className: 'py-3 px-3 font-mono font-bold' }, s.studentId),
                    e('td', { className: 'px-3' }, s.studentName),
                    e('td', { className: 'px-3' }, s.reports?.report1?.topicTitle || '미선택'),
                    e('td', { className: 'px-3' }, s.reports?.report2?.topicTitle || '미선택'),
                    e('td', { className: 'px-3 font-bold text-indigo-600' }, s.grading?.totalScore !== undefined ? `${s.grading.totalScore}점` : '미채점'),
                    e('td', { className: 'px-3 text-center' },
                      e('button', { onClick: () => {
                        const sc1 = prompt(`${s.studentName} 학생 과제 1 점수 (15점 만점, 15/10/5 중 입력):`, '15');
                        const sc2 = prompt(`${s.studentName} 학생 과제 2 점수 (15점 만점, 15/10/5 중 입력):`, '15');
                        const fb = prompt('세특 메모:', '');
                        if (sc1 && sc2) {
                          const total = Number(sc1) * 2 + Number(sc2) * 2;
                          const up = { ...allSubmissions, [s.studentId]: { ...s, grading: { totalScore: total, teacherFeedback: fb || '' } } };
                          setAllSubmissions(up);
                          localStorage.setItem('music_assessment_submissions', JSON.stringify(up));
                          showToast('채점이 저장되었습니다.');
                        }
                      }, className: 'px-2.5 py-1 rounded bg-slate-900 text-white font-bold text-2xs' }, '채점하기')
                    )
                  ))
                )
              )
            )
          )
        ),

        // 교사 로그인 모달
        showTeacherModal && e('div', { className: 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60' },
          e('div', { className: 'bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl' },
            e('div', { className: 'flex justify-between items-center' },
              e('h3', { className: 'text-sm font-black' }, '교사 관리자 모드 접속'),
              e('button', { onClick: () => setShowTeacherModal(false) }, e('i', { className: 'fa-solid fa-xmark' }))
            ),
            e('form', { onSubmit: handleTeacherLogin, className: 'space-y-3' },
              e('input', { type: 'text', placeholder: '교사 아이디', value: teacherIdInput, onChange: (ev) => setTeacherIdInput(ev.target.value), className: 'w-full px-3 py-2 text-xs border rounded-xl', required: true }),
              e('input', { type: 'password', maxLength: 6, placeholder: '비밀번호 6자리', value: teacherPwInput, onChange: (ev) => setTeacherPwInput(ev.target.value), className: 'w-full px-3 py-2 text-xs border rounded-xl', required: true }),
              e('button', { type: 'submit', className: 'w-full py-2.5 rounded-xl bg-purple-600 text-white font-bold text-xs' }, '관리자 로그인')
            )
          )
        ),

        // 보고서 작성 모달
        activeReportModal && e('div', { className: 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 overflow-y-auto' },
          e('div', { className: 'bg-white rounded-3xl p-6 max-w-2xl w-full space-y-4 shadow-2xl my-8' },
            e('div', { className: 'flex justify-between items-center pb-2 border-b' },
              e('h3', { className: 'text-base font-black' }, `${reportForm.slot === 'report1' ? '과제 1번' : '과제 2번'} 탐구 보고서 작성`),
              e('button', { onClick: () => setActiveReportModal(false) }, e('i', { className: 'fa-solid fa-xmark text-lg' }))
            ),
            e('div', { className: 'space-y-3 text-xs' },
              e('input', { type: 'text', placeholder: '탐구 주제', value: reportForm.topicTitle, onChange: (ev) => setReportForm({ ...reportForm, topicTitle: ev.target.value }), className: 'w-full p-2.5 border rounded-xl font-bold' }),
              e('input', { type: 'text', placeholder: '핵심 개념', value: reportForm.coreConcept, onChange: (ev) => setReportForm({ ...reportForm, coreConcept: ev.target.value }), className: 'w-full p-2.5 border rounded-xl' }),
              e('textarea', { rows: 3, placeholder: '1. 문헌 및 이론 탐구 내용', value: reportForm.mainContent, onChange: (ev) => setReportForm({ ...reportForm, mainContent: ev.target.value }), className: 'w-full p-2.5 border rounded-xl' }),
              e('textarea', { rows: 3, placeholder: '2. 실험·활동 절차 및 결과', value: reportForm.activityOrPlan, onChange: (ev) => setReportForm({ ...reportForm, activityOrPlan: ev.target.value }), className: 'w-full p-2.5 border rounded-xl' }),
              e('div', { className: 'p-3 bg-purple-50 rounded-xl space-y-2' },
                e('p', { className: 'font-bold text-purple-900' }, 'AI 활용 내역 기록'),
                e('input', { type: 'text', placeholder: 'AI에게 입력한 질문(프롬프트)', value: reportForm.aiLog.prompt, onChange: (ev) => setReportForm({ ...reportForm, aiLog: { ...reportForm.aiLog, prompt: ev.target.value } }), className: 'w-full p-2 border rounded-lg bg-white' }),
                e('textarea', { rows: 2, placeholder: '학생의 비판적 검증 및 보완점', value: reportForm.aiLog.criticalReview, onChange: (ev) => setReportForm({ ...reportForm, aiLog: { ...reportForm.aiLog, criticalReview: ev.target.value } }), className: 'w-full p-2 border rounded-lg bg-white' })
              )
            ),
            e('div', { className: 'flex justify-end gap-2 pt-2' },
              e('button', { onClick: () => saveReport(false), className: 'px-4 py-2 border rounded-xl text-xs font-bold' }, '임시 저장'),
              e('button', { onClick: () => saveReport(true), className: 'px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold' }, '최종 제출')
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
