    // 서버가 복구되면 false로 바꿔 다시 배포하세요. 기기에 쌓인 보고서는 학생이 다음에 접속할 때 자동으로 전달됩니다.
    // =========================================================
    const OFFLINE_MODE = true;

    // --- Supabase 클라우드 DB 클라이언트 초기화 ---
    const SUPABASE_URL = 'https://inppmcoscwftseeaxvav.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_dHVHe4gXEOYNScqMwtussQ_SzXv6-no';
    let supabaseClient = null;
    try {
      if (!OFFLINE_MODE && window.supabase) {
        // 이 포털은 Supabase 로그인 기능을 쓰지 않으므로 세션 저장·자동 갱신·브라우저 잠금을 모두 끔
        // (기본값으로 켜 두면 세션 확인 단계에서 요청이 나가지 않고 멈추는 문제가 있었음)
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            persistSession: false,
            autoRefreshToken: false,
            detectSessionInUrl: false,
            storageKey: 'mu26-portal-no-auth',
            lock: async function(name, acquireTimeout, fn) { return await fn(); }
          }
        });
      }
    } catch (err) {
      console.error('Supabase Init Error:', err);
    }

    // 클라우드 응답이 없을 때 무한정 기다리지 않도록 시간 제한 (기본 30초: 서버가 느릴 때도 기다려 줌)
    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise(function(_, reject) {
          setTimeout(function() { reject(new Error('TIMEOUT')); }, ms || 30000);
        })
      ]);
    }

    // 기기 저장 공간이 가득 차도 화면이 멈추지 않도록 (성공하면 true)
    function safeSetLocal(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (err) {
        console.error('Local Storage Error:', err);
        return false;
      }
    }

    function loadLocalSubmissions() {
      try {
        const s = localStorage.getItem('music_assessment_submissions');
        return s ? JSON.parse(s) : {};
      } catch (err) { return {}; }
    }

    // 아직 클라우드로 전달하지 못한 학생 학번 목록 (오프라인 모드에서 저장했거나 전송에 실패한 경우)
    function getPendingSync() {
      try {
        const s = localStorage.getItem('music_pending_sync');
        return s ? JSON.parse(s) : [];
      } catch (err) { return []; }
    }
    function addPendingSync(id) {
      const list = getPendingSync();
      if (list.indexOf(String(id)) === -1) list.push(String(id));
      safeSetLocal('music_pending_sync', JSON.stringify(list));
    }
    function removePendingSync(id) {
      safeSetLocal('music_pending_sync', JSON.stringify(getPendingSync().filter(function(x) { return x !== String(id); })));
    }

    const SUBJECTS = [

    // =========================================================

    // =========================================================
    const FULL_INQUIRY_DATA = [
      // 1. 국어 (10선)
      { id: 'ko_1', subjectId: 'korean', subjectName: '국어', question: '힙합 랩의 라임과 고전 시가의 운율은 무엇이 다를까?', concept: '운율, 음보, 각운(행 끝 소리 맞추기), 박자의 강박·약박', hypothesis: '고전 시가는 행마다 음보 수가 일정하고, 랩은 행 끝 모음이 같은 비율(라임)이 더 높을 것이다.', variables: '독립변인: 글의 종류(시조·가사 5편 대 랩 5곡) / 종속변인: 행 끝 모음 일치율, 행당 음보 수의 편차 / 통제변인: 분석 분량(시조 1수, 랩 16마디), 같은 방식의 음절 나누기', activity: '가사를 음절 단위로 적고 행 끝 음절의 모음을 표시해 이웃한 행과 같은 비율을 계산한다. 음보 수는 소리 내어 읽으며 끊어 읽는 곳에 표시해 센다.' },
      { id: 'ko_2', subjectId: 'korean', subjectName: '국어', question: '대중가요 가사는 왜 시보다 쉬운 단어를 많이 쓸까?', concept: '구어와 문어, 고유어·한자어·외래어, 반복(후렴)의 기능', hypothesis: '대중가요 가사는 현대시보다 고유어 비율과 반복 구절 비율이 높고 한 어절의 평균 글자 수가 짧을 것이다.', variables: '독립변인: 글 종류(현대시 10편 대 음원 차트 상위곡 10곡) / 종속변인: 고유어 비율, 반복 구절 비율, 어절당 평균 글자 수 / 통제변인: 분석 분량(각 100어절 규격화)', activity: '100어절씩 잘라 표준국어대사전에서 단어의 어종(고유어·한자어·외래어)을 확인해 분류표를 만들고, 같은 구절이 반복된 어절 수를 센다.' },
      { id: 'ko_3', subjectId: 'korean', subjectName: '국어', question: '슬픈 가사에 밝은 멜로디가 붙으면 정서가 어떻게 달라질까?', concept: '반어, 역설, 장조와 단조가 주는 분위기', hypothesis: '슬픈 내용의 가사가 밝은 장조 멜로디와 결합하면 단조와 결합할 때보다 가사와 곡의 분위기가 어긋난다는 평가가 높고 몰입도는 다르게 나타날 것이다.', variables: '독립변인: 같은 가사에 붙인 조성(장조 대 단조) / 종속변인: 몰입도 및 슬픔 정도(7점 척도) / 통제변인: 동일 가사, 템포, 반주 악기, 길이(30초), 청취 환경', activity: '4행 가사를 쓰고 키보드로 장조·단조 두 버전을 녹음해 설문 도구로 20명 이상에게 무작위 순서로 들려준 뒤 점수를 평가받는다.' },
      { id: 'ko_4', subjectId: 'korean', subjectName: '국어', question: '방언 가사는 노래의 친밀감을 높일까?', concept: '방언과 표준어, 말투가 주는 느낌, 사회언어학의 기초', hypothesis: '같은 내용의 노랫말이라도 방언으로 부르면 표준어보다 친근하다는 평가가 높을 것이다.', variables: '독립변인: 가사의 말씨(방언 대 표준어) / 종속변인: 친밀감 점수(7점 척도) / 통제변인: 같은 멜로디, 같은 가창자, 같은 반주, 같은 길이', activity: '4소절 가사를 두 말씨로 같은 사람이 불러 녹음하고, 청취자 20명 이상에게 순서를 섞어 들려준 뒤 친근함과 진정성 문항 점수를 받는다.' },

      { id: 'ko_6', subjectId: 'korean', subjectName: '국어', question: 'K-POP 가사의 외래어·영어 혼용은 어떻게 변해 왔을까?', concept: '차용어, 언어 혼용, 문장 성분(단어 차용인지 절 단위인지)', hypothesis: '시기가 지날수록 영어는 단어 몇 개를 끼우는 수준에서 한 문장(절) 전체를 영어로 쓰는 방식으로 늘어났을 것이다.', variables: '독립변인: 시기(1990년대 대 2000년대 대 2010년대 대 2020년대) / 종속변인: 영어 어절 비율, 영어가 쓰인 단위 비율 / 통제변인: 댄스 장르 한정, 시기당 곡 수 동일', activity: '시기별로 5~10곡을 정해 가사를 어절로 나누고 영어 어절과 영어 사용 단위(단어, 구, 문장)를 집계한다.' },
      { id: 'ko_7', subjectId: 'korean', subjectName: '국어', question: '자음의 종류에 따라 노랫말이 얼마나 잘 들릴까?', concept: '예사소리·된소리·거센소리, 소리가 잘 들리는 정도, 받아쓰기 정확도', hypothesis: '된소리와 거센소리가 많이 들어간 단어는 반주 소리 속에서도 예사소리 단어보다 받아쓰기 정확도가 높을 것이다.', variables: '독립변인: 단어의 첫소리 유형(예사소리 대 된소리 대 거센소리) / 종속변인: 받아쓰기 정확도 / 통제변인: 같은 낭독자, 같은 반주 음량, 단어 길이(2음절)', activity: '유형별 단어 10개씩을 반주 위에 같은 세기로 낭독해 녹음하고, 청취자 20명 이상이 받아쓴 결과를 채점해 비교한다.' },
      { id: 'ko_8', subjectId: 'korean', subjectName: '국어', question: '시조 3장의 호흡은 노래로 부를 때 어떻게 배분될까?', concept: '시조의 3장 6구 구조, 음보, 시조창의 개념', hypothesis: '시조의 초장·중장·종장은 글자 수가 비슷해도 시조창으로 부를 때 걸리는 시간이 장마다 달라 종장이 특히 길게 불릴 것이다.', variables: '독립변인: 장(초장 대 중장 대 종장) / 종속변인: 장별 소요 시간(초), 글자당 소요 시간 / 통제변인: 같은 연주자의 같은 작품, 같은 길이의 시조', activity: '시조창 음원 3~5곡을 구해 오디오 재생기의 시간 표시로 장별 소요 시간을 재고, 글자 수로 나눈 값을 비교한다.' },

      { id: 'ko_10', subjectId: 'korean', subjectName: '국어', question: '희곡의 갈등 구조와 소나타 형식은 닮았을까?', concept: '발단·전개·위기·절정·결말, 소나타 형식의 제시부·발전부·재현부', hypothesis: '소나타 형식에서 발전부가 차지하는 분량 비율은 희곡에서 갈등이 심화되는 전개부터 위기 구간의 분량 비율과 비슷할 것이다.', variables: '독립변인: 작품 종류(소나타 3곡 대 단막극 3편) / 종속변인: 각 부분이 전체에서 차지하는 분량 비율 / 통제변인: 완결된 작품만 선택', activity: '소나타는 악보나 음원 시간으로 세 부분의 분량을 재고, 희곡은 대본의 쪽수·줄 수로 단계별 분량을 센 뒤 비율을 막대그래프로 비교한다.' },

      // 2. 영어 (10선)
      { id: 'en_1', subjectId: 'english', subjectName: '영어', question: '팝송은 우리말 번안곡보다 한 마디에 더 많은 음절이 들어갈까?', concept: '음절, 강세와 약화(연음·축약), 박자와 음절의 대응', hypothesis: '같은 멜로디에서 영어 원곡은 한국어 번안곡보다 한 마디에 들어가는 음절 수가 더 많거나 축약·연음이 더 자주 나타날 것이다.', variables: '독립변인: 언어(영어 원곡 대 한국어 번안곡) / 종속변인: 마디당 음절 수, 축약·연음 표시 횟수 / 통제변인: 같은 곡의 같은 마디, 같은 템포', activity: '원곡과 번안곡 5쌍에서 8마디씩 골라 마디마다 음절 수를 세고, 영어 가사에서 연음·축약이 나타난 횟수를 표시해 평균을 비교한다.' },
      { id: 'en_2', subjectId: 'english', subjectName: '영어', question: '두운이 있는 후렴은 하루 뒤에도 더 잘 기억될까?', concept: '두운, 반복과 기억(귀벌레 현상), 회상 검사', hypothesis: '같은 첫소리가 반복되는 가사는 그렇지 않은 가사보다 24시간 뒤 회상 점수가 높을 것이다.', variables: '독립변인: 두운 사용 여부 / 종속변인: 24시간 뒤 빈칸 채우기 점수 / 통제변인: 같은 멜로디, 같은 길이(4행), 청취 3회, 같은 시간대 청취', activity: '직접 쓴 4행 영어 가사를 두운 버전과 비두운 버전으로 만들어 같은 멜로디로 부르고, 두 집단에게 들려준 다음 날 빈칸 채우기 점수를 비교한다.' },
      { id: 'en_3', subjectId: 'english', subjectName: '영어', question: '영어 원곡과 한국어 번안곡 중 어느 쪽이 한 마디에 더 많은 뜻을 담을까?', concept: '정보 밀도, 음절, 의미 단어(명사·동사·형용사)', hypothesis: '같은 마디 안에서 영어 원곡은 한국어 번안곡보다 의미 단어가 더 많이 들어갈 것이다.', variables: '독립변인: 언어(영어 원곡 대 한국어 번안곡 5쌍) / 종속변인: 마디당 의미 단어 수 / 통제변인: 같은 곡, 같은 마디 범위', activity: '번안곡이 알려진 노래를 골라 같은 8마디에서 의미 단어 수를 센 뒤 쌍별로 평균 차이를 계산한다.' },
      { id: 'en_4', subjectId: 'english', subjectName: '영어', question: '랩 가사의 축약·속어는 박자 안에서 음절을 얼마나 줄여 줄까?', concept: '축약형(gonna, wanna 등), 속어, 음절 수와 박자', hypothesis: '축약형을 사용한 행은 표준형으로 고쳤을 때보다 음절 수가 적어 같은 박자 안에서 여유가 생길 것이다.', variables: '독립변인: 표현 형식(축약형 대 표준형) / 종속변인: 같은 행의 음절 수, 한 박에 들어가는 음절 수 / 통제변인: 같은 행, 같은 곡', activity: '랩 가사 5곡에서 축약형이 포함된 행을 10개씩 뽑아 표준형으로 바꿔 쓴 뒤 두 형태의 음절 수를 비교 집계한다.' },
      { id: 'en_5', subjectId: 'english', subjectName: '영어', question: '영어↔한국어로 바뀌는 지점은 얼마나 자연스럽게 들릴까?', concept: '언어 전환, 연음, 말소리의 연결', hypothesis: '영어 단어가 모음으로 끝나 한국어 단어와 부드럽게 이어지는 전환이 자음으로 끝나는 전환보다 어색함 점수가 낮을 것이다.', variables: '독립변인: 전환 직전 영어 단어의 끝소리(모음 대 자음) / 종속변인: 어색함 점수(7점 척도) / 통제변인: 같은 곡, 같은 가수, 전환 구간 길이(약 5초)', activity: '아이돌 곡 5곡에서 전환 구간을 골라 끝소리 유형별로 분류하고, 청취자 20명에게 구간을 들려준 뒤 평가 점수를 받는다.' },
      { id: 'en_6', subjectId: 'english', subjectName: '영어', question: '노래가 빠를수록 축약형 단어가 더 많이 쓰일까?', concept: '축약형 단어, 분당 박 수(BPM), 상관관계', hypothesis: '곡의 템포가 빠를수록 100단어당 축약형 단어의 수가 많아질 것이다.', variables: '독립변인: 곡의 템포(BPM) / 종속변인: 100단어당 축약형 개수 / 통제변인: 같은 장르, 비슷한 연도의 곡', activity: '곡 20곡의 BPM을 탭 템포 방식으로 측정하고 가사에서 축약형 개수를 세어 산점도를 그리고 상관 정도를 분석한다.' },
      { id: 'en_7', subjectId: 'english', subjectName: '영어', question: '팝송에서 강박에 오는 음절은 정말 강세 음절일까?', concept: '단어 강세, 강박·약박, 음악적 악센트', hypothesis: '영어 가사에서 강박에 놓이는 음절은 약박에 놓이는 음절보다 사전상 강세 음절일 확률이 높을 것이다.', variables: '독립변인: 음절의 위치(강박 대 약박) / 종속변인: 강세 음절 비율 / 통제변인: 4/4박자의 곡, 같은 마디 수(곡당 8마디)', activity: '곡 5곡의 악보나 가사 영상에서 8마디씩 골라 강박 위치 음절의 강세를 영어 사전으로 확인해 표에 정리한다.' },
      { id: 'en_8', subjectId: 'english', subjectName: '영어', question: '영어 비중이 높은 K-POP 곡은 해외 차트에 더 오래 머물까?', concept: '문화 산업, 언어와 접근성, 차트 지표(진입 주 수)', hypothesis: '가사에서 영어 비중이 높은 곡이 한국어 중심 곡보다 해외 차트 진입 주 수가 길 것이다.', variables: '독립변인: 영어 가사 비중(높음 대 낮음) / 종속변인: 차트 진입 주 수 / 통제변인: 같은 아티스트 또는 비슷한 인지도의 곡 짝지어 비교', activity: '해외 차트에 진입한 곡 10~20곡을 골라 영어 어절 비율을 계산하고 공식 차트 기록의 진입 주 수와 비교한다.' },
      { id: 'en_9', subjectId: 'english', subjectName: '영어', question: '영국 가수와 미국 가수는 노래할 때 단어 끝 r을 다르게 발음할까?', concept: '영국식·미국식 발음 차이, 단어 끝 r 발음 여부', hypothesis: '영국 가수의 노래에서는 단어 끝 r을 발음하는 비율이 미국 가수보다 낮겠지만, 팝 창법에서는 차이가 작을 수도 있을 것이다.', variables: '독립변인: 가수의 출신(영국 대 미국) / 종속변인: 단어 끝 r을 발음한 비율 / 통제변인: 같은 장르, 비슷한 템포, 곡당 후렴 1회의 같은 분량', activity: '곡 5곡씩 정해 후렴에서 단어 끝 r이 있는 단어를 찾아 직접 듣고 r 소리가 들리는지 체크한 다음 비율을 계산한다.' },
      { id: 'en_10', subjectId: 'english', subjectName: '영어', question: '동음이의어 말장난은 가사의 재미를 높일까?', concept: '동음이의어, 중의적 표현, 언어유희', hypothesis: '말장난이 들어간 가사는 직설적인 가사보다 흥미도 점수가 높을 것이다.', variables: '독립변인: 가사 유형(말장난 대 직설) / 종속변인: 흥미도(7점 척도), 이해도 퀴즈 점수 / 통제변인: 같은 멜로디, 같은 길이, 청취자의 영어 실력 수준', activity: '영어 가사에서 말장난 사례를 찾아 구조를 정리하고, 직접 쓴 두 버전의 가사를 청취자 20명에게 들려준 뒤 흥미도와 이해도를 점수화한다.' },

      // 3. 수학 (10선)
      { id: 'ma_1', subjectId: 'math', subjectName: '수학', question: '피아노 12반음은 왜 등차수열이 아니라 등비수열일까?', concept: '등비수열, 거듭제곱근(약 1.0595), 지수함수, 진동수(Hz)', hypothesis: '인접한 반음의 진동수 비는 거의 일정하며, 건반 번호와 진동수의 관계는 지수함수에 가깝다.', variables: '독립변인: 건반 번호 / 종속변인: 측정한 진동수, 인접 음 진동수 비 / 통제변인: 같은 악기, 같은 앱, 기준음 A4=440Hz', activity: '디지털 건반 12음을 주파수 앱으로 3회씩 측정해 평균을 내고, 인접 음의 비를 계산한 뒤 지수 추세선과 결정계수를 확인한다.' },
      { id: 'ma_2', subjectId: 'math', subjectName: '수학', question: '12음을 한 번씩 모두 돌려면 음을 몇 반음씩 옮겨야 할까?', concept: '나머지 연산, 최대공약수, 서로소, 순환하는 규칙성', hypothesis: '한 음에서 k반음씩 반복해 올라갈 때 서로 다른 음의 개수는 12와 k의 최대공약수로 12를 나눈 값이다.', variables: '독립변인: 이동 간격 k(1~11반음) / 종속변인: 한 바퀴 돌 때까지 만나는 서로 다른 음의 수 / 통제변인: 시작 음(도), 12반음 체계', activity: '스프레드시트에서 시작+k×n을 12로 나눈 나머지를 계산해 처음 반복되는 순간까지의 음 개수를 센 뒤, 5도권 순서와 대조한다.' },
      { id: 'ma_3', subjectId: 'math', subjectName: '수학', question: '바흐 인벤션의 선율 변화는 좌표평면의 대칭이동으로 표현될까?', concept: '점의 평행이동·대칭이동, 좌표평면, 음악의 역행과 반전', hypothesis: '모티브를 거꾸로 연주한 역행은 시간축 방향의 대칭이동, 음높이를 뒤집은 반전은 음높이축 방향의 대칭이동으로 나타낼 수 있다.', variables: '독립변인: 변환의 종류(평행이동 대 역행 대 반전) / 종속변인: 변환 후 좌표와 실제 악보 음의 일치율 / 통제변인: 같은 모티브(한 마디 이내)', activity: '악보에서 모티브를 골라 가로축=박, 세로축=음높이로 점을 찍고, 변환 식을 적용한 좌표와 악보에서 찾은 해당 음을 비교한다.' },
      { id: 'ma_4', subjectId: 'math', subjectName: '수학', question: '클라이맥스는 정말 곡의 61.8% 지점에 올까?', concept: '비율, 황금비(약 0.618), 평균과 오차율', hypothesis: '곡의 클라이맥스 마디가 전체 마디에서 차지하는 위치 비율은 0.618 근처에 몰릴 것이다.', variables: '독립변인: 분석할 곡(5~10곡) / 종속변인: 클라이맥스 위치 비율, 0.618과의 차이 / 통제변인: 클라이맥스 사전 정의 고정, 같은 악장 형식', activity: '곡마다 전체 마디 수와 클라이맥스 마디를 세어 비율을 계산하고 평균과 0.618의 차이를 표와 그래프로 검증한다.' },
      { id: 'ma_5', subjectId: 'math', subjectName: '수학', question: '협화음일수록 합성파의 반복 주기가 짧을까?', concept: '삼각함수의 그래프와 주기, 진동수의 정수비(3:2, 5:4 등), 합성파', hypothesis: '두 음의 진동수 비가 간단한 정수비일수록 두 파동을 합친 파형이 반복되는 주기가 짧다.', variables: '독립변인: 음정(완전5도 3:2, 장3도 5:4, 증4도 7:5) / 종속변인: 합성파의 반복 주기 / 통제변인: 같은 기준 진동수, 같은 진폭', activity: '수학 그래프 프로그램에서 합성파 그래프를 그려 음정별로 파형이 처음 반복되는 시간을 측정하고 비교한다.' },
      { id: 'ma_6', subjectId: 'math', subjectName: '수학', question: '3:2 폴리리듬은 최소공배수로 설명할 수 있을까?', concept: '최소공배수, 분수의 덧셈, 폴리리듬', hypothesis: 'a:b 폴리리듬에서 두 박이 동시에 울리는 간격은 a와 b의 최소공배수에 해당하는 칸 수이며, 비가 복잡할수록 그 칸 수가 커진다.', variables: '독립변인: 폴리리듬의 비율(3:2, 4:3, 5:4) / 종속변인: 공통 그리드의 칸 수, 동시에 울리는 간격 / 통제변인: 한 주기의 길이', activity: '메트로놈 앱 두 개로 동시 연주하며 동시에 울린 순간을 녹음해 표시하고, 두 박의 시각을 적어 일치한 지점을 수학 표로 확인한다.' },
      { id: 'ma_7', subjectId: 'math', subjectName: '수학', question: '두 주사위의 합으로 고른 음악 마디는 골고루 나올까?', concept: '경우의 수, 확률, 두 주사위의 합의 분포', hypothesis: '두 주사위 합으로 마디를 고르면 합 7에 해당하는 마디가 가장 자주 선택되고, 합 2·12에 해당하는 마디는 거의 선택되지 않는다.', variables: '독립변인: 주사위 합(2~12) / 종속변인: 선택 횟수, 상대도수 / 통제변인: 같은 주사위 두 개, 던지는 방식 동일, 시행 100회', activity: '주사위 두 개를 100회 던져 합의 도수분포표와 막대그래프를 만들고 이론 확률과 비교한 뒤, 8마디 곡을 직접 조립해 본다.' },
      { id: 'ma_8', subjectId: 'math', subjectName: '수학', question: '취향 벡터가 비슷한 곡일수록 만족도가 높을까?', concept: '벡터의 성분과 내적, 코사인 유사도, 상관관계', hypothesis: '사용자의 선호 벡터와 곡의 특성 벡터의 코사인 유사도가 클수록 청취 후 만족도 점수가 높을 것이다.', variables: '독립변인: 코사인 유사도 / 종속변인: 청취 후 만족도(5점 척도) / 통제변인: 곡의 길이(1분), 청취 순서 무작위', activity: '곡의 특성을 2~3개 점수로 정하고, 학생의 선호 벡터와 곡 벡터의 코사인 값을 계산한 뒤 곡을 들려주고 만족도 산점도를 그린다.' },
      { id: 'ma_9', subjectId: 'math', subjectName: '수학', question: '박수 패턴을 한 칸씩 밀면 일치하는 박은 몇 개일까?', concept: '순환하는 패턴, 나머지 연산, 경우의 수 세기', hypothesis: '12박 패턴 하나를 한 칸씩 밀면 두 사람이 동시에 박수치는 박의 수는 칸마다 달라지고, 12칸을 밀면 원래 패턴으로 돌아온다.', variables: '독립변인: 밀어낸 칸 수(0~12) / 종속변인: 동시에 박수치는 박의 수 / 통제변인: 같은 12박 패턴, 같은 순환 방식', activity: '12박 패턴을 0과 1로 표시하고, 한 줄을 한 칸씩 밀어가며 같은 위치에 1이 겹치는 개수를 표로 세고 실제 박수로도 확인한다.' },
      { id: 'ma_10', subjectId: 'math', subjectName: '수학', question: '히트곡의 길이는 시대에 따라 짧아졌을까?', concept: '평균, 표준편차, 정규분포, 분포 비교', hypothesis: '2010년대 후반 이후 인기곡의 평균 길이는 그 이전 시기보다 짧을 것이다.', variables: '독립변인: 시기(2000년대 대 2020년대) / 종속변인: 곡 길이의 평균과 표준편차 / 통제변인: 같은 차트, 시기별 같은 곡 수(20~30곡)', activity: '공식 차트에서 시기별 상위 곡의 재생 시간을 모아 평균·표준편차를 구하고, 히스토그램을 그려 두 시기 평균의 차이를 비교한다.' },

      // 4. 사회 (10선)
      { id: 'so_1', subjectId: 'social', subjectName: '사회', question: '콘서트 티켓은 어떤 방식으로 나누면 가장 공정하다고 느껴질까?', concept: '수요와 공급, 가격 탄력성, 시장 실패, 공정성 인식, 배분 방식', hypothesis: '같은 수의 티켓을 나눌 때 추첨제는 선착순이나 경매제보다 공정하다는 인식이 높고, 경매제는 높은 가격에 거래되지만 불공정하다는 평가가 높을 것이다.', variables: '독립변인: 배분 방식(추첨 대 선착순 대 가상 포인트 경매) / 종속변인: 공정성 인식(7점 척도), 낙찰가 / 통제변인: 좌석 수, 참가 인원, 같은 가상 공연', activity: '학급에서 가상 공연 좌석을 세 가지 방식으로 나누는 모의 상황을 진행하고, 공정성 인식을 설문으로 평가받는다.' },
      { id: 'so_2', subjectId: 'social', subjectName: '사회', question: '배경음악의 빠르기에 따라 사람의 걷는 속도와 선택 시간이 달라질까?', concept: '소비 심리, 환경 요인(배경음악), 관찰 연구의 변인 통제', hypothesis: '빠른 템포 음악에서는 같은 거리를 걷는 시간이 짧고, 느린 템포 음악에서는 길어질 것이다.', variables: '독립변인: 배경음악 템포(느림 60BPM대 대 빠름 120BPM대) / 종속변인: 10m 걷는 시간, 선택 시간 / 통제변인: 같은 장소, 같은 음량, 순서 무작위', activity: '교내 복도에서 참가자가 이어폰으로 음악을 들으며 10m를 걷는 시간을 3회 측정해 평균을 비교한다.' },
      { id: 'so_3', subjectId: 'social', subjectName: '사회', question: '팬덤의 집중 스트리밍 참여는 소속감과 어떤 관련이 있을까?', concept: '집단행동, 팬덤 문화, 소속감, 설문 조사 방법', hypothesis: '팬덤 활동 기간이 길거나 참여 빈도가 높을수록 공동체 소속감 점수가 높을 것이다.', variables: '독립변인: 팬덤 활동 기간·참여 빈도 / 종속변인: 소속감 점수 / 통제변인: 같은 연령대(교내), 같은 설문지', activity: '익명 설문으로 참여 빈도와 소속감 문항을 묻고, 참여 빈도별 평균 점수를 비교 분석한다.' },
      { id: 'so_4', subjectId: 'social', subjectName: '사회', question: '음원 수익 정산 방식을 바꾸면 인디 음악가의 몫은 늘어날까?', concept: '플랫폼 경제, 비례배분 정산과 이용자별 정산, 분배의 공정성', hypothesis: '이용자별 정산 방식으로 계산하면 비례배분 방식보다 상위 아티스트의 몫이 줄고 소규모 아티스트의 몫이 늘어날 것이다.', variables: '독립변인: 정산 방식(비례배분 대 이용자별) / 종속변인: 아티스트별 정산액, 상위 1팀 점유율 / 통제변인: 같은 가상 이용자 수와 총 수익', activity: '가상 이용자 10명의 월 청취 횟수 표를 만들고 스프레드시트에서 두 방식으로 정산액을 계산해 비교한다.' },
      { id: 'so_5', subjectId: 'social', subjectName: '사회', question: '임대료가 오르면 지역의 공연·연습 공간은 어떻게 달라질까?', concept: '도시 변화, 상업 젠트리피케이션, 문화 공간', hypothesis: '임대료가 크게 오른 지역에서는 소규모 문화 공간의 수가 줄거나 다른 지역으로 이동했을 것이다.', variables: '독립변인: 시기(임대료 상승 전 대 후) / 종속변인: 공연장·연습실·소극장 수, 폐업 사례 / 통제변인: 같은 지역 범위, 같은 공공자료 출처', activity: '상권 공공자료에서 시기별 문화공간 수를 찾아 표로 정리하고, 지역 뉴스 기사 사례로 이동 현황을 대조한다.' },
      { id: 'so_6', subjectId: 'social', subjectName: '사회', question: '지역마다 민요의 선율은 어떻게 다를까?', concept: '지역별 민요 특징(경기·서도·남도·동부 토리), 음역, 선율의 도약', hypothesis: '지역별 대표 민요는 음역의 폭과 큰 도약의 빈도가 서로 다르게 나타날 것이다.', variables: '독립변인: 지역(4곳 이상) / 종속변인: 음역의 폭(반음 수), 3도 이상 도약 횟수 / 통제변인: 같은 길이(8마디)의 대표 민요, 같은 조표 환산', activity: '지역별 대표 민요 악보에서 가장 낮은 음과 높은 음의 차, 3도 이상 도약 횟수를 세어 지역별 특성을 정리한다.' },
      { id: 'so_7', subjectId: 'social', subjectName: '사회', question: '선거송은 후보 이름과 공약 기억에 도움이 될까?', concept: '정치 커뮤니케이션, 프레이밍, 기억과 설득, 선거 운동 규칙', hypothesis: '선거송을 들은 집단은 구호를 들은 집단보다 가상 후보의 이름과 기호 회상 점수가 높지만 정책 이해도는 차이가 작을 것이다.', variables: '독립변인: 홍보 방식(선거송 대 구호 낭독) / 종속변인: 이름·기호 회상 점수, 정책 이해도 점수 / 통제변인: 노출 시간(30초), 가상 후보와 가상 공약', activity: '두 집단에 서로 다른 방식으로 가상 후보를 소개하고, 다음 시간에 회상·이해도 퀴즈를 풀게 해 평균을 비교한다.' },
      { id: 'so_8', subjectId: 'social', subjectName: '사회', question: '거리 공연이 있는 골목은 사람들이 더 오래 머물까?', concept: '도시 경제, 외부 효과, 집객 효과, 관찰 조사', hypothesis: '공연이 있는 시간대의 골목은 공연이 없는 시간대보다 통행량과 머문 시간이 더 클 것이다.', variables: '독립변인: 공연 유무 / 종속변인: 5분당 통행 인원, 머문 사람 수 / 통제변인: 같은 장소, 같은 요일·시간대, 날씨', activity: '허락받은 장소에서 5분 단위로 통행자 수를 3회 측정하고, 상인 인터뷰를 병행하여 체류 경향을 관찰한다.' },
      { id: 'so_9', subjectId: 'social', subjectName: '사회', question: '인공지능이 만든 곡은 저작권을 인정받을 수 있을까?', concept: '저작권, 창작물 요건(인간의 사상·감정 표현), 지식재산권, 토론', hypothesis: '학생들은 AI가 만든 곡에 대해 완전한 저작권 인정에는 반대하지만 사람의 기여가 큰 경우에는 일부 보호에 찬성하는 비율이 더 높을 것이다.', variables: '독립변인: 제시된 상황(AI 전부 생성 대 사람이 많이 수정) / 종속변인: 보호 찬성률, 이유 유형 / 통제변인: 같은 설명 자료, 같은 설문 문항', activity: '저작권법 규정과 판례를 조사해 정리하고, 모의 토론 후 설문으로 찬반 비율과 이유를 분석한다.' },
      { id: 'so_10', subjectId: 'social', subjectName: '사회', question: '추모 음악은 사람들의 공감과 연대감에 어떤 영향을 줄까?', concept: '사회심리학, 애도 의례, 공동체 의식, 연구 윤리', hypothesis: '추모 음악을 듣고 난 뒤 공동체 연대감 점수가 중립 음악을 들은 뒤보다 높을 것이다.', variables: '독립변인: 들려준 음악(추모 음악 대 중립 음악) / 종속변인: 연대감 점수(5점 척도), 참여 의향 / 통제변인: 같은 길이(2분), 같은 환경, 자율 참여', activity: '두 집단에게 서로 다른 음악을 들려준 뒤 같은 문항으로 점수를 받아 공감과 연대감 척도를 비교한다.' },

      // 5. 과학 (10선)
      { id: 'sc_1', subjectId: 'science', subjectName: '과학', question: '공간과 벽 재질에 따라 소리의 울림(잔향) 시간은 어떻게 달라질까?', concept: '파동의 반사와 흡수, 잔향, 소리 에너지의 감쇠', hypothesis: '벽면이 부드럽고 흡음이 잘 되는 공간일수록 소리가 사라지는 데 걸리는 시간이 짧을 것이다.', variables: '독립변인: 공간 유형(타일 화장실 대 커튼 친 음악실 대 빈 교실) / 종속변인: 소리가 작아지는 데 걸린 시간 / 통제변인: 같은 박수 세기, 같은 마이크 위치', activity: '같은 위치에서 박수를 쳐서 녹음하고, 오디오 프로그램 파형에서 진폭이 최대값의 10%(-20dB)로 줄어드는 시간을 3회 측정해 평균을 낸다.' },
      { id: 'sc_2', subjectId: 'science', subjectName: '과학', question: '실로폰과 마림바는 소리의 여운이 왜 다를까?', concept: '진동과 감쇠, 재질의 탄성, 진폭이 줄어드는 정도', hypothesis: '금속 실로폰 막대는 나무 마림바 막대보다 소리의 여운이 더 길게 이어질 것이다.', variables: '독립변인: 막대의 재질(금속 대 나무) / 종속변인: 소리가 최대값의 10%로 줄어드는 시간 / 통제변인: 같은 음높이, 같은 타격 높이, 같은 마이크 거리', activity: '일정한 높이에서 추를 떨어뜨려 같은 힘으로 치고, 녹음 파형에서 감소 시간을 5회 측정해 평균을 비교한다.' },
      { id: 'sc_3', subjectId: 'science', subjectName: '과학', question: '병에 물을 채워 불 때와 두드릴 때 소리의 높낮이가 반대인 이유는?', concept: '기주 공명(불 때), 고체의 진동(두드릴 때), 진동수와 길이·질량 관계', hypothesis: '병을 불면 물이 많을수록 공기 기둥이 짧아 소리가 높아지고, 병을 두드리면 물이 많을수록 전체 질량이 커져 소리가 낮아진다.', variables: '독립변인: 병 속 물의 높이 / 종속변인: 불었을 때와 두드렸을 때의 진동수 / 통제변인: 같은 병, 같은 세기, 같은 앱, 같은 온도', activity: '물 높이를 2cm 간격으로 바꿔가며 주파수 앱으로 진동수를 3회씩 측정해 높낮이 변화가 반대임을 그래프로 확인한다.' },
      { id: 'sc_4', subjectId: 'science', subjectName: '과학', question: '움직이는 소리의 높낮이는 이론식과 얼마나 맞을까?', concept: '도플러 효과, 상대 속도, 진동수의 변화', hypothesis: '소리를 내는 물체가 다가올 때는 진동수가 높게, 멀어질 때는 낮게 측정되며 그 변화는 이론값과 비슷할 것이다.', variables: '독립변인: 음원의 움직임(다가옴 대 멈춤 대 멀어짐) / 종속변인: 측정된 진동수 / 통제변인: 같은 음원 주파수(440Hz), 같은 달리기 속도, 마이크 위치', activity: '운동장에서 440Hz 톤을 재생하며 일정한 속도로 달리고, 고정된 위치에서 앱으로 측정하여 도플러 공식 이론값과 비교한다.' },
      { id: 'sc_5', subjectId: 'science', subjectName: '과학', question: '서로 반대 위상의 소리를 합치면 소리가 줄어들까?', concept: '파동의 간섭, 상쇄 간섭, 위상', hypothesis: '같은 위치에서 두 소리를 역위상으로 재생하면 같은 위상으로 재생할 때보다 소리의 세기가 작을 것이다.', variables: '독립변인: 위상 조건(같은 위상 대 역위상) / 종속변인: 소리의 세기(dB) / 통제변인: 같은 단일 진동수 톤, 같은 스피커 위치, 같은 측정 거리', activity: '위상을 반전한 오디오 파일을 만들어 두 스피커로 재생하고, 소음 측정 앱으로 소리 세기를 3회 측정해 비교한다.' },
      { id: 'sc_6', subjectId: 'science', subjectName: '과학', question: '같은 음이라도 악기마다 소리가 다른 이유는?', concept: '진동수, 기본음과 배음, 음색, 스펙트럼', hypothesis: '악기마다 같은 음을 내더라도 배음 구성이 달라 스펙트럼의 모양이 다르게 나타난다.', variables: '독립변인: 악기 종류(리코더, 기타, 피아노 3종) / 종속변인: 배음별 상대 세기 / 통제변인: 같은 음높이(A4), 같은 음량, 같은 녹음 위치', activity: '같은 음을 각 악기로 연주해 스펙트럼 분석 앱으로 기본음과 2·3·4배음의 상대 세기를 읽어 표와 그래프로 비교한다.' },
      { id: 'sc_7', subjectId: 'science', subjectName: '과학', question: '온도가 올라가면 리코더 소리는 높아질까?', concept: '소리의 속력과 온도 공식, 관의 공명, 진동수', hypothesis: '기온이 높을수록 소리의 속력이 커져 리코더의 같은 운지 소리가 더 높아질 것이다.', variables: '독립변인: 실내 기온 / 종속변인: 튜너로 잰 음높이의 편차(센트) / 통제변인: 같은 리코더, 같은 운지법, 같은 숨의 세기, 예열 시간 통일', activity: '온도가 다른 장소에서 리코더를 일정 시간 둔 뒤 같은 음을 불어 튜너 앱으로 편차를 3회 측정하고 기온과 대조한다.' },
      { id: 'sc_8', subjectId: 'science', subjectName: '과학', question: '실 전화기는 실의 팽팽함에 따라 소리가 어떻게 달라질까?', concept: '파동의 매질, 고체를 통한 소리의 전달, 장력', hypothesis: '실이 팽팽할수록(장력이 클수록) 상대편이 듣는 소리의 세기가 커질 것이다.', variables: '독립변인: 실의 팽팽함(느슨 대 보통 대 팽팽) / 종속변인: 상대편 컵 입구 소리 세기(dB) / 통제변인: 같은 실과 컵, 같은 길이(5m), 같은 입력 음량', activity: '종이컵 실 전화기에서 한쪽 컵에 스피커로 소리를 틀고 반대쪽 컵에서 소음 측정 앱으로 세기를 3회 측정해 비교한다.' },
      { id: 'sc_9', subjectId: 'science', subjectName: '과학', question: '소리의 진동수에 따라 판 위의 모래 무늬는 어떻게 달라질까?', concept: '정상파, 공명(고유 진동수), 마디선', hypothesis: '진동수를 서서히 높이면 특정 진동수(공명)에서만 선명한 무늬가 나타나고, 공명 진동수가 높을수록 무늬가 더 복잡해질 것이다.', variables: '독립변인: 입력 진동수 / 종속변인: 선명한 무늬의 진동수, 마디 영역 수 / 통제변인: 같은 판의 재질과 크기, 같은 소금 양, 같은 스피커 출력', activity: '얇은 판을 스피커 위에 두고 소금을 뿌린 뒤 주파수를 천천히 올려가며 무늬가 또렷해지는 순간을 기록하고 사진을 촬영한다.' },
      { id: 'sc_10', subjectId: 'science', subjectName: '과학', question: '음악을 들려주면 콩나물은 더 잘 자랄까?', concept: '식물의 생장, 대조 실험, 통제된 변인', hypothesis: '음악을 들려준 콩나물과 들려주지 않은 콩나물의 7일 생장에는 차이가 없거나 작을 것이다.', variables: '독립변인: 소리 조건(무음 대 70dB 음악 대 70dB 소음) / 종속변인: 7일 후 줄기 길이, 무게 / 통제변인: 빛(암실), 물의 양, 온도, 같은 콩 개수', activity: '콩나물 키트 3세트를 준비해 매일 같은 시간에 길이를 자로 재고, 7일째에 전자저울로 무게를 측정해 대조한다.' },

      // 6. 한국사 (10선)
      { id: 'hi_1', subjectId: 'history', subjectName: '한국사', question: '세종은 왜 음악(편경·율관) 정비에 힘을 쏟았을까?', concept: '조선 전기의 예악 정치, 악기 제작과 국산 재료, 도량형의 관계', hypothesis: '세종 때의 음악 정비는 단순한 예술 사업이 아니라 의례를 갖추고 자주성을 높이며 기준(소리·도량형)을 세우려는 국가 정책과 관련이 있었을 것이다.', variables: '비교 대상: 세종실록의 음악 관련 기사 5건 / 분석 관점: 예악 정비, 자주성, 국산 재료, 도량형 연결 / 통제: 같은 시기 사료', activity: '실록에서 편경·율관·경석 기사를 검색해 5건을 골라, 기사마다 목적(예악, 자주성, 재료, 도량형)을 표로 분류 정리한다.' },
      { id: 'hi_2', subjectId: 'history', subjectName: '한국사', question: '농사일의 종류에 따라 노동요는 어떻게 다를까?', concept: '조선 후기 농업 변화(이앙법), 두레와 공동 노동, 노동요 선후창', hypothesis: '여럿이 함께 하는 노동일수록 선후창(주고받기) 구조가 뚜렷하고, 일의 속도에 맞춰 노래의 빠르기도 다르게 나타날 것이다.', variables: '비교 대상: 작업 종류별 노동요(모내기·논매기·타작) / 분석 관점: 선후창 구조 유무, 빠르기(BPM) / 통제: 같은 지역 채록 음원', activity: '공식 국악 음원에서 곡을 골라 박자를 두드려 BPM을 재고, 선소리와 후렴이 교대하는지 표에 표시해 대조한다.' },
      { id: 'hi_3', subjectId: 'history', subjectName: '한국사', question: '유신 시기 금지곡은 어떤 이유로 지정되었을까?', concept: '유신 체제, 긴급조치, 대중문화 통제, 청년 포크 문화', hypothesis: '공식적으로 밝힌 금지 사유와 실제 가사의 주제를 비교하면 둘 사이에 차이가 있을 것이다.', variables: '비교 대상: 대표 금지곡 5곡의 공식 사유와 가사 주제 / 분석 관점: 사유 분류(퇴폐·비관·반정부 등)와 주제 분류 / 통제: 1970년대 자료', activity: '금지곡 목록과 공식 사유를 연구 자료로 확인해 표에 정리하고, 실제 가사 주제를 분류하여 둘 사이의 괴리를 대조한다.' },
      { id: 'hi_4', subjectId: 'history', subjectName: '한국사', question: '일제강점기의 대중가요는 당시 사람들의 정서를 어떻게 보여 줄까?', concept: '근대 대중가요의 형성, 유성기 음반, 서양 음악 수용, 식민지 정서', hypothesis: '사의 찬미는 서양 음악 선율에 비관적인 노랫말이 결합한 곡으로, 당시 신문 기사와 반응에서 그 정서가 주목받았을 것이다.', variables: '비교 대상: 원곡 선율과 사의 찬미 빠르기, 노랫말 어휘 / 분석 관점: BPM, 비관·허무 어휘 비율, 당시 기사 반응 / 통제: 같은 자료 출처', activity: '음원에서 박자를 두드려 BPM을 재고 가사 어휘를 분류하며, 당시 신문 아카이브에서 대중의 반응 기사를 찾아 요약한다.' },
      { id: 'hi_5', subjectId: 'history', subjectName: '한국사', question: '고려는 중국에서 들여온 궁중 음악을 어떻게 받아들였을까?', concept: '고려의 대외 관계, 궁중 의례 음악(아악), 향악과 당악', hypothesis: '송에서 아악을 들여온 일은 국가 의례의 격식을 갖추려는 정책과 외교 관계와 관련이 있었을 것이다.', variables: '비교 대상: 도입 이전과 이후의 궁중 음악 기록 / 분석 관점: 도입 시기, 도입된 악기와 곡, 사용 의례 / 통제: 고려사 악지 사료', activity: '고려사 악지와 개설서를 비교해 도입 시기, 악기 종류, 사용된 의례를 연표와 비교 표로 정리한다.' },
      { id: 'hi_6', subjectId: 'history', subjectName: '한국사', question: '조선 후기 장시의 발달은 판소리 공연과 어떤 관련이 있을까?', concept: '조선 후기 상업 발달과 장시, 서민 문화, 판소리 전승', hypothesis: '장시가 발달한 지역은 판소리 공연과 명창의 활동이 활발했던 지역과 겹칠 것이다.', variables: '비교 대상: 장시 분포 지도와 명창의 출신지·활동지 지도 / 분석 관점: 두 지도의 지리적 겹침 / 통제: 18~19세기 한정', activity: '역사 지도에서 장시 분포를 확인하고, 명창의 출신지와 활동지를 지도에 표시한 뒤 겹치는 지역 수를 표로 집계한다.' },
      { id: 'hi_7', subjectId: 'history', subjectName: '한국사', question: '대한제국의 애국가는 어떤 음계로 만들어졌을까?', concept: '대한제국, 서양식 군악대, 애국가 제정, 5음 음계와 7음 음계', hypothesis: '대한제국 시기의 애국가 선율은 서양 7음 음계와 5음 음계 중 어느 쪽에 더 가까운지 음의 사용 빈도로 확인할 수 있다.', variables: '비교 대상: 악보에서 사용된 음의 종류 / 분석 관점: 음의 사용 빈도, 5음 음계 해당 음의 비율 / 통제: 같은 악보 판본', activity: '악보의 음 이름을 모두 세어 빈도표를 만들고, 5음 음계에 해당하는 음의 비율을 계산해 선율의 기초를 밝힌다.' },
      { id: 'hi_8', subjectId: 'history', subjectName: '한국사', question: '새야 새야 파랑새야는 동학농민운동과 어떤 관련으로 해석될까?', concept: '동학농민운동, 구전 민요, 상징과 은유, 역사 해석의 다양성', hypothesis: '노래의 상징은 동학농민운동과 연결해 해석되곤 하지만, 지역마다 가사가 달라 해석이 하나로 모이지는 않을 것이다.', variables: '비교 대상: 지역별로 채록된 노래 가사 5편 / 분석 관점: 새·녹두·청포장수 상징 어휘 사용 여부와 해석 / 통제: 같은 채록 자료집', activity: '채록 가사를 비교표로 정리하고 상징 어휘마다 제시된 여러 학술적 해석을 비교 정리한다.' },
      { id: 'hi_9', subjectId: 'history', subjectName: '한국사', question: '한국전쟁기의 대중가요는 피란민에게 어떤 의미였을까?', concept: '한국전쟁, 흥남 철수, 피란 수도 부산, 대중가요의 정서적 기능', hypothesis: '피란 시기의 대중가요는 피란민의 상황과 그리움을 노래해 위로가 되었다는 증언이 있을 것이다.', variables: '비교 대상: 피란 가요 3곡 가사 속 지명 / 피란민 구술 기록 / 분석 관점: 지명 어휘 빈도, 구술 속 노래 언급 / 통제: 1950년대 사료', activity: '가사에 나오는 지명과 상황을 표로 정리하고 공공 구술 기록에서 노래를 언급한 부분을 찾아 대조한다.' },
      { id: 'hi_10', subjectId: 'history', subjectName: '한국사', question: '임을 위한 행진곡은 어떻게 만들어지고 불려 왔을까?', concept: '5·18 민주화운동, 민중가요, 집단 가창, 역사적 기억', hypothesis: '이 곡은 행진에 맞는 박자와 따라 부르기 쉬운 선율을 가지고 있어 여럿이 함께 부르기에 적합하다고 볼 수 있다.', variables: '비교 대상: 곡의 박자, 빠르기, 음역 / 분석 관점: 박자, BPM(걸음 속도와 비교), 음역 폭 / 통제: 같은 악보 판본', activity: '악보에서 박자와 음역을 확인하고 음원에 맞춰 BPM을 재서 평균 걸음 속도와 비교 분석한다.' },

      // 7. 체육 (10선)
      { id: 'pe_1', subjectId: 'pe', subjectName: '체육', question: '음악의 템포는 운동 중 심박수와 힘든 정도에 영향을 줄까?', concept: '심박수, 주관적 운동 자각도(RPE), 템포와 동작의 동조', hypothesis: '빠른 템포 음악을 들으며 운동하면 무음일 때보다 같은 운동에서 운동 횟수가 늘고 힘든 정도의 평가는 낮을 것이다.', variables: '독립변인: 음악 조건(무음 대 느린 음악 대 빠른 음악) / 종속변인: 2분 줄넘기 횟수, 직후 심박수, RPE / 통제변인: 같은 시간대, 같은 음량(80dB 이하), 순서 무작위', activity: '손목 맥박으로 심박수를 재고 2분 줄넘기 횟수를 측정한다. 조건마다 충분히 쉰 뒤 반복해 학생 10명 이상의 평균을 비교한다.' },
      { id: 'pe_2', subjectId: 'pe', subjectName: '체육', question: '마무리 운동에서 음악은 심박수 회복을 빠르게 할까?', concept: '심박 회복, 부교감신경(안정), 운동 후 정리 운동', hypothesis: '느린 음악을 들으며 정리하면 무음일 때보다 운동 직후 5분 동안 심박수가 안정 심박수로 돌아오는 속도가 빠를 것이다.', variables: '독립변인: 정리 중 음악(무음 대 느린 클래식 대 빠른 음악) / 종속변인: 운동 종료 1·3·5분 뒤 심박수 감소량 / 통제변인: 제자리 달리기 2분 동일 강도, 같은 동작', activity: '운동 직후와 1·3·5분 뒤에 심박수를 기록해 조건별 감소량을 그래프로 비교한다.' },
      { id: 'pe_3', subjectId: 'pe', subjectName: '체육', question: '음악의 박자와 걸음 박자가 맞으면 걷기·달리기가 더 편해질까?', concept: '케이던스(분당 걸음 수), 청각과 운동의 동조, 운동 효율', hypothesis: '자신의 평소 걸음 수와 비슷한 템포의 음악을 들을 때 걸음 수의 흔들림이 줄고 힘든 정도의 평가가 낮을 것이다.', variables: '독립변인: 음악 템포(평소 케이던스보다 느림 대 같음 대 빠름) / 종속변인: 분당 걸음 수 표준편차, 1km 걷기 시간, RPE / 통제변인: 같은 코스, 같은 신발', activity: '자신의 평소 케이던스를 먼저 구한 뒤 같은 템포 음악을 준비하고, 조건별 걸음 수 변동과 운동 자각도를 3회 측정한다.' },
      { id: 'pe_4', subjectId: 'pe', subjectName: '체육', question: '신나는 음악은 순간 힘(악력)을 높일까?', concept: '각성 수준, 최대 근력 측정, 개인차', hypothesis: '빠르고 강한 음악을 들은 직후 악력은 무음이나 차분한 음악을 들었을 때보다 약간 높게 나타날 수 있다.', variables: '독립변인: 음악 조건(무음 대 강한 음악 대 차분한 음악) / 종속변인: 악력 측정값(kg) / 통제변인: 같은 손, 같은 자세, 조건 사이 2분 휴식, 80dB 이하', activity: '디지털 악력계로 조건마다 3회 측정해 최고값을 기록하고 학생 10명 이상의 평균을 비교한다.' },
      { id: 'pe_5', subjectId: 'pe', subjectName: '체육', question: '연습한 점프 동작은 음악의 박과 얼마나 맞을까?', concept: '박자와 동작의 일치, 타이밍의 오차, 연습 효과', hypothesis: '연습 횟수가 늘수록 점프 착지 순간과 음악의 박 사이 시간 차이(오차)가 줄어들 것이다.', variables: '독립변인: 연습 횟수(0회 대 5회 대 10회 대 20회) / 종속변인: 착지 프레임과 박 소리 프레임의 시간 차(초) / 통제변인: 4박마다 제자리 점프, 100BPM', activity: '스마트폰 카메라로 촬영하고, 영상 편집 앱에서 착지 프레임과 박 소리 프레임을 대조해 시간 오차 감소를 측정한다.' },
      { id: 'pe_6', subjectId: 'pe', subjectName: '체육', question: '음악에 맞춘 줄넘기 훈련은 민첩성을 더 높일까?', concept: '협응성, 민첩성, 사전·사후 검사', hypothesis: '음악에 맞춰 발 동작을 바꾸는 리듬 줄넘기를 한 집단은 일반 줄넘기를 한 집단보다 훈련 후 민첩성 향상이 클 것이다.', variables: '독립변인: 훈련 방식(일반 줄넘기 대 리듬 줄넘기) / 종속변인: 20초 사이드스텝 횟수의 향상량 / 통제변인: 주 3회 10분 훈련, 같은 측정 방법', activity: '훈련 전과 후(2주간) 20초 사이드스텝 횟수를 측정해 두 집단의 향상량 평균을 비교한다.' },
      { id: 'pe_7', subjectId: 'pe', subjectName: '체육', question: '자유투 전에 선호하는 음악을 들으면 성공률이 달라질까?', concept: '프리샷 루틴, 불안 조절, 스포츠 심리', hypothesis: '자유투 전에 차분한 음악으로 루틴을 수행한 날은 무음일 때보다 슛 성공률이 높고 슛 직전의 긴장 평가가 낮을 것이다.', variables: '독립변인: 슛 전 청각 조건(무음 대 차분한 음악) / 종속변인: 자유투 20회 성공률, 긴장도(1~10점) / 통제변인: 같은 거리, 같은 공, 같은 선수', activity: '같은 학생이 이틀에 걸쳐 두 조건에서 자유투 20회를 던지고, 슛 직전 이어폰을 빼는 시점을 통일해 성공률을 비교한다.' },
      { id: 'pe_8', subjectId: 'pe', subjectName: '체육', question: '강강술래의 걸음 박자는 빠르기에 따라 얼마나 잘 맞을까?', concept: '민속놀이와 전통 무용, 장단의 빠르기, 집단 동작의 일치', hypothesis: '장단이 아주 느리거나 아주 빠를 때보다 적당한 빠르기에서 발을 구르는 순간이 일치하는 비율이 높을 것이다.', variables: '독립변인: 장단의 빠르기(60BPM 대 90BPM 대 120BPM) / 종속변인: 발 구르는 순간이 박과 일치한 학생의 비율 / 통제변인: 10명 내외, 같은 동작', activity: '강강술래 걸음을 연습한 뒤 메트로놈으로 3가지 빠르기를 들려주며 원을 돌게 하고, 촬영 영상에서 박마다 발이 닿은 학생 비율을 센다.' },
      { id: 'pe_9', subjectId: 'pe', subjectName: '체육', question: '음악 소리의 크기는 운동 중 힘든 정도에 영향을 줄까?', concept: '각성 수준, 주관적 운동 자각도(RPE), 청력 보호', hypothesis: '소리가 너무 크거나 너무 작을 때보다 중간 크기(70dB 안팎)의 음악에서 같은 운동 후 RPE가 더 낮을 것이다.', variables: '독립변인: 음악 소리 크기(60dB 대 70dB 대 80dB) / 종속변인: 3분 스텝박스 오르내리기 후 RPE, 심박수 / 통제변인: 같은 곡, 같은 운동, 순서 무작위', activity: '스피커로 소리 크기를 맞추고 스텝박스 3분 운동 후 RPE와 심박수를 기록해 비교한다.' },
      { id: 'pe_10', subjectId: 'pe', subjectName: '체육', question: '스트레칭할 때 듣는 음악이 몸의 유연성에 영향을 줄까?', concept: '유연성, 근육의 이완, 청각 자극', hypothesis: '느리고 편안한 음악을 들으며 스트레칭하면 무음이거나 빠른 음악일 때보다 앉아 윗몸 앞으로 굽히기 기록이 더 커질 것이다.', variables: '독립변인: 스트레칭 중 소리 조건(무음 대 편안한 음악 대 빠른 음악) / 종속변인: 앉아 윗몸 앞으로 굽히기 기록(cm) / 통제변인: 같은 스트레칭 시간(5분)', activity: '스트레칭 직후 2회 측정해 더 높은 값을 기록하고, 학생 10~20명의 조건별 평균 기록을 비교한다.' },

      // 8. 미술 (10선)
      { id: 'ar_1', subjectId: 'art', subjectName: '미술', question: '장조와 단조 음악을 들으면 떠오르는 색이 정해져 있을까?', concept: '색채 심리, 난색과 한색, 명도와 채도, 조성의 느낌', hypothesis: '장조 멜로디를 들을 때는 난색을 고르는 비율이, 단조 멜로디를 들을 때는 한색을 고르는 비율이 더 높을 것이다.', variables: '독립변인: 음악의 조성(장조 대 단조) / 종속변인: 12색 색상환 선택, 난색·한색 비율, 명도/채도 / 통제변인: 같은 멜로디 편곡(템포, 악기, 음량 동일)', activity: '학급 20명 이상에게 두 곡을 들려준 뒤 12색 색상환에서 연상되는 색을 고르게 하고 난색·한색 비율을 막대그래프로 비교한다.' },
      { id: 'ar_2', subjectId: 'art', subjectName: '미술', question: '악보에서 음표가 빽빽한 정도는 시각적 긴장감과 관련이 있을까?', concept: '조형 원리(비례·균형), 여백, 밀도, 시각적 긴장감', hypothesis: '음표가 빽빽한 악보일수록 시각적 긴장감 점수가 높고, 쉼표와 여백이 많은 악보일수록 안정감 점수가 높을 것이다.', variables: '독립변인: 악보의 음표 밀도(음표·쉼표 칸 비율) / 종속변인: 시각적 긴장감 점수(7점 척도) / 통제변인: 같은 크기 악보 이미지, 같은 글꼴', activity: '악보 이미지를 격자 칸으로 나눠 음표가 들어간 칸 비율을 재고, 20명에게 긴장감 점수를 받아 산점도를 그린다.' },
      { id: 'ar_3', subjectId: 'art', subjectName: '미술', question: '칸딘스키의 색과 형태는 어떤 악기의 소리와 어울린다고 느껴질까?', concept: '공감각, 점·선·면 조형 요소, 색과 소리의 연상', hypothesis: '칸딘스키가 이론으로 연결한 색과 악기(노랑-트럼펫, 파랑-첼로)는 우연으로 기대되는 일치율(20%)보다 높게 맞춰질 것이다.', variables: '독립변인: 제시한 색·형태 / 종속변인: 악기 음원 매칭 일치율 / 통제변인: 같은 음높이·음량의 악기 음원 5개, 순서 무작위', activity: '색 카드를 보여주고 악기 음원 5개 중 가장 어울리는 소리를 고르게 한 뒤, 칸딘스키 이론과의 일치율을 20명 이상 검증한다.' },
      { id: 'ar_4', subjectId: 'art', subjectName: '미술', question: '음악 장르에 따라 앨범 커버의 색은 어떻게 다를까?', concept: '시각 디자인, 색상(난색·한색), 채도, 장르와 이미지', hypothesis: '강렬한 장르의 앨범 커버는 포크·어쿠스틱 장르보다 평균 채도가 높을 것이다.', variables: '독립변인: 음악 장르(2종) / 종속변인: 평균 채도, 난색·한색 비율 / 통제변인: 장르당 20장, 같은 선정 기준', activity: '앨범 커버 이미지에서 편집 앱의 스포이트로 주요 색 3가지를 찍어 채도 값을 기록하고 장르별 평균을 비교한다.' },
      { id: 'ar_5', subjectId: 'art', subjectName: '미술', question: '몬드리안의 브로드웨이 부기우기를 리듬으로 바꾸면 그림과 어울릴까?', concept: '신조형주의, 기하학적 추상, 부기우기 리듬(당김음), 격자와 박', hypothesis: '그림의 색 면을 박자 칸에 대응시켜 만든 리듬은 다른 그림에서 만든 리듬보다 그림과 어울린다는 평가가 높을 것이다.', variables: '독립변인: 리듬을 만든 그림(같은 그림 대 다른 그림) / 종속변인: 어울림 점수(5점 척도) / 통제변인: 같은 템포, 같은 악기, 같은 길이', activity: '격자 한 칸을 한 박으로 보고 색 면에 맞춰 리듬을 만든 뒤, 그림과 두 리듬을 들려주며 20명에게 어울림 점수를 받는다.' },

        variables: '독립변인: 공연 배치(마당식 대 무대 정면) / 종속변인: 3분 동안 관객의 박수·추임새 횟수, 몰입 점수(7점) / 통제변인: 같은 곡, 같은 연주자, 3분 길이, 같은 관객 규모',

      },
      {
        id: 'ew_10',
        area: '연주 방식과 공간',
        title: '왈츠 선율은 어떻게 슬픈 노래로 바뀌었을까?',
        concept: '서양 3박자 왈츠 춤곡, 템포 / 한국 근대 가요 음 끌기와 시김새적 창법 / BPM, 음의 소요 시간',
        twoSystemsDiff: '원곡은 경쾌한 춤곡이었으나, 한국 근대에서는 템포를 늦추고 음을 길게 끌며 민족적 비가로 변용되었다.',
        hypothesis: '사의 찬미는 원곡(도나우강의 잔물결)보다 템포가 느리고 같은 선율 구간을 부르는 데 걸리는 시간이 길 것이다.',
        variables: '독립변인: 음원(원곡 대 사의 찬미) / 종속변인: BPM, 같은 선율 구간 소요 시간(초), 슬프다 점수(7점) / 통제변인: 같은 선율 마디 구간, 같은 재생 기기',
        activity: '두 음원에서 같은 선율 구간을 골라 박을 두드려 BPM을 측정하고, 오디오 프로그램에서 구간 소요 시간을 재어 비교 분석한다.'
      }
    ];

    // =========================================================
    // [채점 상태] 과제 슬롯별 상태 계산 및 배지
    // =========================================================
    function getSlotStatus(sub, slot) {
      const rep = sub && sub.reports && sub.reports[slot];
      const key = slot === 'report1' ? 'r1' : 'r2';
      const legacyScore = sub && sub.grading ? sub.grading[slot === 'report1' ? 'score1' : 'score2'] : undefined;
      let g = sub && sub.grading && sub.grading[key];
      // 예전 방식으로 채점된 기록(점수만 있는 경우)도 채점 완료로 인정
      if (!g && rep && legacyScore !== undefined) {
        g = { score: legacyScore, round: 1, reportVersion: rep.updatedAt };
      }
      if (!rep) return { kind: 'none', label: '미선택' };
      if (g && g.reportVersion === rep.updatedAt) {
        return { kind: 'graded', label: g.round + '차 채점 완료 (' + g.score + '점)', score: g.score, round: g.round, grade: g };
      }
      if (g && rep.isSubmitted) return { kind: 'resubmitted', label: '재제출 · 채점 대기 (이전 ' + g.score + '점)', score: g.score, grade: g };
      if (rep.isSubmitted) return { kind: 'submitted', label: '제출 완료' };
      return { kind: 'draft', label: g ? '수정 중 (이전 ' + g.score + '점)' : '작성 중', score: g ? g.score : undefined, grade: g || null };
    }

    const STATUS_STYLE = {
      none: 'bg-slate-100 text-slate-400',
      draft: 'bg-slate-100 text-slate-600',
      submitted: 'bg-blue-100 text-blue-700',
      resubmitted: 'bg-amber-100 text-amber-800',
      graded: 'bg-emerald-100 text-emerald-800'
    };
    const STATUS_ICON = {
      none: 'fa-minus',
      draft: 'fa-pen',
      submitted: 'fa-paper-plane',
      resubmitted: 'fa-rotate',
      graded: 'fa-circle-check'
    };

    function StatusBadge(props) {
      const st = props.status;
      const cls = 'inline-flex items-center gap-1 text-2xs font-extrabold px-2 py-0.5 rounded-full whitespace-nowrap ' + STATUS_STYLE[st.kind];
      if (props.onClick) {
        return e('button', {
          type: 'button',
          onClick: props.onClick,
          title: '눌러서 보고서 보기',
          className: cls + ' cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-slate-300 transition'
        },
          e('i', { className: 'fa-solid ' + STATUS_ICON[st.kind] }),
          e('span', null, st.label),
          e('i', { className: 'fa-solid fa-chevron-right opacity-60 ml-0.5' })
        );
      }
      return e('span', { className: cls },
        e('i', { className: 'fa-solid ' + STATUS_ICON[st.kind] }),
        e('span', null, st.label)
      );
    }

    function isGradableStatus(st) {
      return st.kind === 'submitted' || st.kind === 'resubmitted' || st.kind === 'graded';
    }

    const CONTENT_OPTIONS = [
      [15, '15점 - 탐구 내용이 주제와 일치하고 매우 충실함'],
      [10, '10점 - 대체로 일치하나 일부 보완이 필요함'],
      [5, '5점 - 탐구 내용이 미흡하거나 주제와 불일치함']
    ];
    const ANALYSIS_OPTIONS = [
      [15, '15점 - 자료 분석 및 AI 비판적 검증/캡처 완비'],
      [10, '10점 - 자료 분석은 있으나 AI 검증 내용이 미흡함'],
      [5, '5점 - 단순 복사 또는 자료 분석에 오류가 많음']
    ];

    function rubricText(options, v) {
      const o = options.filter(function(x) { return x[0] === Number(v); })[0];
      return o ? (o[1].split(' - ')[1] || o[1]) : '';
    }

    // [학생 화면] 과제별 채점 결과: 항목별 점수 + 기준 설명 + 선생님 코멘트
    function GradeResultCard(props) {
      const g = props.grade;
      const n = props.slot === 'report1' ? '1' : '2';
      const gr = (props.sub && props.sub.grading) || {};
      const content = g.content !== undefined ? g.content : gr['r' + n + '_content'];
      const analysis = g.analysis !== undefined ? g.analysis : gr['r' + n + '_analysis'];
      const comment = g.comment || '';
      const prev = props.previous;
      const tone = prev
        ? { box: 'bg-amber-50 border-amber-200', title: 'text-amber-800', score: 'text-amber-900' }
        : { box: 'bg-emerald-50 border-emerald-200', title: 'text-emerald-700', score: 'text-emerald-900' };
      const row = function(label, v, options) {
        return e('div', { className: 'flex items-start justify-between gap-3 p-2.5 rounded-lg bg-white border border-slate-100' },
          e('div', null,
            e('p', { className: 'text-2xs font-bold text-slate-700' }, label),
            v !== undefined && e('p', { className: 'text-2xs text-slate-500 mt-0.5' }, rubricText(options, v))
          ),
          e('span', { className: 'font-mono font-black text-sm shrink-0 ' + tone.score }, (v !== undefined ? v : '-') + ' / 15')
        );
      };
      return e('div', { className: 'mb-4 p-4 rounded-2xl border space-y-2.5 ' + tone.box },
        e('div', { className: 'flex items-start justify-between gap-2' },
          e('div', null,
            e('p', { className: 'text-xs font-extrabold ' + tone.title }, (prev ? '이전 채점 결과 (' : '채점 결과 (') + g.round + '차)'),
            prev && e('p', { className: 'text-2xs text-amber-700 mt-0.5' }, '보완해서 다시 제출하면 선생님이 다시 채점합니다.')
          ),
          e('p', { className: 'text-xl font-black ' + tone.score }, g.score + '점',
            e('span', { className: 'text-2xs font-bold ml-1 opacity-70' }, '/ 30점'))
        ),
        row('탐구 내용 일치성 및 충실도', content, CONTENT_OPTIONS),
        row('자료 분석 및 AI 비판 검증', analysis, ANALYSIS_OPTIONS),
        isFilled(comment) && e('div', { className: 'p-3 rounded-lg bg-white border border-slate-200' },
          e('p', { className: 'text-2xs font-bold text-slate-700 mb-1 flex items-center gap-1' },
            e('i', { className: 'fa-solid fa-comment-dots text-indigo-500' }),
            e('span', null, '선생님 코멘트')
          ),
          e('p', { className: 'text-xs text-slate-700 whitespace-pre-wrap leading-relaxed' }, comment)
        )
      );
    }

    // =========================================================
    // [보고서 보기] 학생이 작성한 보고서를 작성 화면 구성 그대로 보여 주기
    // =========================================================
    const CATEGORY_META = {
      inquiry: { label: '주제 1. 교과 융합 탐구', badge: 'bg-indigo-100 text-indigo-800', bar: 'bg-indigo-500', box: 'bg-indigo-50/50 border-indigo-200' },
      product: { label: '주제 2. 음악 문화유산 상품 개발', badge: 'bg-emerald-100 text-emerald-800', bar: 'bg-emerald-500', box: 'bg-emerald-50/50 border-emerald-200' },
      pop_history: { label: '주제 3. 대중음악사 & 미래 음악 예측', badge: 'bg-teal-100 text-teal-800', bar: 'bg-teal-500', box: 'bg-teal-50/50 border-teal-200' },
      east_west: { label: '주제 4. 국악·서양음악 교차 실증 탐구', badge: 'bg-amber-100 text-amber-800', bar: 'bg-amber-500', box: 'bg-amber-50/50 border-amber-200' }
    };

    function isFilled(v) {
      return typeof v === 'string' ? v.trim().length > 0 : !!v;
    }

    // 진행도 계산에 쓰는 항목 목록 (작성 화면의 입력 칸과 같은 순서)
    function getReportFieldValues(rep) {
      const ai = rep.aiLog || {};
      const cat = rep.topicCategory || 'inquiry';
      let vals = [rep.topicTitle];
      if (cat === 'inquiry') {
        vals = vals.concat([rep.coreConcept, rep.hypothesis, rep.variables, rep.procedure, rep.conclusion, rep.limitations]);
      } else if (cat === 'product') {
        vals = vals.concat([rep.brandName, rep.productTrait, rep.productHow, rep.productImpact, rep.productPrecaution]);
      } else if (cat === 'pop_history') {
        POP_ERAS.forEach(function(era, i) {
          const k = (rep.popKorean100 && rep.popKorean100[i]) || {};
          const g = (rep.popGlobal100 && rep.popGlobal100[i]) || {};
          vals.push(k.song, k.history, g.song, g.history);
        });
        const f = rep.popFutureThree || {};
        vals = vals.concat([f.creator, f.form, f.value]);
      } else if (cat === 'east_west') {
        vals = vals.concat([rep.ewStep1Theory, rep.ewStep2Hypothesis, rep.ewStep3Variables, rep.ewStep4Empirical, rep.ewStep5Comparison]);
      }
      return vals.concat([ai.prompt, ai.screenshotImg, ai.criticalReview]);
    }

    function getReportProgress(rep) {
      const vals = getReportFieldValues(rep);
      const filled = vals.filter(isFilled).length;
      return { filled: filled, total: vals.length, pct: Math.round(filled / vals.length * 100) };
    }

    function ReportField(props) {
      const filled = isFilled(props.value);
      return e('div', { className: 'space-y-1' },
        e('p', { className: 'text-xs font-bold text-slate-800' }, props.label),
        filled
          ? e('div', { className: 'p-2.5 rounded-lg bg-white border border-slate-200 text-xs text-slate-700 leading-relaxed whitespace-pre-wrap break-words' }, props.value)
          : e('div', { className: 'p-2.5 rounded-lg border border-dashed border-rose-200 bg-rose-50/40 text-2xs text-rose-400' }, '아직 작성하지 않았습니다')
      );
    }

    function PopHistoryTable(props) {
      const rows = props.rows || [];
      const done = POP_ERAS.filter(function(era, i) { const r = rows[i] || {}; return isFilled(r.song) && isFilled(r.history); }).length;
      const cell = function(v) {
        return e('div', { className: 'px-2 py-1.5 border-l border-slate-100 break-words ' + (isFilled(v) ? 'text-slate-700' : 'text-rose-300') }, isFilled(v) ? v : '미작성');
      };
      return e('div', { className: 'space-y-1' },
        e('p', { className: 'text-xs font-bold text-slate-800' }, props.title + ' (완성 ' + done + ' / 11 구간)'),
        e('div', { className: 'rounded-lg border border-slate-200 overflow-hidden bg-white text-2xs' },
          e('div', { className: 'grid grid-cols-[72px_1fr_1.4fr] bg-slate-100 font-bold text-slate-600' },
            e('div', { className: 'px-2 py-1.5' }, '시대'),
            e('div', { className: 'px-2 py-1.5 border-l border-slate-200' }, '대표곡(가수)'),
            e('div', { className: 'px-2 py-1.5 border-l border-slate-200' }, '역사적 사건·시대상')
          ),
          POP_ERAS.map(function(era, i) {
            const r = rows[i] || {};
            return e('div', { key: era, className: 'grid grid-cols-[72px_1fr_1.4fr] border-t border-slate-100' },
              e('div', { className: 'px-2 py-1.5 font-black text-teal-800 bg-teal-50' }, era),
              cell(r.song),
              cell(r.history)
            );
          })
        )
      );
    }

    function ReportView(props) {
      const rep = props.report;
      if (!rep) return e('p', { className: 'text-xs text-slate-400 py-6 text-center' }, '아직 선택한 과제가 없습니다.');
      const cat = rep.topicCategory || 'inquiry';
      const meta = CATEGORY_META[cat] || CATEGORY_META.inquiry;
      const prog = getReportProgress(rep);
      const ai = rep.aiLog || {};
      const F = function(label, value) { return e(ReportField, { key: label, label: label, value: value }); };

      let body = [];
      if (cat === 'inquiry') {
        body = [
          F('1. 연계 교과 및 핵심 이론 개념', rep.coreConcept),
          F('2. 일상의 호기심 및 가설 설정', rep.hypothesis),
          F('3. 변인 통제 설정 (독립 / 종속 / 통제변인)', rep.variables),
          F('4. 측정 방법 및 실험 절차', rep.procedure),
          F('5. 결론 및 음악적 시사점', rep.conclusion),
          F('6. 한계와 후속 탐구', rep.limitations)
        ];
      } else if (cat === 'product') {
        body = [
          F('문화유산명 및 기획 상품명', rep.brandName),
          F('1. 해당 음악의 특징', rep.productTrait),
          F('2. 구체적으로 (개발 방식 및 구성)', rep.productHow),
          F('3. 얻을 수 있는 기대 효과', rep.productImpact),
          F('4. 상품 개발 및 사용(판매·체험) 시 유의할 점', rep.productPrecaution)
        ];
      } else if (cat === 'pop_history') {
        const f = rep.popFutureThree || {};
        body = [
          e(PopHistoryTable, { key: 'kr', title: '1. 우리나라 대중음악 100년사', rows: rep.popKorean100 }),
          e(PopHistoryTable, { key: 'gl', title: '2. 글로벌 대중음악 100년사', rows: rep.popGlobal100 }),
          e('p', { key: 'ft', className: 'text-xs font-extrabold text-teal-950 pt-1' }, '3. 2030년 이후 미래 음악 예측'),
          F('① 창작 주체 측면', f.creator),
          F('② 음악 형식 측면', f.form),
          F('③ 음악의 가치 측면', f.value)
        ];
      } else if (cat === 'east_west') {
        body = [
          F('1. 이론 학습 (서양 이론 vs 국악 이론)', rep.ewStep1Theory),
          F('2. 탐구 영역 선택 및 가설 세우기', rep.ewStep2Hypothesis),
          F('3. 변인 통제 설정', rep.ewStep3Variables),
          F('4. 실증 활동 (측정·계산·설문 및 결과)', rep.ewStep4Empirical),
          F('5. 두 체계의 같은 점과 다른 점, 한계', rep.ewStep5Comparison)
        ];
      }

      return e('div', { className: 'space-y-3' },
        e('div', { className: 'flex flex-wrap items-center gap-2' },
          e('span', { className: 'text-2xs font-extrabold px-2 py-0.5 rounded ' + meta.badge }, meta.label),
          rep.updatedAt && e('span', { className: 'text-2xs text-slate-400' }, '마지막 저장: ' + rep.updatedAt)
        ),
        e('div', null,
          e('div', { className: 'flex items-center justify-between text-2xs font-bold text-slate-600 mb-1' },
            e('span', null, '작성 진행도'),
            e('span', null, prog.filled + ' / ' + prog.total + ' 항목 (' + prog.pct + '%)')
          ),
          e('div', { className: 'h-2 rounded-full bg-slate-100 overflow-hidden' },
            e('div', { className: 'h-full rounded-full ' + meta.bar, style: { width: prog.pct + '%' } })
          )
        ),
        F('탐구/기획 주제명', rep.topicTitle),
        e('div', { className: 'space-y-3 p-4 rounded-2xl border ' + meta.box }, body),
        e('div', { className: 'space-y-3 p-4 rounded-2xl bg-purple-50 border border-purple-200' },
          e('p', { className: 'text-xs font-extrabold text-purple-950 flex items-center gap-1.5' },
            e('i', { className: 'fa-solid fa-robot text-purple-600' }),
            e('span', null, 'AI 활용 기록 및 비판적 검증')
          ),
          F('AI에게 입력한 질문(프롬프트)', ai.prompt),
          e('div', { className: 'space-y-1' },
            e('p', { className: 'text-xs font-bold text-slate-800' }, 'AI와의 실제 대화 캡처 사진'),
            ai.screenshotImg
              ? e('div', { className: 'p-1 rounded-lg bg-white border border-purple-200 flex justify-center' },
                  e('img', { src: ai.screenshotImg, alt: 'AI 대화 캡처', className: 'max-h-80 object-contain rounded' }))
              : e('div', { className: 'p-2.5 rounded-lg border border-dashed border-rose-200 bg-rose-50/40 text-2xs text-rose-400' }, '첨부한 사진이 없습니다')
          ),
          F('학생의 비판적 검증 및 교정 내용', ai.criticalReview)
        )
      );
    }

    function App() {
      const [mainTab, setMainTab] = useState('inquiry');
      const [currentUser, setCurrentUser] = useState(function() {
        try {
          const savedUser = sessionStorage.getItem('music_current_user');
          return savedUser ? JSON.parse(savedUser) : null;
        } catch(err) { return null; }
      });

      const [studentIdInput, setStudentIdInput] = useState('');
      const [studentPwInput, setStudentPwInput] = useState('');
      const [studentNameInput, setStudentNameInput] = useState('');
      const [isRegisterMode, setIsRegisterMode] = useState(false);
      const [authBusy, setAuthBusy] = useState(false);

      const [showTeacherModal, setShowTeacherModal] = useState(false);
      const [teacherIdInput, setTeacherIdInput] = useState('');
      const [teacherPwInput, setTeacherPwInput] = useState('');
      const [teacherAuth, setTeacherAuth] = useState(function() {
        try {
          const s = localStorage.getItem('music_teacher_auth');
          return s ? JSON.parse(s) : { id: 'admin', pw: '123456' };

      const [inquiryDataState, setInquiryDataState] = useState(function() {
        try {
          const s = localStorage.getItem('music_custom_inquiry_data');
          return s ? JSON.parse(s) : FULL_INQUIRY_DATA;
        } catch(err) { return FULL_INQUIRY_DATA; }

      const [productDataState, setProductDataState] = useState(function() {
        try {
          const s = localStorage.getItem('music_custom_product_data');

      const [popGuideState, setPopGuideState] = useState(function() {
        try {

          return s ? JSON.parse(s) : DEFAULT_POP_REF_GUIDE;
        } catch(err) { return DEFAULT_POP_REF_GUIDE; }
      });

      const [eastWestDataState, setEastWestDataState] = useState(function() {

          return s ? JSON.parse(s) : FULL_EAST_WEST_DATA;
        } catch(err) { return FULL_EAST_WEST_DATA; }
      });

      const [allSubmissions, setAllSubmissions] = useState(function() {
        try {
          const s = localStorage.getItem('music_assessment_submissions');
          return s ? JSON.parse(s) : {};
        } catch(err) { return {}; }
      });

      const [activeItemEditModal, setActiveItemEditModal] = useState(false);
      const [editingItemCategory, setEditingItemCategory] = useState('');
      const [editingItemForm, setEditingItemForm] = useState(null);

      // 교사용 개별 학생 채점 모달 상태
      const [gradingStudentId, setGradingStudentId] = useState(null);
      // 과제 하나만 열어 보고 채점하는 창: { studentId, slot }
      const [slotViewer, setSlotViewer] = useState(null);
      const [gradingForm, setGradingForm] = useState({
        r1_content: 15,
        r1_analysis: 15,
        r2_content: 15,
        r2_analysis: 15,
        r1_comment: '',
        r2_comment: '',
        teacherFeedback: ''
      });

      const [newTeacherId, setNewTeacherId] = useState('');
      const [newTeacherPw, setNewTeacherPw] = useState('');
      const [selectedSubject, setSelectedSubject] = useState('all');
      const [toastMessage, setToastMessage] = useState('');

      // [신규] 교사용 개별 학생 정보 편집 및 삭제 모달 상태
      const [editingStudentModal, setEditingStudentModal] = useState(false);
      const [editingStudentTargetId, setEditingStudentTargetId] = useState(null);
      const [editingStudentForm, setEditingStudentForm] = useState({ id: '', name: '' });
      
      const showToast = function(msg, ms) {
        setToastMessage(msg);
        setTimeout(function() { setToastMessage(''); }, ms || 2600);
      };

      // =========================================================
      // [Supabase 실시간 클라우드 DB 연동 로직]
      // =========================================================

      // 1. 클라우드에서 전체 제출 데이터 불러오기 (교사 화면 및 앱 시작 시)
      // 클라우드에서 보고서 불러오기
      //  - 학생: 자기 보고서 한 건만 / 교사: 전체 / 로그인 전: 불러오지 않음 (서버 부담을 줄이기 위함)
      const fetchSubmissionsFromCloud = async function(userOverride) {
        if (!supabaseClient) return;
        const u = (userOverride && userOverride.role) ? userOverride : currentUserRef.current;
        if (!u) return;
        try {
          if (u.role === 'teacher') setIsCloudSyncing(true);
          let query = supabaseClient.from('submissions').select('student_id, data');
          if (u.role === 'student') query = query.eq('student_id', String(u.id));
          const res = await withTimeout(query);
          if (!res.error && res.data && res.data.length > 0) {
            setAllSubmissions(function(prev) {
              const merged = Object.assign({}, prev);
              const pending = getPendingSync();
              res.data.forEach(function(row) {
                // 아직 전달하지 못한 내 보고서가 있으면 기기 쪽 내용을 지킴 (전달은 pushPendingForStudent가 담당)
                if (row.student_id && row.data && pending.indexOf(String(row.student_id)) === -1) {
                  merged[row.student_id] = row.data;
                }
              });
              safeSetLocal('music_assessment_submissions', JSON.stringify(merged));
              return merged;
            });
          }
        } catch (err) {
          console.error('Cloud Fetch Error:', err);
        } finally {
          if (u.role === 'teacher') setIsCloudSyncing(false);
        }
      };

      // 한 학생의 보고서만 다시 불러오기 (실시간 알림에 내용이 빠져 있을 때 사용)
      const fetchOneFromCloud = async function(id) {
        if (!supabaseClient || !id) return;
        try {
          const res = await withTimeout(supabaseClient.from('submissions').select('student_id, data').eq('student_id', String(id)).maybeSingle());
          if (!res.error && res.data && res.data.data) {
            setAllSubmissions(function(prev) {
              const up = Object.assign({}, prev, { [id]: res.data.data });
              safeSetLocal('music_assessment_submissions', JSON.stringify(up));
              return up;
            });
          }
        } catch (err) {
          console.error('Cloud Fetch One Error:', err);
        }
      };

      // 개별 학생 데이터 클라우드에 업로드 (성공하면 true)
      const syncStudentToCloud = async function(studentId, submissionData) {
        if (!supabaseClient || !studentId) return false;
        try {
          const res = await withTimeout(supabaseClient
            .from('submissions')
            .upsert({
              student_id: String(studentId),
              data: submissionData,
              updated_at: new Date().toISOString()
            }, { onConflict: 'student_id' }));
          if (res.error) { console.error('Cloud Sync Error:', res.error); return false; }
          return true;
        } catch (err) {
          console.error('Cloud Sync Error:', err);
          return false;
        }
      };

      // 이 기기에 쌓여 있던(아직 전달하지 못한) 보고서를 클라우드로 올리기
      // 클라우드의 채점 결과는 그대로 두고, 학생이 기기에서 쓴 과제 내용으로 갱신
      const pushPendingForStudent = async function(id) {
        if (!supabaseClient || getPendingSync().indexOf(String(id)) === -1) return;
        const local = loadLocalSubmissions()[id];
        if (!local) { removePendingSync(id); return; }
        try {
          const res = await withTimeout(supabaseClient.from('submissions').select('data').eq('student_id', String(id)).maybeSingle());
          if (res.error) return;
          const cloud = (res.data && res.data.data) || {};
          const merged = Object.assign({}, cloud, local, {
            reports: Object.assign({}, cloud.reports || {}, local.reports || {})
          });
          if (cloud.grading) merged.grading = cloud.grading;
          const ok = await syncStudentToCloud(id, merged);
          if (ok) {
            removePendingSync(id);
            setAllSubmissions(function(prev) {
              const up = Object.assign({}, prev, { [id]: merged });
              safeSetLocal('music_assessment_submissions', JSON.stringify(up));
              return up;
            });
            showToast('이 기기에 저장해 둔 보고서를 선생님께 전달했습니다. ☁️', 5000);
          }
        } catch (err) {
          console.error('Pending Push Error:', err);
        }
      };

      // 항상 최신 로그인 사용자를 가리키도록 (자동 갱신·실시간 콜백에서 사용)
      const currentUserRef = useRef(currentUser);
      currentUserRef.current = currentUser;

      // 60초마다 자동 갱신 (실시간 알림이 놓친 변경을 보완)
      useEffect(function() {
        if (!supabaseClient) return;
        const tick = function() {
          const u = currentUserRef.current;
          if (!u) return;
          fetchSubmissionsFromCloud(u);
          verifyStudentStillExists(u);
        };
        tick();
        const interval = setInterval(tick, 60000);
        return function() { clearInterval(interval); };
      }, []);

      // [실시간] 바뀐 행만 화면에 반영 (전체를 다시 받지 않음)
      //  - 학생: 내 보고서가 바뀔 때만 / 교사: 모든 학생
      const liveKey = currentUser ? currentUser.role + ':' + currentUser.id : '';
      useEffect(function() {
        if (!supabaseClient || !currentUser) return;
        const isStudent = currentUser.role === 'student';
        let channel = null;
        try {
          const subFilter = { event: '*', schema: 'public', table: 'submissions' };
          if (isStudent) subFilter.filter = 'student_id=eq.' + currentUser.id;
          channel = supabaseClient
            .channel('live-' + liveKey)
            .on('postgres_changes', subFilter, function(payload) {
              if (payload.eventType === 'DELETE') {
                const delId = payload.old && payload.old.student_id;
                if (delId) {
                  setAllSubmissions(function(prev) {
                    if (!prev[delId]) return prev;
                    const up = Object.assign({}, prev);
                    delete up[delId];
                    safeSetLocal('music_assessment_submissions', JSON.stringify(up));
                    return up;
                  });
                }
                return;
              }
              const row = payload.new || {};
              if (!row.student_id) return;
              if (row.data) {
                setAllSubmissions(function(prev) {
                  const up = Object.assign({}, prev, { [row.student_id]: row.data });
                  safeSetLocal('music_assessment_submissions', JSON.stringify(up));
                  return up;
                });
              } else {
                fetchOneFromCloud(row.student_id);
              }
            });
          if (isStudent) {
            // 계정 삭제 알림 (계정 표는 내용이 작아서 전체를 받아도 부담이 없음)
            channel = channel.on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'students' }, function() {
              verifyStudentStillExists(currentUserRef.current);
            });
          }
          channel.subscribe();
        } catch (err) {
          console.error('Realtime Subscribe Error:', err);
        }
        return function() {
          if (channel) supabaseClient.removeChannel(channel);
        };
      }, [liveKey]);

      // [실시간] 학생 화면: 채점 결과가 새로 들어오면 알림 표시
      const lastGradedRef = useRef(null);
      useEffect(function() {
        if (!currentUser || currentUser.role !== 'student') { lastGradedRef.current = null; return; }
        const mine = allSubmissions[currentUser.id];
        const stamp = (mine && mine.grading && mine.grading.gradedAt) || '';
        if (lastGradedRef.current !== null && stamp && stamp !== lastGradedRef.current) {
          showToast('선생님이 보고서를 채점했습니다. [내 보고서] 탭에서 확인하세요. 📝');
        }
        lastGradedRef.current = stamp;
      }, [allSubmissions, currentUser]);

      const updateCurrentUserSession = function(user) {
        setCurrentUser(user);
        if (user) {
          sessionStorage.setItem('music_current_user', JSON.stringify(user));
          // (삭제된 데이터가 되살아나지 않도록, 로그인 시 기기 속 사본을 클라우드로 올리던 자동 백업은 제거함)
        } else {
          sessionStorage.removeItem('music_current_user');
        }
      };

      const [activeReportModal, setActiveReportModal] = useState(false);
      const [reportPlaceholders, setReportPlaceholders] = useState({});
      const [reportForm, setReportForm] = useState({
        slot: 'report1',
        topicCategory: 'inquiry',
        topicTitle: '',
        coreConcept: '',
        hypothesis: '',
        variables: '',
        procedure: '',
        conclusion: '',
        limitations: '',
        brandName: '',
        productTrait: '',
        productHow: '',
        productImpact: '',
        productPrecaution: '',
        popKorean100: Array(11).fill(null).map(function() { return { song: '', history: '' }; }),
        popGlobal100: Array(11).fill(null).map(function() { return { song: '', history: '' }; }),
        popFutureThree: { creator: '', form: '', value: '' },
        ewStep1Theory: '',
        ewStep2Hypothesis: '',
        ewStep3Variables: '',
        ewStep4Empirical: '',
        ewStep5Comparison: '',
        aiLog: { prompt: '', criticalReview: '', screenshotImg: '' }
      });

      // =========================================================
      // [학생 계정] Supabase 'students' 표에 저장 (어느 기기에서든 같은 학번으로 로그인)
      // =========================================================

      // 예전 방식(기기 안에만 저장된) 계정 목록: 클라우드로 옮길 때만 사용
      const getStudentAccounts = function() {
        try {
          const s = localStorage.getItem('music_student_accounts');
          return s ? JSON.parse(s) : {};
        } catch(err) { return {}; }
      };

      const cacheLocalAccount = function(id, name, pw) {
        const accs = getStudentAccounts();
        accs[id] = { id: id, name: name, pw: pw };
        safeSetLocal('music_student_accounts', JSON.stringify(accs));
      };

      // 서버가 느릴 때 기다리는 중임을 알려 줌
      const startSlowNotice = function() {
        let done = false;
        const timer = setTimeout(function() {
          if (!done) showToast('서버 응답이 느립니다. 최대 30초까지 기다리는 중이에요…', 26000);
        }, 4000);
        return function() { done = true; clearTimeout(timer); };
      };

      const ACCOUNT_STORE_ERROR = '학생 계정 저장소(students 표)에 연결할 수 없습니다. 잠시 후 다시 시도하고, 계속되면 선생님께 알려 주세요.';

      const cloudGetAccount = function(id) {
        return withTimeout(supabaseClient.from('students').select('*').eq('student_id', String(id)).maybeSingle());
      };

      // 오류 안내: 시간 초과인지, Supabase가 돌려준 오류인지 구분해서 보여 줌
      const showAccountError = function(err) {
        if (err && err.message === 'TIMEOUT') {
          showToast('클라우드 응답이 없습니다(30초 초과). 서버 점검 중일 수 있으니 잠시 후 다시 시도해 주세요.', 6000);
          return;
        }
        const detail = err && (err.message || err.code) ? ' (' + (err.code ? err.code + ': ' : '') + (err.message || '') + ')' : '';
        showToast(ACCOUNT_STORE_ERROR + detail, 7000);
      };

      // 이 기기에 남아 있는 해당 학생의 계정·보고서 사본 지우기
      const purgeLocalStudent = function(id) {
        removePendingSync(id);
        const accs = getStudentAccounts();
        if (accs[id]) {
          delete accs[id];
          safeSetLocal('music_student_accounts', JSON.stringify(accs));
        }
        setAllSubmissions(function(prev) {
          if (!prev[id]) return prev;
          const up = Object.assign({}, prev);
          delete up[id];
          safeSetLocal('music_assessment_submissions', JSON.stringify(up));
          return up;
        });
      };

      // 예전 방식 계정 옮기기: 이 기기에 계정이 있고, 클라우드에 그 학생의 보고서 기록이 남아 있을 때만
      // (선생님이 삭제한 학생은 보고서 기록도 없으므로 되살아나지 않음)
      const migrateLegacyAccount = async function(id) {
        const local = getStudentAccounts()[id];
        if (!local) return null;
        // 오프라인 모드에서 이 기기로 가입·작성해 둔 학생이면 클라우드 기록이 없어도 옮김
        const isPending = getPendingSync().indexOf(String(id)) !== -1;
        if (!isPending) {
          const subRes = await withTimeout(supabaseClient.from('submissions').select('student_id').eq('student_id', String(id)).maybeSingle());
          if (subRes.error || !subRes.data) return null;
        }
        const acc = { student_id: String(id), name: local.name, pw: local.pw };
        const ins = await withTimeout(supabaseClient.from('students').upsert(acc, { onConflict: 'student_id' }));
        return ins.error ? null : acc;
      };

      // 로그인 중인 학생의 계정이 클라우드에 아직 있는지 확인. 없으면 로그아웃하고 기기 속 사본 삭제
      // 반환값: 계정이 있으면 true, 삭제되어 로그아웃했으면 false (연결 오류일 때는 true로 두어 작업을 막지 않음)
      const verifyStudentStillExists = async function(user) {
        if (!supabaseClient || !user || user.role !== 'student') return true;
        try {
          const res = await cloudGetAccount(user.id);
          if (res.error) return true;
          if (res.data || await migrateLegacyAccount(user.id)) {
            pushPendingForStudent(user.id);
            return true;
          }
        } catch (err) {
          return true;
        }
        purgeLocalStudent(user.id);
        updateCurrentUserSession(null);
        setActiveReportModal(false);
        setMainTab('inquiry');
        showToast('삭제되었거나 변경된 계정입니다. 선생님께 문의하세요.');
        return false;
      };

      const handleStudentRegister = async function(ev) {
        ev.preventDefault();
        if (!/^\d{4}$/.test(studentIdInput)) { showToast('학번은 4자리 숫자여야 합니다.'); return; }
        if (!studentNameInput.trim()) { showToast('성명을 입력해 주세요.'); return; }
        if (!/^\d{4}$/.test(studentPwInput)) { showToast('비밀번호는 4자리 숫자여야 합니다.'); return; }
        const id = studentIdInput;
        const name = studentNameInput.trim();

        // [오프라인 모드] 이 기기에만 계정을 만들고, 서버 복구 후 첫 접속 때 클라우드로 옮김
        if (OFFLINE_MODE) {
          if (getStudentAccounts()[id]) { showToast('이 기기에 이미 등록된 학번입니다. [로그인]으로 들어가 주세요.'); return; }
          cacheLocalAccount(id, name, studentPwInput);
          const offSub = loadLocalSubmissions()[id] || { studentId: id, studentName: name, reports: {} };
          setAllSubmissions(function(prev) {
            const up = Object.assign({}, prev, { [id]: offSub });
            safeSetLocal('music_assessment_submissions', JSON.stringify(up));
            return up;
          });
          addPendingSync(id);
          updateCurrentUserSession({ role: 'student', id: id, name: name });
          setIsRegisterMode(false);
          showToast(name + ' 님, 이 기기에 등록되었습니다. (오프라인 모드: 같은 기기에서 이어서 작성하세요)', 5000);
          return;
        }

        if (!supabaseClient) { showToast(ACCOUNT_STORE_ERROR, 6000); return; }
        if (authBusy) return;

        setAuthBusy(true);
        const stopSlow = startSlowNotice();
        try {
          const accRes = await cloudGetAccount(id);
          if (accRes.error) { showAccountError(accRes.error); return; }
          if (accRes.data) { showToast('이미 등록된 학번입니다. [로그인]으로 들어가 주세요.'); return; }

          // 계정은 없는데 보고서 기록만 있는 학번 = 예전 방식으로 다른 기기에서 가입한 학생
          const subRes = await withTimeout(supabaseClient.from('submissions').select('student_id').eq('student_id', String(id)).maybeSingle());
          if (subRes.data) {
            showToast('이미 기록이 있는 학번입니다. 처음 가입한 기기에서 로그인하거나 선생님께 문의하세요.');
            return;
          }

          const ins = await withTimeout(supabaseClient.from('students').insert({ student_id: String(id), name: name, pw: studentPwInput }));
          if (ins.error) { showAccountError(ins.error); return; }
        } catch (err) {
          showAccountError(err);
          return;
        } finally {
          stopSlow();
          setAuthBusy(false);
        }

        // 삭제 후 같은 학번으로 다시 가입한 경우에도 이전 내용 없이 빈 상태로 시작
        purgeLocalStudent(id);
        const initSub = { studentId: id, studentName: name, reports: {} };
        setAllSubmissions(function(prev) {
          const up = Object.assign({}, prev, { [id]: initSub });
          safeSetLocal('music_assessment_submissions', JSON.stringify(up));
          return up;
        });
        syncStudentToCloud(id, initSub);
        cacheLocalAccount(id, name, studentPwInput);

        updateCurrentUserSession({ role: 'student', id: id, name: name });
        setIsRegisterMode(false);
        showToast(name + ' 님, 등록 및 로그인 완료! (클라우드 연동됨) ☁️');
      };

      const handleStudentLogin = async function(ev) {
        ev.preventDefault();
        const id = studentIdInput;

        // [오프라인 모드] 이 기기에 저장된 계정으로만 로그인
        if (OFFLINE_MODE) {
          const localAcc = getStudentAccounts()[id];
          if (!localAcc) { showToast('이 기기에 등록되지 않은 학번입니다. 오프라인 모드에서는 [최초 등록하기]로 이 기기에 등록해 주세요.', 5000); return; }
          if (localAcc.pw !== studentPwInput) { showToast('비밀번호가 일치하지 않습니다.'); return; }
          updateCurrentUserSession({ role: 'student', id: id, name: localAcc.name });
          showToast(localAcc.name + ' 님, 환영합니다! (오프라인 모드)');
          return;
        }

        if (!supabaseClient) { showToast(ACCOUNT_STORE_ERROR, 6000); return; }
        if (authBusy) return;
        let acc = null;
        setAuthBusy(true);
        const stopSlow = startSlowNotice();
        try {
          const res = await cloudGetAccount(id);
          if (res.error) { showAccountError(res.error); return; }
          acc = res.data;
          // 예전 방식 계정이면 이번 로그인 때 클라우드로 옮김 (비밀번호가 맞을 때만)
          if (!acc) {
            const local = getStudentAccounts()[id];
            if (local && local.pw === studentPwInput) acc = await migrateLegacyAccount(id);
          }
        } catch (err) {
          showAccountError(err);
          return;
        } finally {
          stopSlow();
          setAuthBusy(false);
        }

        if (!acc) {
          purgeLocalStudent(id);

      // AI 캡처 사진: 가로 최대 1280px JPEG로 줄여서 저장 (기기 저장 공간과 서버 부담을 줄임)
      const handleImageUpload = function(ev) {
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;
        if (file.size > 10 * 1024 * 1024) {
          showToast('사진 용량은 10MB 이하만 등록 가능합니다.');
          return;
        }
        const applyImage = function(dataUrl) {
          setReportForm(function(prev) {
            return Object.assign({}, prev, { aiLog: Object.assign({}, prev.aiLog, { screenshotImg: dataUrl }) });
          });
          showToast('AI 대화 캡처 사진이 정상 등록되었습니다! 📸');
        };
        const reader = new FileReader();
        reader.onload = function(uploadEv) {
          const original = uploadEv.target.result;
          const img = new Image();
          img.onload = function() {
            try {
              const scale = Math.min(1, 1280 / img.width);
              const canvas = document.createElement('canvas');
              canvas.width = Math.round(img.width * scale);
              canvas.height = Math.round(img.height * scale);
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              applyImage(canvas.toDataURL('image/jpeg', 0.75));
            } catch (err) {
              if (file.size <= 2 * 1024 * 1024) applyImage(original);
              else showToast('사진을 처리하지 못했습니다. 2MB 이하의 PNG·JPG 사진으로 다시 올려 주세요.', 5000);
            }
          };
          img.onerror = function() {
            if (file.size <= 2 * 1024 * 1024) applyImage(original);
            else showToast('사진을 읽지 못했습니다. PNG·JPG 형식으로 다시 올려 주세요.', 5000);
          };
          img.src = original;
        };
        reader.readAsDataURL(file);
      };

      const openSlotViewer = function(s, slot) {

      // slots: 이번에 채점할 과제 목록 (['report1'], ['report2'], 또는 둘 다). 나머지 과제의 기존 점수는 그대로 둠
      const saveGrading = async function(studentId, slots) {
        if (!studentId) return;
        let target = allSubmissions[studentId];
        if (!target) return;

        // 채점 직전에 클라우드에서 학생의 최신 보고서를 가져와 기준으로 삼음
        if (supabaseClient) {
          try {
            const res = await supabaseClient.from('submissions').select('data').eq('student_id', String(studentId)).maybeSingle();
            if (res.data && res.data.data) target = res.data.data;
          } catch (err) {
            console.error('Cloud Report Read Error:', err);
          }
        }

        const nowStr = new Date().toLocaleString('ko-KR');
        const prevGrading = target.grading || {};

        // 과제별 채점 정보: 학생이 다시 제출(내용 수정)한 뒤 채점하면 차수가 1씩 올라감
        const buildSlotGrade = function(slot, key, score) {
          const rep = target.reports && target.reports[slot];
          const legacy = prevGrading[slot === 'report1' ? 'score1' : 'score2'];
          const prev = prevGrading[key] || (rep && legacy !== undefined ? { score: legacy, round: 1, reportVersion: rep.updatedAt, gradedAt: prevGrading.gradedAt } : null);
          if (slots.indexOf(slot) === -1 || !rep) return prev;
          const sameVersion = prev && prev.reportVersion === rep.updatedAt;
          const n = slot === 'report1' ? '1' : '2';
          return {
            score: score,
            content: Number(gradingForm['r' + n + '_content']),
            analysis: Number(gradingForm['r' + n + '_analysis']),
            comment: (gradingForm['r' + n + '_comment'] || '').trim(),
            round: prev ? (sameVersion ? prev.round : prev.round + 1) : 1,
            reportVersion: rep.updatedAt,
            gradedAt: nowStr
          };
        };

        const r1Grade = buildSlotGrade('report1', 'r1', Number(gradingForm.r1_content) + Number(gradingForm.r1_analysis));
        const r2Grade = buildSlotGrade('report2', 'r2', Number(gradingForm.r2_content) + Number(gradingForm.r2_analysis));
        const score1 = r1Grade ? r1Grade.score : undefined;
        const score2 = r2Grade ? r2Grade.score : undefined;
        const total = (score1 || 0) + (score2 || 0);

        const updatedStudent = Object.assign({}, target, {
          grading: Object.assign({}, gradingForm, {
            r1: r1Grade,
            r2: r2Grade,
            score1: score1,
            score2: score2,
            totalScore: (r1Grade || r2Grade) ? total : undefined,
            gradedAt: slots.length ? nowStr : prevGrading.gradedAt
          })
        });

        setAllSubmissions(function(prev) {
          const up = Object.assign({}, prev, { [studentId]: updatedStudent });
          safeSetLocal('music_assessment_submissions', JSON.stringify(up));
          return up;
        });

        // 채점 결과도 클라우드에 영구 저장
        syncStudentToCloud(studentId, updatedStudent);

        setGradingStudentId(null);
        setSlotViewer(null);
        const which = slots.length === 1 ? ('과제 ' + (slots[0] === 'report1' ? '1' : '2') + ' ') : '';
        showToast(target.studentName + ' 학생 ' + which + '채점이 저장되었습니다. (총점 ' + total + '점 / 60점) 🌟');
      };

      // [신규] 교사용 개별 학생 정보 수정 저장 (학번/이름 변경)
      const saveStudentInfoEdit = async function(ev) {
        ev.preventDefault();
        if (!editingStudentTargetId) return;
        const oldId = editingStudentTargetId;
        const newId = editingStudentForm.id.trim();
        const newName = editingStudentForm.name.trim();

        if (!/^\d{4}$/.test(newId)) {
          showToast('학번은 4자리 숫자여야 합니다.');
          return;
        }
        if (!newName) {
          showToast('성명을 입력해 주세요.');
          return;
        }

        const targetData = allSubmissions[oldId];
        if (!targetData) return;

        // 비밀번호는 그대로 유지: 클라우드 계정 → (없으면) 이 기기의 예전 계정 → 0000 순서
        const accs = getStudentAccounts();
        let currentPw = (accs[oldId] && accs[oldId].pw) || '0000';
        if (supabaseClient) {
          try {
            const oldAcc = await cloudGetAccount(oldId);
            if (oldAcc.error) { showAccountError(oldAcc.error); return; }
            if (oldAcc.data) currentPw = oldAcc.data.pw;
            if (oldId !== newId) {
              const dup = await cloudGetAccount(newId);
              if (dup.data || allSubmissions[newId]) {
                showToast('변경하려는 학번(' + newId + ')이 이미 존재합니다.');
                return;
              }
            }
          } catch (err) {
            showAccountError(err);
            return;
          }
        }

        if (accs[oldId] || accs[newId]) {
          delete accs[oldId];
          safeSetLocal('music_student_accounts', JSON.stringify(accs));
        }

        const updatedTarget = Object.assign({}, targetData, {
          studentId: newId,
          studentName: newName
        });

        const upSubs = Object.assign({}, allSubmissions);
        delete upSubs[oldId];
        upSubs[newId] = updatedTarget;

        setAllSubmissions(upSubs);
        safeSetLocal('music_assessment_submissions', JSON.stringify(upSubs));

        if (supabaseClient) {
          try {
            // 새 계정·보고서를 먼저 만들고, 그다음 옛 학번의 보고서·계정을 지움
            await supabaseClient.from('students').upsert({ student_id: String(newId), name: newName, pw: currentPw }, { onConflict: 'student_id' });
            await syncStudentToCloud(newId, updatedTarget);
            if (oldId !== newId) {
              await supabaseClient.from('submissions').delete().eq('student_id', String(oldId));
              await supabaseClient.from('students').delete().eq('student_id', String(oldId));
            }
          } catch(err) {
            console.error('Student Edit Cloud Error:', err);
          }
        }

        setEditingStudentModal(false);
        setEditingStudentTargetId(null);
        showToast(newName + ' 학생 정보가 성공적으로 수정되었습니다! ✏️');
      };

      const deleteSingleStudent = async function() {
        if (!editingStudentTargetId) return;
        const target = allSubmissions[editingStudentTargetId];
        const sName = (target && target.studentName) || editingStudentTargetId;

        const c = prompt(

          '삭제하려면 "삭제"라고 입력하세요.'
        );

        if (c !== '삭제') {
          showToast('삭제가 취소되었습니다.');
          return;
        }

        const targetId = editingStudentTargetId;

        const accs = getStudentAccounts();
        delete accs[targetId];
        safeSetLocal('music_student_accounts', JSON.stringify(accs));

        const upSubs = Object.assign({}, allSubmissions);
        delete upSubs[targetId];
        setAllSubmissions(upSubs);
        safeSetLocal('music_assessment_submissions', JSON.stringify(upSubs));

        let cloudFailed = false;
        if (supabaseClient) {
          try {
            // 보고서를 먼저 지운 뒤 계정을 지움 (학생 기기에서 계정이 다시 옮겨지는 일을 막기 위한 순서)
            const r1 = await supabaseClient.from('submissions').delete().eq('student_id', String(targetId));
            const r2 = await supabaseClient.from('students').delete().eq('student_id', String(targetId));
            cloudFailed = !!(r1.error || r2.error);
          } catch(err) {
            console.error('Student Delete Cloud Error:', err);

          }

        showToast(cloudFailed

      const downloadCSV = function() {

        Object.values(allSubmissions).forEach(function(s) {
          const r1 = s.reports && s.reports.report1;

          const sc1 = s.grading && s.grading.score1 !== undefined ? s.grading.score1 : '-';

          const total = s.grading && s.grading.totalScore !== undefined ? s.grading.totalScore : '미채점';

          rows.push([
            s.studentId,

            r1 ? ('"' + (r1.topicTitle || '').replace(/"/g, '""') + '"') : '미선택',

            total,
            '"' + ((s.grading && s.grading.teacherFeedback) || '').replace(/"/g, '""') + '"'

        });
        const blob = new Blob(['\uFEFF' + rows.map(function(r) { return r.join(','); }).join('\n')], { type: 'text/csv;charset=utf-8;' });
