      // 5. 과학 (10선)
      { id: 'sc_1', subjectId: 'science', subjectName: '과학', question: '공간 구조와 흡음재 재질에 따른 소리 잔향 시간(RT60) 감쇠 차이는?', concept: '물리학 파동의 반사와 흡수, 세이빈(Sabine) 공식, 음향 에너지 감쇠율', hypothesis: '벽면 마감재의 다공성 흡음률이 높고 공간 체적이 작을수록, 소리 반사가 줄어들어 기준 음압(-60dB) 도달 시간(RT60)이 단축될 것이다.', variables: '독립변인: 공간 유형(타일 화장실 vs 커튼 친 음악실 vs 빈 교실) / 종속변인: 잔향 시간 RT60(초) / 통제변인: 음원 강도(동일 풍선 터뜨림 충격음), 마이크-음원 간 거리(2m 고정)', activity: '스마트폰 물리 실험 앱(Phyphox)의 음향 감쇠 측정기를 활용해 3회 반복 실측 후 평균 감쇠 곡선 작성' },
      { id: 'sc_2', subjectId: 'science', subjectName: '과학', question: '금속 실로폰과 나무 실로폰(마림바)의 소리 여운(서스테인) 길이는 왜 다를까?', concept: '탄성 계수, 밀도, 내부 마찰, 감쇠 진동', hypothesis: '금속(알루미늄 합금)은 목재(로즈우드)보다 재질 내부의 에너지 손실률이 낮아 음압 반감기 시간이 2배 이상 길 것이다.', variables: '독립변인: 타악기 막대 재질(금속 vs 목재) / 종속변인: 음압이 -20dB 감쇠할 때까지 걸린 시간(초) / 통제변인: 동일 음높이(C5), 동일 타격 강도', activity: '오디오 분석 앱으로 두 악기의 타격 파형 엔벨로프(Envelope)를 캡처하여 감쇠 계수 계산' },
      { id: 'sc_3', subjectId: 'science', subjectName: '과학', question: '유리병에 물을 채워 불 때와 두드릴 때 소리 높낮이가 반대로 바뀌는 물리적 원리는?', concept: '정상파, 기주 공명(공기 기둥) vs 고체 탄성 진동(물과 유리)', hypothesis: '불 때는 공기 기둥 길이가 짧을수록 고음이 나고, 두드릴 때는 전체 질량(물 양)이 적을수록 고음이 날 것이다.', variables: '독립변인: 병 속 수면 높이(0cm~15cm, 3cm 간격) / 종속변인: 입으로 불었을 때의 주파수(Hz) vs 스푼으로 두드렸을 때의 주파수(Hz) / 통제변인: 동일 규격 유리병', activity: '수위를 조절하며 튜너 앱으로 주파수를 측정하고 기주 공명 공식과 역학 진동 공식으로 역전 현상 규명' },
      { id: 'sc_4', subjectId: 'science', subjectName: '과학', question: '사이렌을 울리며 지나가는 앰뷸런스 소리의 도플러 효과(Doppler Effect) 주파수 변이 실측', concept: '파동의 도플러 효과, 상대 속도, 음파 압축', hypothesis: '다가올 때 측정되는 주파수와 멀어질 때의 주파수 차이를 이용해 차량의 이동 속력을 오차 10% 이내로 추정할 수 있을 것이다.', variables: '독립변인: 관측 지점 통과 전/후 구간 / 종속변인: 피크 주파수(Hz) / 통제변인: 음원 차량의 일정한 주행 속도', activity: '도로변에서 스마트폰 스펙트로그램으로 지나가는 소방차 사이렌의 진동수 변화를 측정해 속력 역산' },
      { id: 'sc_5', subjectId: 'science', subjectName: '과학', question: '노이즈 캔슬링(Active Noise Cancellation) 이어폰의 위상 반전 간섭 효과 실험', concept: '파동의 간섭, 상쇄 간섭, 위상차(pi rad, 180도)', hypothesis: '기준 소음과 정반대 위상(180도 위상차)을 갖는 역위상 음파를 중첩하면 특정 저주파 대역 소음이 20dB 이상 상쇄될 것이다.', variables: '독립변인: 역위상 음파 출력 유무 / 종속변인: 마이크 수신 음압 레벨(dB) / 통제변인: 200Hz 단일 저주파 소음', activity: '스피커 2대에서 정위상과 역위상 사운드를 동시 출력하여 소음 감소율 실측' },
      { id: 'sc_6', subjectId: 'science', subjectName: '과학', question: '바이올린과 플루트가 같은 음(A4=440Hz)을 낼 때 음색(Timbre)이 다른 원인과 배음 구조', concept: '푸리에 변환(FFT), 기본 주파수, 배음(Harmonics), 스펙트럼 포락선', hypothesis: '바이올린은 현의 찰현 특성상 고차 배음이 풍부하게 나타나고, 플루트는 기본음 중심의 순음에 가까운 스펙트럼을 보일 것이다.', variables: '독립변인: 악기 종류(바이올린 vs 플루트) / 종속변인: 배음 번호별(1~8차) 상대적 진폭 강도(dB) / 통제변인: 동일 음높이 A4(440Hz), 동일 음량', activity: '스펙트럼 분석 앱으로 두 악기의 배음 피크 그래프를 캡처하여 배음 분포 차이 증명' },
      { id: 'sc_7', subjectId: 'science', subjectName: '과학', question: '온도와 습도 변화가 관악기(리코더)의 음높이(조율 피치)에 미치는 기체역학적 영향', concept: '기체 분자 운동론, 매질 내 음속 공식 v = 331.5 + 0.6t', hypothesis: '기온이 올라가면 공기 중 음속이 빨라져 관의 공명 주파수가 증가하므로 리코더 음정이 높아질 것이다.', variables: '독립변인: 실내 기온(10도 vs 25도 vs 35도) / 종속변인: 리코더 C5 연주 시 주파수 편차(Cent) / 통제변인: 호흡의 세기, 운지법', activity: '냉난방 환경에서 리코더를 연주하며 디지털 튜너로 센트(Cent) 오차를 실측하고 음속 공식과 대조' },
      { id: 'sc_8', subjectId: 'science', subjectName: '과학', question: '골전도 이어폰과 공기전도 이어폰의 청각 경로 및 주파수 응답 특성 비교', concept: '청각 생리학, 골도 청각(측두골 진동) vs 기도 청각(고막-이소골)', hypothesis: '골전도 방식은 외이도를 막지 않아 주변음 청취가 가능하지만, 고주파수(8kHz 이상) 전달 효율은 공기전도보다 낮을 것이다.', variables: '독립변인: 음향 전달 방식(골전도 vs 일반 커널형) / 종속변인: 주파수 대역별(100Hz~10kHz) 가청 최소 음압 역치(dB) / 통제변인: 동일 피험자', activity: '청력 테스트 앱을 이용해 두 방식의 가청 주파수 반응 곡선을 비교 도식화' },
      { id: 'sc_9', subjectId: 'science', subjectName: '과학', question: '클라디니(Chladni) 판 진동 실험으로 시각화한 음파의 2차원 정상파 마디선 패턴', concept: '음향학, 2차원 정상파, 고유 진동 모드, 마디선(Nodal lines)', hypothesis: '주파수가 높아질수록 금속판 위의 소금이 모이는 마디선 격자 무늬가 기하학적으로 더 복잡하고 조밀해질 것이다.', variables: '독립변인: 입력 오디오 주파수(Hz) / 종속변인: 형성된 정상파 기하학 도형의 마디 영역 개수 / 통제변인: 금속판 크기 및 재질, 모래 입자 크기', activity: '주파수 생성기 앱과 우퍼 스피커 위에 금속판을 올리고 고운 소금을 뿌려 주파수별 클라디니 도형 촬영' },
      { id: 'sc_10', subjectId: 'science', subjectName: '과학', question: '식물의 생장 속도에 미치는 특정 주파수(그린음악) 및 데시벨 노출의 생물학적 영향', concept: '식물생리학, 세포벽 기계자극(Mechanoperception), 유전자 발현', hypothesis: '1000Hz 내외의 적정 음압(70dB) 고주파 사운드는 식물의 기공 개폐를 촉진하여 무음 대조군보다 콩나물 줄기 생장 속도가 빠를 것이다.', variables: '독립변인: 음향 노출 조건(무음 vs 1000Hz 그린음악 일일 2시간 vs 100dB 록 음악) / 종속변인: 7일간 콩나물 줄기 길이(cm) 및 생체중(g) / 통제변인: 일조량, 급수량, 온도', activity: '콩나물 재배 키트 3세트를 암실에서 동일 조건으로 키우며 매일 버니어캘리퍼스로 생장 길이 실측' },

      // 6. 한국사 (10선)
      { id: 'hi_1', subjectId: 'history', subjectName: '한국사', question: '세종대왕은 왜 신하들의 반대를 무릅쓰고 박연과 함께 아악(편경)을 정비했을까?', concept: '조선 전기 예악(禮樂) 정치, 경석(磬石) 국산화, 국가 표준 도량형과 율관의 일치', hypothesis: '세종의 음악 정비는 단순한 예술 사업이 아니라, 명나라에 대한 문화적 자주성을 확립하고 황종관을 기준으로 국가 도량형(길이·부피·무게)을 표준화하려는 통치 제도 개혁이었을 것이다.', variables: '비교 대상: 세종실록 악지(편경 제작 기록) vs 고려사 악지(송나라 수입 아악 기록) / 분석 관점: 자주성, 악기 재료(남양 경석), 도량형 연동성', activity: '세종실록 기사를 발췌 분석하여 황종 율관 제작과 도량형 통일의 상관관계를 도표로 작성' },
      { id: 'hi_2', subjectId: 'history', subjectName: '한국사', question: '조선 후기 농업 생산력 증대(이앙법)와 두레 풍물굿·노동요의 확산 관계', concept: '조선 후기 경제 변동, 광작, 이앙법(모내기), 두레 공동체, 상사소리', hypothesis: '이앙법 보급으로 특정 시기 집중 노동력이 필요해짐에 따라, 노동 피로를 줄이고 협동심을 높이는 두레 풍물과 모내기 노동요가 전국적으로 표준화되었을 것이다.', variables: '독립변인: 지역별 이앙법 보급 시기 / 종속변인: 두레 노동요 사설의 정형화 정도 / 통제변인: 조선 후기 문헌 기록(농가월령가 등)', activity: '지역별 노동요 채록 음원을 듣고 박자와 모내기 손동작 타이밍의 역학적 일치성 분석' },
      { id: 'hi_3', subjectId: 'history', subjectName: '한국사', question: '1970년대 박정희 유신 체제 하 대중가요 금지곡 지정 사유와 청년 저항 문화', concept: '유신 체제, 긴급조치 9호, 가요정화운동, 청년 포크 문화', hypothesis: '금지 사유로 내세운 방송부적격(허무주의, 퇴폐)은 표면적 명분이었으며, 실제로는 통제에 순응하지 않는 청년 통기타 문화의 자생적 비판성을 억압하기 위함이었을 것이다.', variables: '독립변인: 1975년 공연활동정화위원회 금지곡 목록 200여 곡 / 종속변인: 공식 금지 사유 분류(퇴폐/월북/가사결함)와 실제 가사 내용 대조 / 통제변인: 1970년대 음원', activity: '대표 금지곡(아침이슬, 미인, 왜 불러)의 노랫말을 분석하고 당시 정부 공문서 금지 사유와 대조 보고서 작성' },
      { id: 'hi_4', subjectId: 'history', subjectName: '한국사', question: '일제강점기 윤심덕의 〈사의 찬미〉(1926) 대히트와 식민지 청년들의 허무주의 정서', concept: '일제 강점기 근대 대중가요 형성, 신파, 허무주의, 서양 왈츠 수용', hypothesis: '서양 왈츠 선율(도나우강의 잔물결)에 붙인 비관적 노랫말의 폭발적 인기는 일제 무단통치 이후 3·1 운동 좌절로 만연했던 지식인층의 절망감이 투영된 결과일 것이다.', variables: '독립변인: 사의 찬미 가사 어휘의 감정가(허무/죽음) / 종속변인: 1920년대 유성기 음반 판매량 및 당시 신문 기사 반응 / 통제변인: 1920년대 발매 가요', activity: '원곡 루마니아 왈츠의 경쾌한 리듬과 윤심덕 가창 음원의 템포·단조화된 비장미를 음향 비교' },
      { id: 'hi_5', subjectId: 'history', subjectName: '한국사', question: '고려 공민왕 대 원나라의 간섭을 벗어나기 위한 향악(우리 음악) 복원 노력', concept: '고려 후기 반원 자주 개혁, 당악과 향악, 예악 제도', hypothesis: '몽골풍(원나라 간섭)을 배격하는 과정에서 아악과 향악을 재정비한 것은 국가 정통성을 회복하려는 정치적 의도와 직결되었을 것이다.', variables: '독립변인: 원 간섭기 궁중 음악 목록 vs 공민왕 대 정비 목록 / 종속변인: 향악 악기 및 고려가요 연주 비중 / 통제변인: 고려사 악지 사료', activity: '고려사 악지 사료를 비교하여 자주적 개혁 조치와 악곡 편성 변화의 상관관계 정리' },
      { id: 'hi_6', subjectId: 'history', subjectName: '한국사', question: '조선 후기 서민 경제 성장과 판소리 8명창의 등장 및 판소리 12마당의 대중화', concept: '신분제 동요, 서민 문화, 장시 발달, 광대 집단, 판소리 유파', hypothesis: '조선 후기 장시(시장)의 발달과 상업 자본 축적은 판소리 광대들이 양반 후원과 서민 관객을 아우르는 직업 전문 음악인으로 성장하는 물적 토대가 되었을 것이다.', variables: '독립변인: 장시 분포 및 서민 경제 지표 / 종속변인: 판소리 공연 기록 빈도 및 판소리계 소설 판각본 출판 수 / 통제변인: 18~19세기 사료', activity: '조선 후기 시장 지도와 8명창 출신지 및 주요 공연 거점 매핑 분석' },
      { id: 'hi_7', subjectId: 'history', subjectName: '한국사', question: '대한제국 애국가(1902년 에케르트 작곡)와 일제에 의한 강제 폐지 과정', concept: '대한제국 광무개혁, 황제국 위상, 프란츠 폰 에케르트, 군악대', hypothesis: '서양식 군악대를 통해 제정된 대한제국 애국가는 서양 관현악 화성에 국악 백제 5음계를 접목하여 황제국의 자주성을 대외에 선포하려 했을 것이다.', variables: '독립변인: 에케르트 작곡 애국가 선율 분석 / 종속변인: 5음계(궁상각치우) 출현 비율 / 통제변인: 당시 대한제국 관보 공포 악보', activity: '대한제국 애국가 악보를 연주해보고 서양 관악기 편성과 한국 5음계 선율의 융합 구조 분석' },
      { id: 'hi_8', subjectId: 'history', subjectName: '한국사', question: '동학농민운동 당시 불린 구전 민요(새야 새야 파랑새야)의 상징성과 민중 봉기', concept: '동학 농민 운동, 녹두장군 전봉준, 민중 구비 전승, 정치적 은유', hypothesis: '녹두꽃(전봉준)과 파랑새(일본군)의 은유는 단순한 탄식이 아니라 농민군의 군사적 패배에 대한 연민과 저항 의지를 다음 세대로 전승하는 기억 장치였을 것이다.', variables: '독립변인: 파랑새 노래의 지역별 변이 가사 / 종속변인: 전봉준 및 동학 역사적 사건과의 가사 일치율 / 통제변인: 구비문학 채록본', activity: '호남 지방 구전 민요 채록본에서 녹두·청포묵 관련 은유 가사를 추출하여 역사적 연대표와 대조' },
      { id: 'hi_9', subjectId: 'history', subjectName: '한국사', question: '6·25 전쟁기 피란 수도 부산의 대중가요(굳세어라 금순아)와 피란민의 심리적 트라우마 치유', concept: '한국전쟁, 흥남철수, 피란 수도 부산, 대중가요의 위로 기능', hypothesis: '흥남철수와 국제시장 자갈치 골목을 배경으로 한 가요는 흩어진 가족에 대한 생사 확인과 트라우마를 집단적으로 위로하는 정서적 안전지대 역할을 했을 것이다.', variables: '독립변인: 1950년대 피란 가요 가사 속 지명(영도다리, 1·4후퇴 등) / 종속변인: 피란민 구술 생애사 속 가요 언급 빈도 / 통제변인: 1950년대 SP 음반', activity: '전쟁 당시 유행가 가사와 피란민 구술 인터뷰 사료를 대조하여 지명 노랫말의 치유 효과 정리' },
      { id: 'hi_10', subjectId: 'history', subjectName: '한국사', question: '1980년대 5·18 민주화운동과 민중가요 〈임을 위한 행진곡〉의 탄생과 전승 과정', concept: '5·18 민주화운동, 민중가요, 황석영 사설, 김종률 작곡, 민주화 운동의 상징', hypothesis: '임을 위한 행진곡은 합창과 단조 단선율의 힘찬 행진곡풍 리듬을 결합하여, 두려움을 극복하고 집단적 민주주의 연대감을 극대화하도록 구조화되었을 것이다.', variables: '독립변인: 임을 위한 행진곡의 악곡 구조(장식음 배제, 하향 4도 도약) / 종속변인: 집회 현장 청중의 가창 일체감 척도 / 통제변인: 1982년 최초 녹음본', activity: '악보의 4/4박자 다운비트 음정과 가사 억양의 결합 방식을 분석하여 행진곡으로서의 선동·연대 구조 규명' },

      // 7. 체육 (10선)
      { id: 'pe_1', subjectId: 'pe', subjectName: '체육', question: '음악의 BPM과 템포가 운동 시 심박수 및 지구력 유지에 미치는 영향은?', concept: '운동생리학 자율신경계 반응(교감신경 활성화), 주관적 운동 강도(RPE), 보폭 동조 현상', hypothesis: '고BPM(140 이상) 음악은 중추신경계 각성을 유도하고 보폭을 동조시켜, 무음 상태 대비 최대 반복 횟수를 증가시키고 피로 인지도를 낮출 것이다.', variables: '독립변인: 청각 자극 조건(무음 vs 70 BPM 클래식 vs 140 BPM EDM) / 종속변인: 3분 제자리 줄넘기 횟수, 분당 심박수(HR), 운동 자각도(RPE 1~10) / 통제변인: 피험자 체력 수준, 운동 전 휴식 시간(10분)', activity: '스마트워치 심박수 측정기를 착용하고 3가지 음악 조건에서 운동 수행 후 심박 회복 그래프 비교' },
      { id: 'pe_2', subjectId: 'pe', subjectName: '체육', question: '쿨다운(마무리 운동) 시 느린 클래식을 들으면 심박수 회복과 젖산 분해가 빨라질까?', concept: '운동생리학, 부교감 신경 활성화, 젖산 제거율, 심박 회복 시간(HRR)', hypothesis: '60 BPM 내외의 느린 음악은 부교감신경을 자극하여 무음 상태보다 운동 후 최고 심박수가 안정 심박수로 복귀하는 시간을 20% 이상 단축할 것이다.', variables: '독립변인: 쿨다운 배경음악(무음 vs 60 BPM 클래식 vs 130 BPM 팝) / 종속변인: 운동 종료 후 5분간 30초 단위 심박수 감소율 / 통제변인: 고강도 인터벌 러닝 3분 후 측정', activity: '고강도 운동 직후 5분간 스마트워치 심박수 데이터를 10초 단위로 기록해 감쇠 회귀 곡선 작성' },
      { id: 'pe_3', subjectId: 'pe', subjectName: '체육', question: '러닝 시 음악 비트와 러너의 분당 걸음 수(케이던스, Cadence)의 동조화 비율', concept: '신체 운동역학, 청각-운동 동조(Auditory-motor entrainment), 케이던스', hypothesis: '자신의 평소 케이던스와 일치하는 BPM(예: 170~180 BPM)의 음악을 들을 때 걸음 수 편차가 줄어들고 주행 에너지 효율이 극대화될 것이다.', variables: '독립변인: 음악 템포(자신의 케이던스 -20 BPM vs 일치 BPM vs +20 BPM) / 종속변인: 분당 케이던스 변동 표준편차, 1km 달리기 페이스(분/km) / 통제변인: 동일 트랙 코스, 동일 신발', activity: '러닝 앱(Nike Run Club 등)으로 케이던스 데이터를 수집하여 음악 BPM과의 동조율 퍼센티지 산출' },
      { id: 'pe_4', subjectId: 'pe', subjectName: '체육', question: '웨이트 트레이닝(벤치프레스/스쿼트) 시 헤비메탈 음악 청취가 최대 근력(1RM)에 미치는 영향', concept: '신경근육계 흥분도, 아드레날린 분비, 인체 생체역학', hypothesis: '공격적인 고음량 록·메탈 음악은 교감신경 흥분을 유도하여 정적 클래식 청취 대비 순간 최대 악력 및 1RM 중량을 소폭 향상시킬 것이다.', variables: '독립변인: 음악 장르(무음 vs 헤비메탈 vs 모차르트 피아노곡) / 종속변인: 악력계 최대 악력 수치(kg), 스쿼트 최대 반복 횟수 / 통제변인: 휴식 시간(세트 간 3분 고정)', activity: '디지털 악력계를 이용해 3가지 음악 조건에서 3회씩 측정 후 평균 최대 악력 t-검정 비교' },
      { id: 'pe_5', subjectId: 'pe', subjectName: '체육', question: '리듬 체조 및 피겨 스케이팅 음악의 악센트와 기술 요소(점프·회전)의 싱크로율 분석', concept: '동작 분석학, 안무 일치도, 음악적 악센트(Musical Accent)', hypothesis: '올림픽 메달리스트의 경기 영상은 점프 도약과 착지 순간이 음악의 오케스트라 투티(Tutti) 타격점과 90% 이상 일치할 것이다.', variables: '독립변인: 선수 기량 수준(메달리스트 vs 비입상자) / 종속변인: 점프 피크 시점과 음악 악센트 간의 시간 오차(ms) / 통제변인: 동일 규정 프로그램', activity: '동영상 편집 툴에서 프레임 단위(0.03초)로 점프 착지 프레임과 사운드 파형 피크 지점 일치율 측정' },
      { id: 'pe_6', subjectId: 'pe', subjectName: '체육', question: '음악 기반 리듬 줄넘기 훈련이 청소년의 협응성 및 민첩성 향상에 미치는 효과', concept: '운동발달학, 신체 협응성, 민첩성 테스트', hypothesis: '음악 비트에 맞춰 발 동작을 변형하는 리듬 줄넘기는 일반 줄넘기보다 사이드스텝 및 일리노이 민첩성 점수를 유의미하게 향상시킬 것이다.', variables: '독립변인: 4주간 훈련 방식(일반 줄넘기반 vs 음악 리듬 줄넘기반) / 종속변인: 사이드스텝 테스트 횟수 향상도 / 통제변인: 주당 훈련 시간(주 3회 30분 동일)', activity: '4주 사전-사후 민첩성 테스트를 실시하여 두 집단 간 향상도 통계 비교' },
      { id: 'pe_7', subjectId: 'pe', subjectName: '체육', question: '자유투(농구) 및 양궁 발사 직전 선호 음악 청취가 루틴 안정성과 성공률에 미치는 영향', concept: '스포츠 심리학, 프리샷 루틴, 불안 조절, 바이오피드백', hypothesis: '자신이 선호하는 안정적인 음악으로 루틴을 수행한 선수는 무음 조건보다 슈팅 전 심박수 변동이 적고 슛 성공률이 높을 것이다.', variables: '독립변인: 자유투 전 청각 조건(무음 vs 선호 차분한 음악) / 종속변인: 농구 자유투 20회 시도 성공률(%), 발사 전 심박수 / 통제변인: 동일 슈팅 거리', activity: '자유투 20회를 던지며 스마트워치로 심박 안정도와 슛 성공률 상관관계 측정' },
      { id: 'pe_8', subjectId: 'pe', subjectName: '체육', question: '태권도 품새의 힘의 완급 조절과 전통 대취타(징, 북) 장단의 타격 호흡 일치성', concept: '무도학, 발경(發勁), 단전호흡, 대취타 장단', hypothesis: '품새의 지르기·막기 동작은 대취타의 용고(북)와 징이 울리는 강박의 호흡(기합) 타이밍과 역학적 리듬이 정확히 일치할 것이다.', variables: '독립변인: 품새 동작 구간 / 종속변인: 모션 캡처 가속도 최대 지점과 북소리의 싱크로 시간 오차 / 통제변인: 고려 품새 표준 동작', activity: '태권도 지르기 동작 영상과 북 타격음을 오버랩하여 신체 충격량 전달 피크 타임 대조' },
      { id: 'pe_9', subjectId: 'pe', subjectName: '체육', question: '배경음악 음량(dB) 크기가 유산소 운동 중 뇌파(알파파, 베타파)와 몰입도에 미치는 영향', concept: '뇌파학, EEG 분석, 각성 수준, 최적 수행 구역(IZOF)', hypothesis: '85dB 이상의 고음량 음악은 뇌파의 베타파(각성)를 과도하게 높여 피로 인지를 앞당기고, 70dB 중간 음량이 가장 긴 몰입을 유지시킬 것이다.', variables: '독립변인: 이어폰 볼륨(60dB vs 75dB vs 90dB) / 종속변인: 트레드밀 지속 주행 한계 시간, 운동 후 뇌파 피로도 설문 / 통제변인: 시속 8km 고정 주행', activity: '스마트폰 뇌파 센서 밴드를 착용하고 볼륨 크기별 운동 시 집중도 뇌파 변화 측정' },
      { id: 'pe_10', subjectId: 'pe', subjectName: '체육', question: '스트레칭 및 요가 동작 시 음악 템포와 관절 가동 범위(ROM)의 상관관계', concept: '신체 유연성, 고유수용성 감각, 근육 이완, 스트레칭 역학', hypothesis: '자연의 소리(물소리, 50 BPM)가 융합된 앰비언트 음악은 근육 긴장을 이완시켜 무음 상태보다 좌전굴(유연성) 측정값을 유의미하게 증가시킬 것이다.', variables: '독립변인: 스트레칭 시 청각 자극(무음 vs 자연 사운드 vs 120 BPM 팝) / 종속변인: 앉아 윗몸 앞으로 굽히기(좌전굴) cm 증가량 / 통제변인: 스트레칭 수행 시간(10분)', activity: '학급 친구 20명을 대상으로 3가지 음악 청취 후 즉각적인 좌전굴 유연성 수치 변화 측정' },

      // 8. 미술 (10선)
      { id: 'ar_1', subjectId: 'art', subjectName: '미술', question: '밝은 장조와 어두운 단조 음악을 들었을 때 떠오르는 색깔은 정해져 있을까?', concept: '색채 심리학(난색/한색, 채도/명도), 칸딘스키 공감각(Synesthesia), 형태-음색 대응', hypothesis: '다장조 곡은 교감신경을 자극하여 고명도·고채도의 난색(빨강, 노랑) 연상 비율이 높고, 다단조 곡은 한색(파랑, 무채색 계열) 연상 비율이 통계적으로 유의미하게 높을 것이다.', variables: '독립변인: 음악의 조성(모차르트 다장조 피아노 소나타 vs 베토벤 다단조 운명 주제) / 종속변인: 12색 먼셀 색상환 선택 투표수, 선택한 색의 명도/채도 값 / 통제변인: 음원 음량(65dB), 재생 시간(1분)', activity: '학급 친구 20명을 대상으로 블라인드 청취 설문 진행 후 RGB 색상 추출 및 카이제곱 독립성 검증' },
      { id: 'ar_2', subjectId: 'art', subjectName: '미술', question: '악보의 음표 밀도와 쉼표 여백의 시각적 긴장감이 현대 추상화 캔버스 구도와 맺는 관계', concept: '조형 원리(비례, 균형, 율동), 여백의 미, 악보 타이포그래피', hypothesis: '쉼표가 많은 곡의 악보 그래픽은 여백 중심의 동양화 구도와 유사한 시각적 안정감을 형성할 것이다.', variables: '독립변인: 악보 음표 밀도(초당 음표 1개 vs 8개) / 종속변인: 시각적 긴장도 점수(7점 척도) / 통제변인: 악보 폰트 규격', activity: '악보 실루엣을 흑백 픽셀로 변환하여 흑백 면적 비율과 시각적 안정도 상관관계 분석' },

      });

        productImpact: '',

        popTraits: ['', '', ''],

      const showToast = function(msg) {
        setToastMessage(msg);

        try {
          const s = localStorage.getItem('music_student_accounts');
          return s ? JSON.parse(s) : {};

      const handleStudentRegister = function(ev) {
        ev.preventDefault();
        if (!/^\d{4}$/.test(studentIdInput)) { showToast('학번은 4자리 숫자여야 합니다.'); return; }
        if (!studentNameInput.trim()) { showToast('성명을 입력해 주세요.'); return; }
        if (!/^\d{4}$/.test(studentPwInput)) { showToast('비밀번호는 4자리 숫자여야 합니다.'); return; }

        const accs = getStudentAccounts();
        if (accs[studentIdInput]) { showToast('이미 등록된 학번입니다.'); return; }

        accs[studentIdInput] = { id: studentIdInput, name: studentNameInput.trim(), pw: studentPwInput };
        localStorage.setItem('music_student_accounts', JSON.stringify(accs));

        if (!allSubmissions[studentIdInput]) {
          const up = Object.assign({}, allSubmissions, {
            [studentIdInput]: { studentId: studentIdInput, studentName: studentNameInput.trim(), reports: {} }
          });
          setAllSubmissions(up);
          localStorage.setItem('music_assessment_submissions', JSON.stringify(up));
        }

        const newUser = { role: 'student', id: studentIdInput, name: studentNameInput.trim() };
        updateCurrentUserSession(newUser);
        setIsRegisterMode(false);
        showToast(studentNameInput + ' 님, 등록 및 로그인 완료! 🎉');
      };

        ev.preventDefault();
        const accs = getStudentAccounts();

        if (a.pw !== studentPwInput) { showToast('비밀번호가 일치하지 않습니다.'); return; }
        const loggedUser = { role: 'student', id: a.id, name: a.name };
        updateCurrentUserSession(loggedUser);
        showToast(a.name + ' 님, 환영합니다!');
      };

      const handleTeacherLogin = function(ev) {
        ev.preventDefault();
        if (teacherIdInput === teacherAuth.id && teacherPwInput === teacherAuth.pw) {
          const tUser = { role: 'teacher', id: teacherAuth.id, name: '음악과 교사' };

          setShowTeacherModal(false);
          setTeacherIdInput('');
          setTeacherPwInput('');

          setMainTab('teacher_dash');

          showToast('아이디 또는 6자리 비밀번호가 일치하지 않습니다.');
        }
      };

        updateCurrentUserSession(null);

        showToast('로그아웃되었습니다.');

        if (!/^\d{6}$/.test(newTeacherPw)) { showToast('비밀번호는 반드시 6자리 숫자여야 합니다.'); return; }
        const updated = { id: newTeacherId.trim(), pw: newTeacherPw };
        setTeacherAuth(updated);
        localStorage.setItem('music_teacher_auth', JSON.stringify(updated));
        setNewTeacherPw('');
        showToast('교사 아이디와 6자리 비밀번호가 변경되었습니다! 🔒');
      };

      const handleSaveItemEdit = function(ev) {
        ev.preventDefault();
        if (!editingItemForm) return;

        if (editingItemCategory === 'inquiry') {
          const updated = inquiryDataState.map(function(it) { return it.id === editingItemForm.id ? editingItemForm : it; });
          setInquiryDataState(updated);
          localStorage.setItem('music_custom_inquiry_data', JSON.stringify(updated));
        } else if (editingItemCategory === 'product') {
          const updated = productDataState.map(function(it) { return it.id === editingItemForm.id ? editingItemForm : it; });
          setProductDataState(updated);
          localStorage.setItem('music_custom_product_data', JSON.stringify(updated));
        } else if (editingItemCategory === 'pop_history') {
          const updated = popHistoryDataState.map(function(it) { return it.id === editingItemForm.id ? editingItemForm : it; });
          setPopHistoryDataState(updated);
          localStorage.setItem('music_custom_pop_data', JSON.stringify(updated));
        } else if (editingItemCategory === 'east_west') {
          const updated = eastWestDataState.map(function(it) { return it.id === editingItemForm.id ? editingItemForm : it; });
          setEastWestDataState(updated);
          localStorage.setItem('music_custom_eastwest_data', JSON.stringify(updated));
        }

        setActiveItemEditModal(false);
        showToast('항목 내용이 성공적으로 수정·저장되었습니다! ✏️');
      };

      const downloadCSV = function() {
        const rows = [['학번', '성명', '과제1 주제', '과제1 제출', '과제2 주제', '과제2 제출', '총점(60)', '세특 메모']];
        Object.values(allSubmissions).forEach(function(s) {
          const r1 = s.reports && s.reports.report1;
          const r2 = s.reports && s.reports.report2;
          rows.push([
            s.studentId,
            s.studentName,
            r1 ? ('"' + r1.topicTitle.replace(/"/g, '""') + '"') : '미선택',
            r1 && r1.isSubmitted ? '제출' : '미제출',
            r2 ? ('"' + r2.topicTitle.replace(/"/g, '""') + '"') : '미선택',
            r2 && r2.isSubmitted ? '제출' : '미제출',
            s.grading && s.grading.totalScore !== undefined ? s.grading.totalScore : '미채점',
            '"' + ((s.grading && s.grading.teacherFeedback) || '').replace(/"/g, '""') + '"'
          ]);
        });
        const blob = new Blob(['\uFEFF' + rows.map(function(r) { return r.join(','); }).join('\n')], { type: 'text/csv;charset=utf-8;' });

        a.href = url;
        a.download = '송악고_음악수행평가_' + new Date().toISOString().slice(0, 10) + '.csv';
        a.click();
        URL.revokeObjectURL(url);
