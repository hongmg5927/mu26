        concept: '서양 3박자 왈츠 춤곡 대 단조 비가, 한국 근대 보컬의 시김새화',
        comparison: '원곡은 도나우강의 물결을 묘사한 루마니아의 낭만적이고 경쾌한 3박자 서양 무도곡이었으나, 윤심덕은 이를 템포를 늦추고 한국어 모음의 비장한 한숨과 비브라토를 얹어 일제강점기 조선 민중의 애환을 대변하는 비가로 완전히 탈바꿈시킴.',
        activity: '원곡 왈츠 음원과 윤심덕 음원의 템포 및 음표 끌기 시간을 파형 편집기로 실측 대조'
      }
    ];

    function App() {
      const [mainTab, setMainTab] = useState('inquiry');
      const [currentUser, setCurrentUser] = useState(function() {
        try {
          const savedUser = sessionStorage.getItem('music_current_user');
          return savedUser ? JSON.parse(savedUser) : null;
        } catch(err) { return null; }
      });

      const [studentIdInput, setStudentIdInput] = useState('');
      const [studentPwInput, setStudentPwInput] = useState('');
      const [studentNameInput, setStudentNameInput] = useState('');
      const [isRegisterMode, setIsRegisterMode] = useState(false);

      const [showTeacherModal, setShowTeacherModal] = useState(false);
      const [teacherIdInput, setTeacherIdInput] = useState('');
      const [teacherPwInput, setTeacherPwInput] = useState('');
      const [teacherAuth, setTeacherAuth] = useState(function() {
        try {
          const s = localStorage.getItem('music_teacher_auth');
          return s ? JSON.parse(s) : { id: 'admin', pw: '123456' };
        } catch(err) { return { id: 'admin', pw: '123456' }; }
      });

      const [teacherSubTab, setTeacherSubTab] = useState('submissions');

      // 로컬 스토리지 연동 상태
      const [inquiryDataState, setInquiryDataState] = useState(function() {
        try {
          const s = localStorage.getItem('music_custom_inquiry_data');
          return s ? JSON.parse(s) : FULL_INQUIRY_DATA;
        } catch(err) { return FULL_INQUIRY_DATA; }
      });

      const [productDataState, setProductDataState] = useState(function() {
        try {
          const s = localStorage.getItem('music_custom_product_data');
          return s ? JSON.parse(s) : FULL_PRODUCT_REF_DATA;
        } catch(err) { return FULL_PRODUCT_REF_DATA; }
      });

      const [popHistoryDataState, setPopHistoryDataState] = useState(function() {
        try {
          const s = localStorage.getItem('music_custom_pop_data');
          return s ? JSON.parse(s) : FULL_POP_MASTER_DATA;
        } catch(err) { return FULL_POP_MASTER_DATA; }
      });

      const [eastWestDataState, setEastWestDataState] = useState(function() {
        try {
          const s = localStorage.getItem('music_custom_eastwest_data');
          return s ? JSON.parse(s) : FULL_EAST_WEST_DATA;
        } catch(err) { return FULL_EAST_WEST_DATA; }
      });

      const [allSubmissions, setAllSubmissions] = useState(function() {
        try {
          const s = localStorage.getItem('music_assessment_submissions');
          return s ? JSON.parse(s) : {};
        } catch(err) { return {}; }
      });

      const [activeItemEditModal, setActiveItemEditModal] = useState(false);
      const [editingItemCategory, setEditingItemCategory] = useState('');
      const [editingItemForm, setEditingItemForm] = useState(null);

      // 교사용 개별 학생 채점 모달 상태
      const [gradingStudentId, setGradingStudentId] = useState(null);
      const [gradingForm, setGradingForm] = useState({
        r1_content: 15,
        r1_analysis: 15,
        r2_content: 15,
        r2_analysis: 15,
        teacherFeedback: ''
      });

      const [newTeacherId, setNewTeacherId] = useState('');
      const [newTeacherPw, setNewTeacherPw] = useState('');
      const [selectedSubject, setSelectedSubject] = useState('all');
      const [toastMessage, setToastMessage] = useState('');

      const updateCurrentUserSession = function(user) {
        setCurrentUser(user);
        if (user) {
          sessionStorage.setItem('music_current_user', JSON.stringify(user));
        } else {
          sessionStorage.removeItem('music_current_user');
        }
      };

      const [activeReportModal, setActiveReportModal] = useState(false);
      const [reportForm, setReportForm] = useState({
        slot: 'report1',
        topicCategory: 'inquiry',
        topicTitle: '',
        coreConcept: '',
        hypothesis: '',
        variables: '',
        procedure: '',
        conclusion: '',
        brandName: '',
        productTrait: '',
        productHow: '',
        productImpact: '',
        productPrecaution: '', // 상품 개발/사용 시 유의할 점
        popRecords: '',
        popTraits: ['', '', ''],
        popTopSongs: [{ title: '', reason: '' }, { title: '', reason: '' }, { title: '', reason: '' }],
        popFuture: ['', '', ''],
        ewWestern: '',
        ewGugak: '',
        ewComparison: '',
        ewActivity: '',
        aiLog: { prompt: '', criticalReview: '', screenshotImg: '' } // 캡처 사진 지원
      });

      const showToast = function(msg) {
        setToastMessage(msg);
        setTimeout(function() { setToastMessage(''); }, 2500);
      };

      const getStudentAccounts = function() {
        try {
          const s = localStorage.getItem('music_student_accounts');
          return s ? JSON.parse(s) : {};
        } catch(err) { return {}; }
      };

      const handleStudentRegister = function(ev) {
        ev.preventDefault();
        if (!/^\d{4}$/.test(studentIdInput)) { showToast('학번은 4자리 숫자여야 합니다.'); return; }
        if (!studentNameInput.trim()) { showToast('성명을 입력해 주세요.'); return; }
        if (!/^\d{4}$/.test(studentPwInput)) { showToast('비밀번호는 4자리 숫자여야 합니다.'); return; }

        const accs = getStudentAccounts();
        if (accs[studentIdInput]) { showToast('이미 등록된 학번입니다.'); return; }

        accs[studentIdInput] = { id: studentIdInput, name: studentNameInput.trim(), pw: studentPwInput };
        localStorage.setItem('music_student_accounts', JSON.stringify(accs));

        if (!allSubmissions[studentIdInput]) {
          const up = Object.assign({}, allSubmissions, {
            [studentIdInput]: { studentId: studentIdInput, studentName: studentNameInput.trim(), reports: {} }
          });
          setAllSubmissions(up);
          localStorage.setItem('music_assessment_submissions', JSON.stringify(up));
        }

        const newUser = { role: 'student', id: studentIdInput, name: studentNameInput.trim() };
        updateCurrentUserSession(newUser);
        setIsRegisterMode(false);
        showToast(studentNameInput + ' 님, 등록 및 로그인 완료! 🎉');
      };

      const handleStudentLogin = function(ev) {
        ev.preventDefault();
        const accs = getStudentAccounts();
        const a = accs[studentIdInput];
        if (!a) { showToast('등록되지 않은 학번입니다. [최초 등록하기]를 눌러주세요.'); return; }
        if (a.pw !== studentPwInput) { showToast('비밀번호가 일치하지 않습니다.'); return; }
        const loggedUser = { role: 'student', id: a.id, name: a.name };
        updateCurrentUserSession(loggedUser);
        showToast(a.name + ' 님, 환영합니다!');
      };

      const handleTeacherLogin = function(ev) {
        ev.preventDefault();
        if (teacherIdInput === teacherAuth.id && teacherPwInput === teacherAuth.pw) {
          const tUser = { role: 'teacher', id: teacherAuth.id, name: '음악과 교사' };
          updateCurrentUserSession(tUser);
          setShowTeacherModal(false);
          setTeacherIdInput('');
          setTeacherPwInput('');
          setNewTeacherId(teacherAuth.id);
          setMainTab('teacher_dash');
          setTeacherSubTab('submissions');
          showToast('교사 관리자 모드로 접속했습니다. 🛡️');
        } else {
          showToast('아이디 또는 6자리 비밀번호가 일치하지 않습니다.');
        }
      };

      const handleLogout = function() {
        updateCurrentUserSession(null);
        setMainTab('inquiry');
        showToast('로그아웃되었습니다.');
      };

      const handleSaveTeacherAuth = function(ev) {
        ev.preventDefault();
        if (!newTeacherId.trim()) { showToast('교사 아이디를 입력해 주세요.'); return; }
        if (!/^\d{6}$/.test(newTeacherPw)) { showToast('비밀번호는 반드시 6자리 숫자여야 합니다.'); return; }
        const updated = { id: newTeacherId.trim(), pw: newTeacherPw };
        setTeacherAuth(updated);
        localStorage.setItem('music_teacher_auth', JSON.stringify(updated));
        setNewTeacherPw('');
        showToast('교사 아이디와 6자리 비밀번호가 변경되었습니다! 🔒');
      };

      const handleSaveItemEdit = function(ev) {
        ev.preventDefault();
        if (!editingItemForm) return;

        if (editingItemCategory === 'inquiry') {
          const updated = inquiryDataState.map(function(it) { return it.id === editingItemForm.id ? editingItemForm : it; });
          setInquiryDataState(updated);
          localStorage.setItem('music_custom_inquiry_data', JSON.stringify(updated));
        } else if (editingItemCategory === 'product') {
          const updated = productDataState.map(function(it) { return it.id === editingItemForm.id ? editingItemForm : it; });
          setProductDataState(updated);
          localStorage.setItem('music_custom_product_data', JSON.stringify(updated));
        } else if (editingItemCategory === 'pop_history') {
          setPopHistoryDataState(editingItemForm);
          localStorage.setItem('music_custom_pop_data', JSON.stringify(editingItemForm));
        } else if (editingItemCategory === 'east_west') {
          const updated = eastWestDataState.map(function(it) { return it.id === editingItemForm.id ? editingItemForm : it; });
          setEastWestDataState(updated);
          localStorage.setItem('music_custom_eastwest_data', JSON.stringify(updated));
        }

        setActiveItemEditModal(false);
        showToast('항목 내용이 성공적으로 수정·저장되었습니다! ✏️');
      };

      const openItemEditor = function(cat, item) {
        setEditingItemCategory(cat);
        setEditingItemForm(JSON.parse(JSON.stringify(item)));
        setActiveItemEditModal(true);
      };

      const openReportModal = function(categoryType, item, defaultSlot) {
        if (!currentUser) {
          showToast('로그인 후 점검 및 작성을 진행할 수 있습니다.');
          return;
        }
        const userKey = currentUser.role === 'teacher' ? 'teacher_preview' : currentUser.id;
        const sData = allSubmissions[userKey] || { reports: {} };
        const slot = defaultSlot || (!sData.reports || !sData.reports.report1 ? 'report1' : 'report2');
        const ex = sData.reports ? sData.reports[slot] : null;

        setReportForm({
          slot: slot,
          topicCategory: categoryType,
          topicTitle: (ex && ex.topicTitle) || (item && (item.title || item.question || item.name)) || '',
          coreConcept: (ex && ex.coreConcept) || (item && (item.concept || item.koreanHistory)) || '',
          hypothesis: (ex && ex.hypothesis) || (item && item.hypothesis) || '',
          variables: (ex && ex.variables) || (item && item.variables) || '',
          procedure: (ex && ex.procedure) || (item && (item.activity || item.globalComparison)) || '',
          conclusion: (ex && ex.conclusion) || '',
          brandName: (ex && ex.brandName) || (item && (item.brandName || item.name)) || '',
          productTrait: (ex && ex.productTrait) || (item && item.musicTrait) || '',
          productHow: (ex && ex.productHow) || (item && item.howToDevelop) || '',
          productImpact: (ex && ex.productImpact) || (item && item.impact) || '',
          productPrecaution: (ex && ex.productPrecaution) || (item && item.precaution) || '',
          popRecords: (ex && ex.popRecords) || (item && item.koreanHistory) || '',
          popTraits: (ex && ex.popTraits) || [
            '1) 장르: 포크와 트로트에서 댄스 팝, 힙합, 숏폼 중심의 초단축 이지리스닝으로 다변화됨.',
            '2) 매체: LP와 카세트에서 CD, MP3, 스트리밍, 숏폼 알고리즘으로 소비 형태가 이동함.',
            '3) 가사: 시대적 애환과 서정성 중심에서 세계관 스토리텔링 및 챌린지 킬링 파트로 변화함.'
          ],
          popTopSongs: (ex && ex.popTopSongs) || [
            { title: '윤심덕 - 사의 찬미(1926)', reason: '서양 왈츠를 수용한 한국 최초의 근대 대중가요' },
            { title: '서태지와 아이들 - 난 알아요(1992)', reason: '랩과 댄스를 한국 주류에 안착시키며 케이팝 원형 창시' },
            { title: '뉴진스 - Ditto(2022)', reason: '숏폼 친화적 초단축 음원과 뉴트로 이지리스닝의 대표작' }
          ],
          popFuture: (ex && ex.popFuture) || [
            '1) 창작 주체: 인공지능 알고리즘과 생체 신호가 실시간 연동된 맞춤형 사운드 일상화.',
            '2) 음악 형식: 정형화된 절-후렴 탈피 및 1분 미만의 초단축 공간음향 루프 중심 재편.',
            '3) 음악 가치: 기계음 범람에 지친 대중들이 인간의 떨리는 숨소리와 어쿠스틱 원테이크 라이브에 최고 가치 부여.'
          ],
          ewWestern: (ex && ex.ewWestern) || (item ? '서양 음계/기보/지휘 체계 분석' : ''),
          ewGugak: (ex && ex.ewGugak) || (item ? '국악 율명/정간보/호흡 장단 분석' : ''),
          ewComparison: (ex && ex.ewComparison) || (item && item.comparison) || '',
          ewActivity: (ex && ex.ewActivity) || (item && item.activity) || '',
          aiLog: (ex && ex.aiLog) || { prompt: '', criticalReview: '', screenshotImg: '' }
        });
        setActiveReportModal(true);
      };

      // 캡처 이미지 업로드 핸들러
      const handleImageUpload = function(ev) {
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
          showToast('사진 용량은 2MB 이하만 등록 가능합니다.');
          return;
        }
        const reader = new FileReader();
        reader.onload = function(uploadEv) {
          const base64 = uploadEv.target.result;
          setReportForm(Object.assign({}, reportForm, {
            aiLog: Object.assign({}, reportForm.aiLog, { screenshotImg: base64 })
          }));
          showToast('AI 대화 캡처 사진이 정상 등록되었습니다! 📸');
        };
        reader.readAsDataURL(file);
      };

      const saveReport = function(isSubmit) {
        const userKey = currentUser.role === 'teacher' ? 'teacher_preview' : currentUser.id;
        const userName = currentUser.role === 'teacher' ? '교사(점검용)' : currentUser.name;
        const sData = allSubmissions[userKey] || { studentId: userKey, studentName: userName, reports: {} };
        const now = new Date().toLocaleString('ko-KR');
        const upReports = Object.assign({}, sData.reports, {
          [reportForm.slot]: Object.assign({}, reportForm, { isSubmitted: isSubmit, updatedAt: now })
        });
        const up = Object.assign({}, allSubmissions, {
          [userKey]: Object.assign({}, sData, { reports: upReports })
        });
        setAllSubmissions(up);
        localStorage.setItem('music_assessment_submissions', JSON.stringify(up));
        setActiveReportModal(false);
        showToast(currentUser.role === 'teacher'
          ? (isSubmit ? '[교사 점검] 보고서 최종 제출 시뮬레이션 완료! 🎉' : '[교사 점검] 임시 저장 완료! 💾')
          : (isSubmit ? '보고서가 최종 제출되었습니다! 🎉' : '임시 저장되었습니다. 💾')
        );
      };

      const resetAllData = function() {
        const c = prompt('모든 학생 계정(학번/비밀번호) 및 제출 데이터를 완전히 삭제하시겠습니까?\n진행하시려면 "RESET"을 입력하세요.');
        if (c === 'RESET') {
          localStorage.removeItem('music_assessment_submissions');
          localStorage.removeItem('music_student_accounts');
          setAllSubmissions({});
          if (currentUser && currentUser.role === 'student') setCurrentUser(null);
          showToast('학기 데이터가 완전히 초기화되었습니다. 🔄');
        }
      };

      const saveTeacherGrading = function() {
        if (!gradingStudentId) return;
        const target = allSubmissions[gradingStudentId];
        if (!target) return;

        const score1 = Number(gradingForm.r1_content) + Number(gradingForm.r1_analysis); // 30점 만점
        const score2 = Number(gradingForm.r2_content) + Number(gradingForm.r2_analysis); // 30점 만점
        const total = score1 + score2; // 총 60점 만점

        const up = Object.assign({}, allSubmissions, {
          [gradingStudentId]: Object.assign({}, target, {
            grading: Object.assign({}, gradingForm, {
              score1: score1,
              score2: score2,
              totalScore: total,
              gradedAt: new Date().toLocaleString('ko-KR')
            })
          })
        });

        setAllSubmissions(up);
        localStorage.setItem('music_assessment_submissions', JSON.stringify(up));
        setGradingStudentId(null);
        showToast(target.studentName + ' 학생 채점이 저장되었습니다! (총점 ' + total + '점 / 60점) 🌟');
      };

      const downloadCSV = function() {
        const rows = [['학번', '성명', '과제1 주제', '과제1 점수(30)', '과제1 제출', '과제2 주제', '과제2 점수(30)', '과제2 제출', '총점(60)', '세특 메모']];
        Object.values(allSubmissions).forEach(function(s) {
          const r1 = s.reports && s.reports.report1;
          const r2 = s.reports && s.reports.report2;
          const sc1 = s.grading && s.grading.score1 !== undefined ? s.grading.score1 : '-';
          const sc2 = s.grading && s.grading.score2 !== undefined ? s.grading.score2 : '-';
          const total = s.grading && s.grading.totalScore !== undefined ? s.grading.totalScore : '미채점';

          rows.push([
            s.studentId,
            s.studentName,
            r1 ? ('"' + r1.topicTitle.replace(/"/g, '""') + '"') : '미선택',
            sc1,
            r1 && r1.isSubmitted ? '제출' : '미제출',
            r2 ? ('"' + r2.topicTitle.replace(/"/g, '""') + '"') : '미선택',
            sc2,
            r2 && r2.isSubmitted ? '제출' : '미제출',
            total,
            '"' + ((s.grading && s.grading.teacherFeedback) || '').replace(/"/g, '""') + '"'
          ]);
        });
        const blob = new Blob(['\uFEFF' + rows.map(function(r) { return r.join(','); }).join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '송악고_음악수행평가_채점결과_' + new Date().toISOString().slice(0, 10) + '.csv';
        a.click();
        URL.revokeObjectURL(url);
        showToast('채점 결과 엑셀(CSV) 파일이 다운로드되었습니다.');
      };

      return e('div', { className: 'min-h-screen flex flex-col' },
        // 토스트 메시지
        toastMessage && e('div', { className: 'fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-5 py-2.5 rounded-full shadow-2xl text-xs font-bold border border-slate-700 flex items-center gap-2' },
          e('i', { className: 'fa-solid fa-circle-check text-emerald-400' }),
          e('span', null, toastMessage)
        ),

        // 메인 헤더
        e('header', { className: 'bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm' },
          e('div', { className: 'max-w-7xl mx-auto px-4 py-3 flex items-center justify-between' },
            e('div', { className: 'flex items-center gap-3' },
              e('div', { className: 'w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 via-teal-600 to-indigo-600 flex items-center justify-center text-white shadow' },
                e('i', { className: 'fa-solid fa-compass text-lg' })
              ),
              e('div', null,
                e('div', { className: 'flex items-center gap-2' },
                  e('h1', { className: 'text-base sm:text-lg font-black text-slate-900' }, '송악고등학교 음악 수행평가'),
                  e('span', { className: 'text-2xs font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800' }, '개인 탐구 2개 30점씩 총 60점 만점')
                ),
